<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebXR Particles</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #hint { position: fixed; left: 16px; top: 16px; color: #9ab; font-size: 13px; line-height: 1.6; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">拖动旋转视角 · 点击触发爆散<br>XR 内：手/手柄靠近吸引粒子，扳机/捏合 = 爆散</div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COUNT = 60000;
const CENTER = new THREE.Vector3(0, 1.4, -0.6); // 正前方一臂内

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0, 1.6, 0.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CENTER);
controls.enableDamping = true;
controls.update();

// ---- 粒子：位置全在顶点着色器里按时间解析算，CPU 零开销 ----
const geo = new THREE.BufferGeometry();
const seed = new Float32Array(COUNT * 4);
for (let i = 0; i < COUNT; i++) {
  seed[i * 4 + 0] = Math.pow(Math.random(), 0.6);      // 半径
  seed[i * 4 + 1] = Math.random() * Math.PI * 2;       // 初始角
  seed[i * 4 + 2] = (Math.random() - 0.5) * 2;         // 高度
  seed[i * 4 + 3] = Math.random();                     // 随机值
}
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT * 3), 3));
geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
geo.boundingSphere = new THREE.Sphere(CENTER, 10);

const uniforms = {
  uTime:     { value: 0 },
  uCenter:   { value: CENTER },
  uAttract:  { value: [new THREE.Vector3(0, -99, 0), new THREE.Vector3(0, -99, 0)] },
  uBurst:    { value: 0 },
  uPx:       { value: innerHeight },   // 画面像素高度：网页取画布高度，XR 里取每只眼的画面高度
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    attribute vec4 aSeed;
    uniform float uTime, uBurst, uPx;
    uniform vec3 uCenter;
    uniform vec3 uAttract[2];
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      float r = 0.04 + aSeed.x * 0.32;
      float ang = aSeed.y + uTime * (0.35 / (r + 0.08)) ;
      // 螺旋臂 + 呼吸
      ang += r * 6.0;
      float h = aSeed.z * 0.06 * (1.0 - aSeed.x * 0.6)
              + sin(uTime * 1.3 + aSeed.w * 6.28 + r * 10.0) * 0.015;
      vec3 p = uCenter + vec3(cos(ang) * r, h, sin(ang) * r);

      // 爆散：沿径向推出去
      vec3 dir = normalize(p - uCenter + vec3(0.0001));
      p += dir * uBurst * (0.15 + aSeed.w * 0.35);

      // 手/手柄吸引
      for (int i = 0; i < 2; i++) {
        vec3 d = uAttract[i] - p;
        float dist = length(d);
        float k = smoothstep(0.25, 0.0, dist);
        p += d * k * 0.7;
        // 被吸住的粒子在指尖附近打转
        p += vec3(sin(uTime * 4.0 + aSeed.w * 30.0), cos(uTime * 3.0 + aSeed.y * 10.0), sin(uTime * 5.0 + aSeed.x * 20.0)) * 0.02 * k;
      }

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float size = (1.2 + aSeed.w * 2.0) * (1.0 + uBurst * 0.6);
      // 按世界尺寸换算成像素：网页和 VR 里看上去一样大
      gl_PointSize = clamp(size * 0.003 * projectionMatrix[1][1] * uPx * 0.5 / -mv.z, 1.0, 48.0);

      vec3 core = vec3(1.0, 0.85, 0.6);
      vec3 mid  = vec3(0.9, 0.3, 0.9);
      vec3 edge = vec3(0.2, 0.6, 1.0);
      vColor = aSeed.x < 0.4 ? mix(core, mid, aSeed.x / 0.4) : mix(mid, edge, (aSeed.x - 0.4) / 0.6);
      vColor = mix(vColor, vec3(1.0), uBurst * 0.3);
      vAlpha = 0.55 + 0.45 * sin(uTime * 2.0 + aSeed.w * 40.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      float a = smoothstep(0.5, 0.0, d);
      a *= a;
      gl_FragColor = vec4(vColor * a * vAlpha, a * vAlpha);
    }
  `,
});
scene.add(new THREE.Points(geo, mat));

// ---- XR 输入：手柄 + 手势 ----
let burst = 0;
const trigger = () => { burst = 1; };
const ctrls = [0, 1].map(i => {
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', trigger);
  scene.add(c);
  return c;
});
const hands = [0, 1].map(i => {
  const h = renderer.xr.getHand(i);
  h.addEventListener('pinchstart', trigger);
  scene.add(h);
  return h;
});
renderer.domElement.addEventListener('pointerdown', e => { if (!renderer.xr.isPresenting && e.button === 0) trigger(); });

const tmp = new THREE.Vector3();
function attractorFor(i) {
  const tip = hands[i].joints && hands[i].joints['index-finger-tip'];
  if (tip && tip.visible) return tip.getWorldPosition(tmp);
  if (ctrls[i].visible && renderer.xr.isPresenting) return ctrls[i].getWorldPosition(tmp);
  return null;
}

// 按钮：有 AR 就给 AR（直透），也给 VR
const vrBtn = VRButton.createButton(renderer);
const arBtn = ARButton.createButton(renderer, { optionalFeatures: ['hand-tracking', 'local-floor'] });
arBtn.style.left = 'calc(50% + 80px)';
vrBtn.style.left = 'calc(50% - 180px)';
document.body.append(vrBtn, arBtn);

renderer.xr.addEventListener('sessionstart', () => {
  renderer.setClearColor(0x000000, renderer.xr.getSession().environmentBlendMode === 'opaque' ? 1 : 0);
  document.getElementById('hint').style.display = 'none';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
// 进 XR 后每只眼睛画面的像素高度：老接口是 framebufferHeight，新的投影图层是 textureHeight，都没有就取左眼视口
function xrPixelHeight() {
  const layer = renderer.xr.getBaseLayer && renderer.xr.getBaseLayer();
  let h = layer && (layer.framebufferHeight || layer.textureHeight);
  if (!h) { const cam = renderer.xr.getCamera(); h = cam.cameras && cam.cameras[0] && cam.cameras[0].viewport && cam.cameras[0].viewport.w; }
  return h || renderer.domElement.height;
}
renderer.setAnimationLoop(() => {
  uniforms.uPx.value = renderer.xr.isPresenting ? xrPixelHeight() : renderer.domElement.height;
  const dt = Math.min(clock.getDelta(), 0.05);
  uniforms.uTime.value += dt;
  burst = Math.max(0, burst - dt * 1.2);
  uniforms.uBurst.value = burst * burst * (3 - 2 * burst);
  for (let i = 0; i < 2; i++) {
    const p = attractorFor(i);
    uniforms.uAttract.value[i].copy(p || tmp.set(0, -99, 0));
  }
  if (!renderer.xr.isPresenting) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
