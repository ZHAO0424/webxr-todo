<style>
  :root { --ink: #ece7dc; --mute: #9d97a8; --line: rgba(236,231,220,.16); --gold: #c9a45c; --bg: #0b0a0d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Songti SC", "STSong", "SimSun", Georgia, serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.over { cursor: pointer; }
  #veil { position: fixed; inset: 0; background: var(--bg); z-index: 30; pointer-events: none; opacity: 1; transition: opacity 1.2s ease; }

  #info { position: fixed; left: 24px; bottom: 26px; z-index: 10; max-width: 440px; width: calc(100% - 48px); transition: opacity .3s, transform .3s; }
  #info.swap { opacity: 0; transform: translateY(8px); }

  #list .foot a { display: inline; text-decoration: underline; }
  /* 英文：西文字体排前面（宋体里的西文字形不好看），大标题的字距收一点 */
  :root[lang="en"] body { font-family: Georgia, "Songti SC", "STSong", "SimSun", serif; }

  }
</style>

<script type="module">
import * as THREE from 'three';
import { hop, go as hopGo } from './xr-hop.js';   // 在主页进一次 VR：走进画、换画、回画廊都在同一个会话里
import { xrCaption } from './xr-caption.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';
THREE.ColorManagement.enabled = false;
const $ = id => document.getElementById(id);
const W = window.WORKS, N = W.length, STEP = Math.PI * 2 / N;
const RING = 6.6, FLOOR = -1.55;

// ---------- 中 / 英 ----------
// 静态文字用 data-i18n 挂键；作品的名字、介绍、标签从 works.js 的 workText(w) 取。语言按钮在右下角两个箭头左边
const I18N = window.MP_I18N;
const TEXT = {
  zh: {
    pageTitle: '入画 · Into the Painting', kicker: 'INTO THE PAINTING · NINE ROOMS', title: '入画', sub: '九幅名画，九种走进去的方式',
    list: '目录', close: '关闭', listLabel: '全部作品', enter: '进入', prev: '上一幅', next: '下一幅', langBtn: 'EN', langTitle: 'Switch to English',
    hint: '拖动 · 滚轮 · 方向键浏览<br>点击正中的画，走进去<br>戴上头显：点右上角 VR，进一次，全程不出来',
    foot: '每一件都不复制原画，而是挑一种和那幅画精神相合的算法，把画放进你周围的空间里，再给它一个只属于它的交互。电脑上用鼠标，头显里用手、视线或声音。所有画作均为公有领域，图片来自 Wikimedia Commons。WebXR 需要 HTTPS 或 localhost；离线烘焙脚本在 <code>bake/</code>。← <a href="../">全部作品</a>',
    plateHint: '对准它捏合，走进去 · 捏住左右拖，换一幅',
    xrIntro: ['入画', 'Into the Painting', '捏住左右拖，换一幅 · 对准正中的画捏合，走进去'],
  },
  en: {
    pageTitle: 'Into the Painting', kicker: 'NINE PAINTINGS · NINE ROOMS', title: 'Into the Painting', sub: 'Nine masterpieces, nine ways to step inside',
    list: 'Works', close: 'Close', listLabel: 'All works', enter: 'Enter', prev: 'Previous', next: 'Next', langBtn: '中文', langTitle: '切换到中文',
    hint: 'Drag, scroll or use the arrow keys to browse<br>Click the painting in the center to step in<br>In a headset: tap Enter XR at top right, and stay in throughout',
    foot: 'None of these copies the original. Each piece pairs a painting with an algorithm in tune with its spirit, sets it in the space around you, and gives it an interaction of its own: a mouse on a computer; hands, gaze or voice in a headset. All paintings are in the public domain; images from Wikimedia Commons. WebXR needs HTTPS or localhost; the offline bake scripts are in <code>bake/</code>. ← <a href="../">All works</a>',
    plateHint: 'Pinch it to step in · pinch and drag to browse',
    xrIntro: ['Into the Painting', '入画', 'Pinch and drag to browse · pinch the center painting to step in'],
  },
};
const L = k => I18N ? I18N.t(TEXT, k) : TEXT.zh[k];
const T = w => window.workText ? workText(w) : { title: w.zh, sub: w.en, blurb: w.blurb, tags: w.tags };

// ---------- 画廊：你站在一间暗室正中，九幅画挂成一圈，正对你的那幅被一束光照着；鼠标是一盏提灯 ----------
const renderer = hop.renderer || new THREE.WebGLRenderer({ antialias: true, alpha: true });   // alpha：之后走进的作品要用 AR 透视
hop.attach(renderer);
renderer.xr.enabled = true;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x0b0a0d);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.05, 100);
const rig = new THREE.Group(); scene.add(rig); rig.add(camera);   // 头显里把人（相机、手柄、手）放低到画廊的地板上
const torch = new THREE.Vector3(-9999, -9999, 0);          // 提灯：屏幕像素坐标 + 强度

// 墙：一圈暗色的圆筒；每幅画后面的墙被灯打亮一团，正中那幅最亮
const wallU = { uRot: { value: 0 }, uView: { value: 0 }, uTorch: { value: torch } };
const wall = new THREE.Mesh(new THREE.CylinderGeometry(RING + 0.4, RING + 0.4, 9, 128, 1, true), new THREE.ShaderMaterial({
  side: THREE.BackSide, uniforms: wallU,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uRot, uView; uniform vec3 uTorch; varying vec3 vP;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main() {
      float th = atan(vP.x, -vP.z) + uRot;                                    // 墙面上的方位（跟着画一起转）
      float a = mod(th + ${(STEP / 2).toFixed(5)}, ${STEP.toFixed(5)}) - ${(STEP / 2).toFixed(5)};   // 离最近一幅画多远
      float view = mod(atan(vP.x, -vP.z) - uView + 3.14159265, 6.2831853) - 3.14159265;   // 离你正前方（头显里是视线方向）多远
      float front = exp(-view * view * 3.0);
      float pool = exp(-a * a * 16.0) * exp(-pow(vP.y - 1.0, 2.0) * 0.3) * (0.05 + 0.22 * front);
      vec3 c = vec3(0.050, 0.044, 0.048) * (0.8 + 0.3 * smoothstep(-4.5, 3.0, vP.y)) + vec3(0.95, 0.78, 0.55) * pool;
      vec2 d = gl_FragCoord.xy - uTorch.xy;
      c += vec3(0.9, 0.75, 0.55) * 0.05 * uTorch.z * exp(-dot(d, d) / 60000.0);
      c += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(c, 1.0);
    }`,
}));
wall.position.y = 1.5; scene.add(wall);
// 地：深色的打蜡地板，画倒映在上面
const floor = new THREE.Mesh(new THREE.CircleGeometry(RING + 0.4, 96), new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec2 vP; float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){ float r = length(vP); vec3 c = vec3(0.030, 0.026, 0.026) * (1.0 - 0.4 * smoothstep(1.0, 6.5, r)); c += (hash(gl_FragCoord.xy) - 0.5) / 255.0; gl_FragColor = vec4(c, 1.0); }`,
}));
floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR; floor.renderOrder = -1; scene.add(floor);

// 画：一块平面同时画画框和画；正对你的那幅亮，其余的暗；提灯照到哪里哪里亮
const ring = new THREE.Group(); scene.add(ring);
const paintVS = `varying vec2 vUv; varying vec3 vW; void main(){ vUv = uv; vW = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0); }`;
const paintFS = reflect => `
  uniform sampler2D tMap; uniform vec2 uSize; uniform float uFrame, uLit, uHover, uTime, uReady; uniform vec3 uTorch;
  varying vec2 vUv; varying vec3 vW;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  void main() {
    vec2 full = uSize + 2.0 * uFrame;
    vec2 p = (vUv - 0.5) * full;
    vec2 q = abs(p) - uSize * 0.5;
    vec3 c;
    if (q.x < 0.0 && q.y < 0.0) {
      vec2 uv = p / uSize + 0.5;
      c = mix(vec3(0.08), texture2D(tMap, uv).rgb, uReady);
      // 画面上一道慢慢扫过的光泽，像清漆
      float sheen = pow(max(0.0, 1.0 - abs(uv.x + uv.y * 0.35 - fract(uTime * 0.05) * 2.2 + 0.4) * 3.0), 6.0);
      c += c * sheen * 0.10 * uLit;
      // 画框投在画面上的一圈暗边
      float e = min(-q.x, -q.y); c *= 0.72 + 0.28 * smoothstep(0.0, 0.05, e);
    } else {
      // 画框：老金色，两道斜面
      float t = clamp(max(q.x, q.y) / uFrame, 0.0, 1.0);
      float bevel = sin(t * 6.28318) * 0.5 + 0.5;
      c = mix(vec3(0.20, 0.14, 0.07), vec3(0.62, 0.46, 0.22), bevel) * (0.8 + 0.2 * hash(floor(p * 140.0)));
      c *= 0.6 + 0.4 * smoothstep(-0.5, 0.5, p.y / full.y * 2.0);
    }
    // 光：从上方打下来的一束，正中那幅最亮
    float spot = 0.55 + 0.45 * smoothstep(-1.3, 1.1, p.y) * exp(-p.x * p.x * 0.12);
    vec3 lit = c * (0.12 + 0.95 * uLit * spot + 0.12 * uHover);
    vec2 d = gl_FragCoord.xy - uTorch.xy;
    lit += c * vec3(1.0, 0.86, 0.66) * 0.55 * uTorch.z * exp(-dot(d, d) / 26000.0);
    lit += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
    ${reflect ? `gl_FragColor = vec4(lit, 0.2 * (1.0 - smoothstep(${(FLOOR - 0.05).toFixed(2)}, ${(FLOOR - 2.4).toFixed(2)}, vW.y)));` : `gl_FragColor = vec4(lit, 1.0);`}
  }`;
const loader = new THREE.TextureLoader();
const paintings = W.map((w, k) => {
  const u = { tMap: { value: null }, uSize: { value: new THREE.Vector2(2, 2) }, uFrame: { value: 0.11 }, uLit: { value: 0.2 }, uHover: { value: 0 }, uTime: { value: 0 }, uReady: { value: 0 }, uTorch: { value: torch } };
  const mat = new THREE.ShaderMaterial({ uniforms: u, vertexShader: paintVS, fragmentShader: paintFS(false) });
  const rmat = new THREE.ShaderMaterial({ uniforms: u, vertexShader: paintVS, fragmentShader: paintFS(true), transparent: true, depthWrite: false, side: THREE.DoubleSide });
  const holder = new THREE.Group();
  const th = k * STEP;
  holder.position.set(Math.sin(th) * RING, 0, -Math.cos(th) * RING);
  holder.lookAt(0, 0, 0);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  const refl = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), rmat);
  mesh.userData.k = k;
  holder.add(mesh, refl); ring.add(holder);
  const fit = aspect => {
    const h = Math.min(2.25, 3.05 / aspect), wd = h * aspect, f = u.uFrame.value, cy = 0.35;
    u.uSize.value.set(wd, h);
    mesh.scale.set(wd + 2 * f, h + 2 * f, 1); mesh.position.y = cy;
    refl.scale.set(wd + 2 * f, -(h + 2 * f), 1); refl.position.y = 2 * FLOOR - cy;
  };
  fit(1.3);
  loader.load(`data/thumbs/${w.slug}.jpg`, t => { t.anisotropy = renderer.capabilities.getMaxAnisotropy(); u.tMap.value = t; fit(t.image.width / t.image.height); u.uReady.value = 1; });
  return { mesh, refl, u, holder, size: u.uSize.value };
});

// ---------- 交互 ----------
const mod = (a, n) => ((a % n) + n) % n;
const shortest = (a, b) => { let d = b - a; if (d > N / 2) d -= N; if (d < -N / 2) d += N; return d; };
const from = new URLSearchParams(location.search).get('from');
let target = Math.max(0, W.findIndex(w => w.slug === from)), cur = target, vel = 0, lastCi = null;
let drag = null, moved = 0, hoverK = -1, entering = null, shown = -1;
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(9, 9);
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, t: target }; moved = 0; cv.setPointerCapture(e.pointerId); cv.classList.add('dragging'); });
cv.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  const pr = renderer.getPixelRatio();
  torch.set(e.clientX * pr, (innerHeight - e.clientY) * pr, e.pointerType === 'mouse' ? 1 : 0);
  if (!drag) return;
  const dx = e.clientX - drag.x; moved = Math.max(moved, Math.abs(dx));
  target = drag.t - dx / Math.min(innerWidth, 900) * 2.2;
});
const release = () => {
  if (!drag) return;
  cv.classList.remove('dragging');
  if (moved < 6) {           // 是点击：点正中的画就进去，点旁边的画就转过去
    const k = pick(), f = mod(Math.round(target), N);
    if (k >= 0) { if (k === f) enter(); else target = Math.round(target) + shortest(f, k); }
  } else target = Math.round(target);
  drag = null;
};
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', () => { torch.z = 0; mouse.set(9, 9); });
let wheelLock = 0;
addEventListener('wheel', e => {
  if ($('list').classList.contains('on')) return;
  const now = performance.now(); if (now < wheelLock) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(d) < 4) return;
  target = Math.round(target) + Math.sign(d); wheelLock = now + 420;
}, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { toggleList(false); return; }
  if ($('list').classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === ']') target = Math.round(target) + 1;
  else if (e.key === 'ArrowLeft' || e.key === '[') target = Math.round(target) - 1;
  else if (e.key === 'Enter' && (renderer.xr.isPresenting || document.activeElement === document.body || document.activeElement === cv)) enter();
});
$('prev').onclick = () => { target = Math.round(target) - 1; };
$('next').onclick = () => { target = Math.round(target) + 1; };
$('enter').onclick = () => enter();
function pick() {
  if (mouse.x > 5) return -1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(paintings.map(p => p.mesh))[0];
  return hit ? hit.object.userData.k : -1;
}
// 走进画里：镜头朝那幅画推过去，画铺满视野，再黑下来换页
function enter(kXR) {
  hop.sfx('chord', { gain: 0.8 });
  if (renderer.xr.isPresenting) { hopGo(0, false, kXR !== undefined ? kXR : mod(Math.round(target), N)); return; }   // 头显里：不跳页，同一个会话里走进去
  if (entering) return;
  const k = mod(Math.round(target), N);
  target = Math.round(target);
  entering = { k, t0: performance.now() };
  setTimeout(() => $('veil').classList.remove('off'), 700);
  setTimeout(() => { location.href = `${W[k].slug}.html`; }, 1750);
}

// 目录
const toggleList = on => { $('list').classList.toggle('on', on); $('listBtn').setAttribute('aria-expanded', on); $('listBtn').textContent = L(on ? 'close' : 'list'); };
$('listBtn').onclick = () => toggleList(!$('list').classList.contains('on'));
const fillList = () => { $('listOl').innerHTML = W.map(w => `<li><a href="${w.slug}.html"><img src="data/thumbs/${w.slug}.jpg" alt="" loading="lazy"><b>${T(w).title}</b><i>AFTER ${w.after.toUpperCase()} · ${w.year}</i></a></li>`).join(''); };
fillList();

let swapT = 0;
function showInfo(k) {
  if (k === shown) return;
  const first = shown < 0; shown = k;
  const w = W[k], el = $('info');
  const fill = () => { fillInfo(k); el.classList.remove('swap'); };
  clearTimeout(swapT);
  if (first) fill(); else { el.classList.add('swap'); swapT = setTimeout(fill, 280); }
  history.replaceState(null, '', `?from=${w.slug}`);
}
function fillInfo(k) {
  const w = W[k], t = T(w);
  $('iAfter').textContent = `After ${w.after} · ${w.year}`;
  $('iZh').textContent = t.title; $('iEn').textContent = t.sub; $('iBlurb').textContent = t.blurb;
  $('iTags').innerHTML = t.tags.map(s => `<span>${s}</span>`).join('');
  $('count').innerHTML = `${String(k + 1).padStart(2, '0')} <small>/ ${String(N).padStart(2, '0')}</small>`;
}

// ---------- 头显里的画廊：一副在眼前的轮牌 ----------
// 眼镜的视场只有正前方几十度，九幅画围成一圈就得转身去找。所以头显里画不再挂满一圈，而是在眼前
// 排成轮牌：正中一幅，左右各斜着露出一两张。换画是把牌拨过来，不是把头转过去。
//   快捏快放：对着正中的画 → 走进去；对着旁边那张 → 把它转到正中；对着空白处 → 往那一侧翻一张
//   捏住拖：左右拖动整副牌，松手带一点惯性，停在最近的一幅
// 不再"看住一会儿就进去"：看是为了看，读名牌、端详画面时不该触发任何动作。
const EYE_H = 1.55;                                         // 头显里人的脚踩在画廊的地板上（地板在 y = -1.55）
// 正中那幅离眼 2.6 米、缩到 0.28 倍：最高的画约占 15° 视角，下面的名牌也还在眼镜约 24° 的竖直视场里；
// 相邻两张差 18°，往后退、缩小，只在视场边上露一半；拖动时射线落点横移 0.5 米 = 一张
const XRC = { D: 2.6, S: 0.28, GAP: 18 * Math.PI / 180, PER: 0.5, TAP: 0.04 };
const xr = { ctrls: [], hoverK: -1, anchored: false, yaw: 0, follow: false, drag: null };
const homeXf = paintings.map(p => ({ p: p.holder.position.clone(), q: p.holder.quaternion.clone() }));
// 正中那幅下面的名牌：作品名、英文名、怎么操作
const label = (() => {
  const c = document.createElement('canvas'); c.width = 1536; c.height = 420;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2 * 420 / 1536), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, toneMapped: false }));
  m.visible = false; m.renderOrder = 5;
  const g = c.getContext('2d');
  // 一行放不下就缩小字号（英文名比中文长）；英文时西文字体排前面
  const fit = (txt, y, font, size, spacing) => {
    for (let n = 0; n < 8; n++) { g.font = font.replace('$', size); g.letterSpacing = `${spacing}px`; if (g.measureText(txt).width <= c.width - 60) break; size *= 0.9; spacing *= 0.9; }
    g.fillText(txt, c.width / 2, y);
  };
  const draw = k => {
    const w = W[k], t = T(w), en = I18N && I18N.lang === 'en'; g.clearRect(0, 0, c.width, c.height); g.textAlign = 'center'; g.textBaseline = 'middle';
    const serif = en ? 'Georgia, "Songti SC", "STSong", "SimSun", serif' : '"Songti SC", "STSong", "SimSun", serif';
    g.fillStyle = 'rgba(201,164,92,.95)'; g.font = '500 44px system-ui, sans-serif'; g.letterSpacing = '10px';
    g.fillText(`${k + 1} / ${N} · AFTER ${w.after.toUpperCase()} · ${w.year}`, c.width / 2, 60);
    g.fillStyle = '#f3ede2'; fit(t.title, 185, `400 $px ${serif}`, en ? 116 : 130, en ? 4 : 20);
    g.fillStyle = 'rgba(232,224,210,.78)'; fit(t.sub, 290, `italic $px ${en ? serif : '"Songti SC", Georgia, serif'}`, 52, 2);
    g.fillStyle = 'rgba(232,224,210,.6)'; fit(L('plateHint'), 375, '500 $px system-ui, sans-serif', 40, 6);
    m.material.map.needsUpdate = true;
  };
  return { m, draw, k: -1 };
})();
const cap = xrCaption({ renderer, scene, camera });
const vrBtn = VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking', 'local-floor'] });
const arBtn = ARButton.createButton(renderer, { optionalFeatures: ['hand-tracking', 'local-floor'] });
document.body.append(vrBtn, arBtn);
const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]);
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color: 0xdeba6e, transparent: true, opacity: 0.4 }));
  line.scale.z = 3; c.add(line); c.userData.k = -1;
  c.addEventListener('selectstart', () => pinchStart(c));
  c.addEventListener('selectend', () => pinchEnd(c));
  rig.add(c); xr.ctrls.push(c);
  rig.add(renderer.xr.getHand(i));
}
renderer.xr.addEventListener('sessionstart', () => {
  const opaque = renderer.xr.getSession().environmentBlendMode === 'opaque';
  rig.position.y = -EYE_H;                                  // 地板在脚下，画挂在眼睛的高度
  wall.visible = floor.visible = opaque;                    // AR：只留下画，挂在真实的房间里
  renderer.setClearColor(0x0b0a0d, opaque ? 1 : 0);
  entering = null; torch.z = 0; mouse.set(9, 9);
  xr.anchored = false; xr.drag = null;
  paintings.forEach(p => { p.refl.visible = false; });     // 倒影是按一圈大画算的位置，轮牌里不要
  label.m.scale.setScalar(1.5);
  cap.show(() => L('xrIntro'), 9);                          // 传函数：显示中换了语言会按新语言重画
});
renderer.xr.addEventListener('sessionend', () => {
  rig.position.y = 0; wall.visible = floor.visible = true; renderer.setClearColor(0x0b0a0d, 1);
  ring.position.set(0, 0, 0); xr.drag = null; xr.hoverK = -1;
  paintings.forEach((p, k) => { p.holder.position.copy(homeXf[k].p); p.holder.quaternion.copy(homeXf[k].q); p.holder.scale.setScalar(1); p.holder.visible = true; p.refl.visible = true; });
  label.m.visible = false; label.m.scale.setScalar(1); wallU.uView.value = 0;
});
const xrTmp = { o: new THREE.Vector3(), d: new THREE.Vector3(), p: new THREE.Vector3(), q: new THREE.Vector3(), m: new THREE.Matrix4(), v: new THREE.Vector3() };
const meshes = paintings.map(p => p.mesh);
// 射线打中哪幅画（藏起来的不算：Raycaster 不管 visible）
const hitK = (o, d) => { ray.set(o, d); const h = ray.intersectObjects(meshes.filter(mm => mm.parent.visible))[0]; return h ? h.object.userData.k : -1; };
// 射线在轮牌上的横向落点（米）：手平移和手腕转动都算。用角度而不是和平面求交，射线朝上朝下也不会跳
function aimX(c) {
  const { p, q, m } = xrTmp;
  m.identity().extractRotation(c.matrixWorld);
  p.setFromMatrixPosition(c.matrixWorld); q.set(0, 0, -1).applyMatrix4(m);
  ring.worldToLocal(p);
  q.applyAxisAngle(THREE.Object3D.DEFAULT_UP, -ring.rotation.y);
  return p.x + XRC.D * Math.atan2(q.x, -q.z);
}
function pinchStart(c) {
  if (xr.drag || entering) return;                          // 一次只认一只手在拨
  const x = aimX(c), now = performance.now();
  xr.drag = { c, x0: x, lx: x, t0: now, tgt0: target, moved: 0, v: 0 };
}
function pinchEnd(c) {
  const g = xr.drag; if (!g || g.c !== c) return;
  xr.drag = null;
  if (g.moved < XRC.TAP && performance.now() - g.t0 < 700) return tap(c, g.x0);
  target = Math.round(target + Math.max(-2, Math.min(2, g.v * 0.18)));   // 甩一下多翻一两张
}
function tap(c, x) {
  const k = c.userData.k, f = mod(Math.round(target), N);
  if (k === f) enter(k);                                    // 正中那幅：走进去
  else if (k >= 0) target = Math.round(target) + shortest(f, k);   // 旁边那张：转过来
  else target = Math.round(target) + (x < 0 ? -1 : 1);      // 空白处：往那一侧翻一张
}
function xrStep(dt) {
  // 头的位置取用户相机（挂在 rig 下，three 每帧把 XR 姿态写进它）。xr.getCamera() 的 getWorldPosition
  // 会按它自己的 position 重算世界矩阵，丢掉 rig 往下放的 1.55 米 —— 轮牌会锚到头顶上方去
  const { o, d, p, q, m, v } = xrTmp;
  camera.getWorldPosition(o); camera.getWorldDirection(d);
  // 轮牌锚在进 VR 时你面朝的方向、眼睛的高度；转头超过 50° 才慢慢跟过去，人走动时也慢慢跟着
  const yaw = Math.atan2(-d.x, -d.z);
  if (!xr.anchored) { xr.anchored = true; xr.yaw = yaw; ring.position.set(o.x, o.y + 0.02, o.z); }
  const dyaw = Math.atan2(Math.sin(yaw - xr.yaw), Math.cos(yaw - xr.yaw));
  if (Math.abs(dyaw) > 50 * Math.PI / 180) xr.follow = true;
  if (xr.follow) { xr.yaw += dyaw * Math.min(1, dt * 2); if (Math.abs(dyaw) < 0.05) xr.follow = false; }
  ring.position.lerp(v.set(o.x, o.y + 0.02, o.z), Math.min(1, dt * 1.2));
  ring.rotation.y = xr.yaw;
  wallU.uView.value = -xr.yaw;                              // 墙上的光打在轮牌后面
  // 拖动：射线落点横移多少，牌就拨过去多少张
  const g = xr.drag;
  if (g) {
    const x = aimX(g.c), dx = x - g.x0;
    g.moved = Math.max(g.moved, Math.abs(dx));
    if (g.moved >= XRC.TAP) {
      target = g.tgt0 - dx / XRC.PER;
      const vi = -(x - g.lx) / XRC.PER / Math.max(dt, 1e-3);
      g.v += (vi - g.v) * Math.min(1, dt * 12);
    }
    g.lx = x;
  }
  // 排牌：正中一幅正对你，两侧的往后退、缩小、朝里斜
  paintings.forEach((pt, k) => {
    const off = mod(k - cur + N / 2, N) - N / 2, ao = Math.abs(off), h = pt.holder;
    h.visible = ao < 2.7;
    const a = off * XRC.GAP, r = XRC.D + Math.min(ao, 2) * 0.55;
    h.position.set(Math.sin(a) * r, 0, -Math.cos(a) * r);
    h.rotation.set(0, -a - Math.sign(off) * Math.min(ao, 1) * 0.45, 0);
    h.scale.setScalar(XRC.S * (1 - 0.2 * Math.min(ao, 2)));
    pt.u.uLit.value = Math.exp(-off * off * 1.6) * (1 - Math.max(0, Math.min(1, (ao - 2) / 0.7)));
  });
  // 手 / 手柄的射线指着哪幅
  for (const c of xr.ctrls) {
    m.identity().extractRotation(c.matrixWorld);
    c.userData.k = c.visible ? hitK(p.setFromMatrixPosition(c.matrixWorld), q.set(0, 0, -1).applyMatrix4(m)) : -1;
  }
  const pointed = xr.ctrls.map(c => c.userData.k).find(k => k >= 0);
  xr.hoverK = pointed !== undefined ? pointed : -1;
  paintings.forEach((pt, k) => { pt.u.uHover.value += ((xr.hoverK === k ? 1 : 0) - pt.u.uHover.value) * Math.min(1, dt * 8); });
  // 名牌挂在正中那幅下面；牌在转的时候先收起来
  const f = mod(Math.round(target), N), pt = paintings[f];
  if (label.k !== f) { pt.holder.add(label.m); label.draw(f); label.k = f; }
  label.m.position.set(0, 0.35 - pt.size.y / 2 - 0.11 - 0.5, 0.02);
  label.m.visible = Math.abs(cur - target) < 0.25 && !g;
  return { hoverK: xr.hoverK, cur: +cur.toFixed(2), target: +target.toFixed(2), drag: !!g, label: label.m.visible, yaw: +xr.yaw.toFixed(2) };
}
window.__xrStep = xrStep;   // 测试钩子

// ---------- 动画 ----------
const clock = new THREE.Clock();
let time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  // 弹簧：转到目标那一格
  vel += ((target - cur) * 38 - vel * 11) * dt; cur += vel * dt;
  const ci = Math.round(cur); if (ci !== lastCi) { if (lastCi !== null) hop.sfx('note', { deg: mod(ci, 8), gain: 0.55 }); lastCi = ci; }   // 每转过一幅，一个琴音
  ring.rotation.y = cur * STEP; wallU.uRot.value = cur * STEP;
  showInfo(mod(Math.round(target), N));
  if (renderer.xr.isPresenting) { paintings.forEach(p => { p.u.uTime.value = time; }); xrStep(dt); renderer.render(scene, camera); return; }
  hoverK = drag || entering ? -1 : pick();
  cv.classList.toggle('over', hoverK >= 0);
  paintings.forEach((p, k) => {
    const dist = Math.abs(mod(k - cur + N / 2, N) - N / 2);           // 离正中几格（连续）
    p.u.uLit.value = Math.exp(-dist * dist * 2.2);
    p.u.uHover.value += ((hoverK === k ? 1 : 0) - p.u.uHover.value) * Math.min(1, dt * 8);
    p.u.uTime.value = time;
  });
  // 镜头：鼠标轻轻带一点视差；走进去时向画推近
  const mx = mouse.x > 5 ? 0 : mouse.x, my = mouse.x > 5 ? 0 : mouse.y;
  camera.rotation.set(my * 0.025 + 0.02, -mx * 0.035, 0, 'YXZ');
  if (entering) {
    const t = Math.min(1, (performance.now() - entering.t0) / 1500), e = t * t * (3 - 2 * t);
    camera.position.set(0, 0.35 * e, -(RING - 1.9) * e);
    camera.rotation.set(0, 0, 0);
    camera.fov = baseFov * (1 - 0.27 * e); camera.updateProjectionMatrix();
  } else camera.position.set(0, 0.05 * Math.sin(time * 0.4), 0);
  renderer.render(scene, camera);
});
let baseFov = 52;
const fitFov = () => { camera.aspect = innerWidth / innerHeight; const hf = 44 * Math.PI / 180; baseFov = Math.max(52, 2 * Math.atan(Math.tan(hf / 2) / camera.aspect) * 180 / Math.PI); camera.fov = baseFov; camera.updateProjectionMatrix(); };
fitFov();
addEventListener('resize', () => { fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('pageshow', e => { if (e.persisted) { entering = null; camera.fov = baseFov; camera.updateProjectionMatrix(); } requestAnimationFrame(() => $('veil').classList.add('off')); });
window.__goto = k => { target = cur = k; };   // 测试钩子
// 换语言：静态文字按 data-i18n 重刷，作品介绍、目录、名牌当场重写（不走淡出）
function applyLang() {
  document.title = L('pageTitle');
  if (I18N) I18N.apply(TEXT, document);
  $('listBtn').textContent = L($('list').classList.contains('on') ? 'close' : 'list');
  fillList();
  if (shown >= 0) fillInfo(shown);
  if (label.k >= 0) label.draw(label.k);
}
applyLang();
$('lang').onclick = () => { if (I18N) I18N.toggle(); };
if (I18N) I18N.onChange(applyLang); else $('lang').style.display = 'none';
setTimeout(() => $('veil').classList.add('off'), 60);
if (location.search.includes('shot')) $('veil').style.display = 'none';
</script>
