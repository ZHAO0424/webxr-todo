<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>渐变 · Flux</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EFE9DC; }
  body { font: 13px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #2B2118; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: space-between;
  }
  #ui > * { pointer-events: auto; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: .22em; }
  .sub { font-size: 12px; opacity: .5; letter-spacing: .06em; }

  footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hint { font-size: 12px; opacity: .55; max-width: 34ch; }
  .hint b { font-weight: 500; opacity: .85; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12px; padding: 8px 15px; cursor: pointer;
    border: 1px solid rgba(43,33,24,.28); background: rgba(255,253,248,.72);
    color: #2B2118; border-radius: 2px; letter-spacing: .06em;
    backdrop-filter: blur(6px); transition: background .15s, border-color .15s;
  }
  button:hover { background: rgba(255,253,248,.95); border-color: rgba(43,33,24,.5); }
  button:disabled { opacity: .35; cursor: default; }

  html[data-dark] #panel { background: rgba(10,14,22,.88); border-left-color: rgba(200,212,228,.18); }
  html[data-dark] button { background: rgba(16,22,34,.72); color: #C8D4E4; border-color: rgba(200,212,228,.3); }
  html[data-dark] button:hover { background: rgba(26,34,50,.95); }
  html[data-dark] .row select { background: #10141E; color: #C8D4E4; border-color: rgba(200,212,228,.25); }
  html[data-dark] .row input[type=range] { accent-color: #5AC8FF; }
  #panel {
    position: fixed; top: 0; right: 0; height: 100%; width: 260px; max-width: 80vw;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 20px calc(22px + env(safe-area-inset-bottom, 0px));
    background: rgba(250,246,238,.9); backdrop-filter: blur(10px);
    border-left: 1px solid rgba(43,33,24,.14);
    overflow-y: auto; transform: translateX(100%); transition: transform .25s ease;
  }
  #panel.open { transform: none; }
  #recenter, #exit { display: none; }
  body.xr-active #recenter, body.xr-active #exit { display: inline-block; }
  body.xr-active .hint, body.xr-active #xr { display: none; }
  body.xr-active #exit { border-color: rgba(255,120,110,.55); }
  #ui.shift footer { padding-right: 272px; }
  #panel h2 { display: flex; justify-content: space-between; align-items: center; }
  #close {
    font: inherit; font-size: 18px; line-height: 1; padding: 2px 8px 4px; cursor: pointer;
    background: none; border: none; color: inherit; opacity: .55; letter-spacing: 0;
  }
  #close:hover { opacity: 1; background: none; }
  #panel h2 { margin: 0 0 14px; font-size: 12px; font-weight: 500; letter-spacing: .18em; opacity: .5; }
  .row { margin-bottom: 13px; }
  .row label { display: flex; justify-content: space-between; font-size: 11px; opacity: .65; margin-bottom: 3px; }
  .row input[type=range] { width: 100%; accent-color: #2B2118; }
  .row select { width: 100%; font: inherit; font-size: 12px; padding: 5px; background: #fff;
                border: 1px solid rgba(43,33,24,.22); border-radius: 2px; color: inherit; }
  #stat { font-size: 11px; opacity: .45; margin-top: 16px; font-variant-numeric: tabular-nums; }

  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
         background: #EFE9DC; text-align: center; font-size: 14px; line-height: 1.8; }

  @media (max-width: 560px) { .hint { display: none; } h1 { font-size: 18px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <header>
    <h1 id="title">渐变</h1>
    <span class="sub">伸手搅动 · WebXR</span>
  </header>
  <footer>
    <div class="hint">
      <b>桌面</b>：移动鼠标搅动 · 按住左键注入 · 右键拖拽转视角 · 滚轮远近 · <b>R</b> 重置 · <b>H</b> 面板<br>
      <b>头显</b>：双手伸进去搅 · <b>握拳</b>吸拢并拖动整团 · 任一手捏合注入 · 摆位/退出用左边按钮
    </div>
    <div class="btns">
      <button id="xr" disabled>检测 XR…</button>
      <button id="recenter">重新摆位</button>
      <button id="exit">退出 VR</button>
      <button id="toggle">参数</button>
      <button id="reset">重置</button>
    </div>
  </footer>
</div>

<div id="panel">
  <h2>参数 <button id="close" title="关闭 (H)">×</button></h2>
  <div class="row">
    <label>风格 <span></span></label>
    <select id="p_style">
      <option value="auto" selected>渐变</option>
      <option value="blackhole">黑洞 · 吸积盘</option>
    </select>
  </div>
  <div class="row">
    <label>粒子量 <span></span></label>
    <select id="p_count">
      <option value="8192">稀 · 8k</option>
      <option value="16384" selected>中 · 16k</option>
      <option value="32768">浓 · 32k</option>
    </select>
  </div>
  <div class="row"><label>曝光 <span id="v_exposure"></span></label><input type="range" id="p_exposure" min="0.2" max="6" step="0.05" value="1.6"></div>
  <div class="row"><label>辉光强度 <span id="v_bloom"></span></label><input type="range" id="p_bloom" min="0" max="3" step="0.05" value="1.0"></div>
  <div class="row"><label>辉光宽度 <span id="v_bloomR"></span></label><input type="range" id="p_bloomR" min="0" max="2" step="0.05" value="1.0"></div>
  <div class="row"><label>锐度（糊就往右） <span id="v_sharp"></span></label><input type="range" id="p_sharp" min="0" max="1" step="0.02" value="0.8"></div>
  <div class="row"><label>吸附强度（追手） <span id="v_attract"></span></label><input type="range" id="p_attract" min="0" max="3" step="0.02" value="0.5"></div>
  <div class="row"><label>搅动强度 <span id="v_stir"></span></label><input type="range" id="p_stir" min="0" max="3" step="0.02" value="1.1"></div>
  <div class="row"><label>手的影响半径 <span id="v_srad"></span></label><input type="range" id="p_srad" min="0.02" max="0.2" step="0.005" value="0.075"></div>
  <div class="row"><label>水的黏滞 <span id="v_damp"></span></label><input type="range" id="p_damp" min="0.1" max="4" step="0.05" value="0.7"></div>
  <div class="row"><label>暗流湍动 <span id="v_turb"></span></label><input type="range" id="p_turb" min="0" max="0.5" step="0.005" value="0.10"></div>
  <div class="row"><label>笔触大小 <span id="v_size"></span></label><input type="range" id="p_size" min="0.002" max="0.03" step="0.0005" value="0.012"></div>
  <div class="row"><label>亮度 / 浓度 <span id="v_op"></span></label><input type="range" id="p_op" min="0.02" max="0.6" step="0.01" value="0.13"></div>
  <div class="row"><label>拖尾长度 <span id="v_tail"></span></label><input type="range" id="p_tail" min="1" max="12" step="1" value="8"></div>
  <div class="row"><label>速度→亮度 <span id="v_dry"></span></label><input type="range" id="p_dry" min="0" max="3" step="0.05" value="1.1"></div>
  <div class="row"><label>球体半径 <span id="v_rad"></span></label><input type="range" id="p_rad" min="0.1" max="0.45" step="0.005" value="0.22"></div>
  <div id="stat"></div>
</div>

<div id="err"><div></div></div>

<script>
"use strict";

// ─────────────────────────────────────────────────────────────────────────────
// 悬浮体 —— WebXR 手部搅动的三维粒子场
//
// 架构：
//   模拟层（低分辨率纹理，ping-pong）：粒子位置 + 速度，手在这里注入涡旋
//   渲染层（屏幕分辨率）：点精灵 + 乘法混合，美术全在这一层
// 状态放在粒子里而不是体素里 —— 64³ 体积对「墨的丝缕」太糙，且立体 raymarching
// 在 WebXR 上撑不住。
// ─────────────────────────────────────────────────────────────────────────────

const TEX_W     = 256;   // 位置纹理宽度；粒子数 = TEX_W * rows
const MAX_SLOTS = 12;    // 历史环形缓冲的槽位数 = 最长拖尾
const MAX_STIR  = 12;    // 最多 12 个搅动点（双手 × 6 关节）

const P = {               // 可调参数，与面板绑定
  count: 16384, stir: 1.1, srad: 0.075, damp: 0.7, turb: 0.10,
  size: 0.012, op: 0.13, tail: 8, dry: 1.1, radius: 0.22,
  style: "auto", attract: 0, sharp: 0.72,
  exposure: 1.6, bloom: 1.0, bloomR: 1.0,
};

// 风格预设。additive/dark 决定混合模式与底色；attract 是朝手的远程吸附。
// 光学透视眼镜（birdbath 加光显示，黑 = 透明）上只有 dark 的几档能看，
// 「墨」那套亮纸底会变成一块糊在眼前的发光白板。
const STYLES = {
  plasma: {                                        // 等离子辉光球：电弧追着手走
    label: "等离子", additive: 1, dark: 1, attract: 0.5,
    cool: [0.16, 0.62, 1.00], warm: [0.72, 0.30, 1.00],
    op: 0.075, size: 0.0062, damp: 0.34, turb: 0.26, dry: 1.5, stir: 1.5, srad: 0.09, sharp: 0.80,
    tail: 6, exposure: 2.6, bloom: 0.28,
  },
  core: {                                          // 能量核心：冷白→琥珀，更"机械"
    label: "能量核心", additive: 1, dark: 1, attract: 0.25,
    cool: [0.55, 0.85, 1.00], warm: [1.00, 0.62, 0.22],
    op: 0.070, size: 0.008, damp: 0.9, turb: 0.13, dry: 1.0, stir: 1.1, srad: 0.075, sharp: 0.72,
    tail: 6, exposure: 2.5, bloom: 0.30,
  },
  ferro: {                                         // 磁流体：手是磁极，强吸附 + 低湍流
    label: "磁流体", additive: 1, dark: 1, attract: 1.1,
    cool: [0.40, 0.95, 0.85], warm: [0.20, 0.45, 0.95],
    op: 0.082, size: 0.0055, damp: 1.6, turb: 0.05, dry: 1.2, stir: 2.0, srad: 0.11, sharp: 0.88,
    tail: 5, exposure: 2.7, bloom: 0.26,
  },
  blackhole: {                                     // 吸积盘：开普勒自转 + 多普勒集束 + 事件视界
    label: "黑洞", additive: 1, dark: 1, attract: 0.35, bh: 1, doppler: 1.15, lens: 1, rings: 1,
    cool: [0.66, 0.82, 1.00], warm: [1.00, 0.52, 0.16],
    op: 0.040, size: 0.0070, damp: 0.25, turb: 0.10, dry: 0.8, stir: 1.2, srad: 0.085, sharp: 0.78,
    tail: 4, exposure: 0.95, bloom: 1.0,
  },
};
let ST = STYLES[P.style];

// 自动渐变：在 plasma / core / ferro 之间连续插值。这三种不只是颜色不同 ——
// 黏滞 0.34/0.9/1.6、湍动 0.26/0.13/0.05 差到五倍，所以数值全都一起插，
// 形态是真的在变，不是换个色板。黑洞有结构性开关(bh/lens/rings)，不参与循环。
const CYCLE = ["plasma", "core", "ferro"];
const CYCLE_SEC = 20;
const LERP_KEYS = ["op", "size", "damp", "turb", "dry", "stir", "srad", "attract", "sharp",
                   "tail", "exposure", "bloom"];
const AUTO = { label: "渐变", additive: 1, dark: 1, cool: [0, 0, 0], warm: [0, 0, 0] };
let autoUiT = 0;

function updateAuto(dt) {
  if (P.style !== "auto") return;
  const nS = CYCLE.length;
  const u = (tSec % (CYCLE_SEC * nS)) / CYCLE_SEC;
  const i = Math.floor(u) % nS, j = (i + 1) % nS;
  let f = u - Math.floor(u);
  f = f * f * (3.0 - 2.0 * f);                       // smoothstep，切换处没有折角
  const A = STYLES[CYCLE[i]], B = STYLES[CYCLE[j]];
  for (const k of LERP_KEYS) P[k] = A[k] + (B[k] - A[k]) * f;
  for (let c = 0; c < 3; c++) {
    AUTO.cool[c] = A.cool[c] + (B.cool[c] - A.cool[c]) * f;
    AUTO.warm[c] = A.warm[c] + (B.warm[c] - A.warm[c]) * f;
  }
  ST = AUTO;
  autoUiT += dt;                                     // 滑块跟着走，但不必每帧刷
  if (autoUiT > 0.25) { autoUiT = 0; syncSliders(); }
}

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", {
  xrCompatible: true, antialias: false, alpha: false,
  depth: true, powerPreference: "high-performance",
});

function fatal(msg) {
  const e = document.getElementById("err");
  e.firstElementChild.innerHTML = msg;
  e.style.display = "grid";
  document.getElementById("ui").style.display = "none";
}
if (!gl) fatal("这台设备的浏览器不支持 WebGL2。<br>WebXR 请用 Quest Browser / Chrome。");
const extCBF = gl && gl.getExtension("EXT_color_buffer_float");
if (gl && !extCBF) fatal("缺少 EXT_color_buffer_float 扩展，无法用浮点纹理做粒子模拟。");

// ── GL 小工具 ────────────────────────────────────────────────────────────────

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + "\n" + src.split("\n").map((l, i) => (i + 1) + "| " + l).join("\n"));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, "");
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
function tex(w, h, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, data || null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(attachments) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  attachments.forEach((t, i) =>
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  return f;
}

// ── 矩阵 ─────────────────────────────────────────────────────────────────────

function mat4() { return new Float32Array(16); }
function perspective(out, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  out.fill(0);
  out[0] = f / aspect; out[5] = f; out[11] = -1;
  out[10] = (far + near) * nf; out[14] = 2 * far * near * nf;
  return out;
}
function lookAt(out, eye, center, up) {
  let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
  let l = 1 / Math.hypot(z0, z1, z2); z0 *= l; z1 *= l; z2 *= l;
  let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
  l = Math.hypot(x0, x1, x2); l = l ? 1 / l : 0; x0 *= l; x1 *= l; x2 *= l;
  const y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
  out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
  out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
  out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
  out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
  out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
  out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
  out[15] = 1;
  return out;
}
function mul(out, a, b) {           // out = a * b
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    out[c * 4]     = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
    out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
    out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return out;
}
function invert(out, m) {
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3], a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11], a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
        b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
        b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if (!det) return out;
  det = 1 / det;
  out[0]=(a11*b11-a12*b10+a13*b09)*det;  out[1]=(a02*b10-a01*b11-a03*b09)*det;
  out[2]=(a31*b05-a32*b04+a33*b03)*det;  out[3]=(a22*b04-a21*b05-a23*b03)*det;
  out[4]=(a12*b08-a10*b11-a13*b07)*det;  out[5]=(a00*b11-a02*b08+a03*b07)*det;
  out[6]=(a32*b02-a30*b05-a33*b01)*det;  out[7]=(a20*b05-a22*b02+a23*b01)*det;
  out[8]=(a10*b10-a11*b08+a13*b06)*det;  out[9]=(a01*b08-a00*b10-a03*b06)*det;
  out[10]=(a30*b04-a31*b02+a33*b00)*det; out[11]=(a21*b02-a20*b04-a23*b00)*det;
  out[12]=(a11*b07-a10*b09-a12*b06)*det; out[13]=(a00*b09-a01*b07+a02*b06)*det;
  out[14]=(a31*b01-a30*b03-a32*b00)*det; out[15]=(a20*b03-a21*b01+a22*b00)*det;
  return out;
}

// ── 着色器 ───────────────────────────────────────────────────────────────────

const VS_QUAD = `#version 300 es
out vec2 vUv;
void main(){
  vec2 uv = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);   // (0,0) (2,0) (0,2)
  vUv = uv;
  gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
}`;

// 噪声与旋度 —— 势场直接沿用 XorDev 的 p += sin(p.yzx*f)/f，
// 取旋度后得到无散度速度场（不会让墨堆积或凭空消失，省掉压力投影）。
const GLSL_NOISE = `
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
vec3 hash31(float p){
  vec3 q = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973));
  q += dot(q, q.yxz + 33.33);
  return fract((q.xxy + q.yzz) * q.zyx);
}
vec3 warp(vec3 p, float t){
  vec3 q = p; float f = 1.0;
  for (int i = 0; i < 4; i++){ q += sin(q.yzx * f + t) / f; f *= 1.9; }
  return q - p;
}
vec3 curlNoise(vec3 p, float t){
  const float e = 0.09;
  vec3 x0 = warp(p - vec3(e,0,0), t), x1 = warp(p + vec3(e,0,0), t);
  vec3 y0 = warp(p - vec3(0,e,0), t), y1 = warp(p + vec3(0,e,0), t);
  vec3 z0 = warp(p - vec3(0,0,e), t), z1 = warp(p + vec3(0,0,e), t);
  return vec3((y1.z - y0.z) - (z1.y - z0.y),
              (z1.x - z0.x) - (x1.z - x0.z),
              (x1.y - x0.y) - (y1.x - y0.x)) / (2.0 * e);
}`;

const FS_UPDATE = `#version 300 es
precision highp float;
in vec2 vUv;
layout(location = 0) out vec4 outPos;   // xyz 位置, w 寿命
layout(location = 1) out vec4 outVel;   // xyz 速度, w 备用

uniform sampler2D uPos, uVel;
uniform float uDt, uTime, uRadius, uDamp, uTurb;
uniform vec3  uCenter;
uniform vec3  uStirPos[${MAX_STIR}];
uniform vec3  uStirVel[${MAX_STIR}];
uniform float uStirW[${MAX_STIR}];
uniform float uStirGrab[${MAX_STIR}];
uniform float uStirRadius, uStirStrength, uAttract, uBH, uRows;
uniform mat3  uRingInv[3];      // 每个环变换的逆，用来把注入点搬到该环的局部坐标系
uniform vec3  uInjectPos[2];
uniform float uInjectN;      // 0/1/2 个注入点
${GLSL_NOISE}

void main(){
  vec4 dp = texture(uPos, vUv);
  vec3 p = dp.xyz;
  float life = dp.w;
  vec3 vel = texture(uVel, vUv).xyz;

  // 1. 暗流：水本身的湍动，让墨永远在缓慢自转，不会死寂
  vec3 ambient = curlNoise((p - uCenter) / uRadius * 1.6 + 11.0, uTime * 0.12) * uTurb * uRadius;
  vec3 acc = (ambient - vel) * 1.2;

  // 2. 手：cross(手速, 相对位置) = 绕着手的运动轴旋转 —— 这是「搅」而不是「吹」
  for (int i = 0; i < ${MAX_STIR}; i++){
    vec3 r = p - uStirPos[i];
    float d2 = dot(r, r);
    float fall = exp(-d2 / (uStirRadius * uStirRadius)) * uStirW[i];
    acc += cross(uStirVel[i], r) / (d2 + 0.0006) * fall * uStirStrength;
    acc += uStirVel[i] * fall * 2.5;         // 一点直推，否则纯旋转会显得粘手
    // 远程吸附：电弧丝从远处伸过来追着手走。用比高斯更长的尾巴。
    // near 这一项是关键：靠得太近就撤掉吸引力，否则粒子会全部塌缩到手上糊成一团。
    // 撤掉之后近处只剩上面的 cross 涡旋项，粒子转为绕着手公转。
    float g = uStirGrab[i];                       // 0 = 张开, 1 = 攥紧
    float dist1 = sqrt(d2);
    float nearR = mix(0.030, 0.004, g);           // 攥紧时允许光点一直被收到掌心
    float near = smoothstep(nearR, nearR + 0.045, dist1);
    float wide = uStirW[i] / (1.0 + d2 * mix(80.0, 18.0, g));   // 攥紧时够得更远
    acc -= r / (dist1 + 0.02) * wide * (uAttract + 1.6 * g) * near;
  }

  // 3. 容器
  vec3 rel = p - uCenter;
  if (uBH > 0.5) {
    // 吸积盘：压成薄盘 + 开普勒微分自转（越靠内转越快）+ 缓慢向内螺旋
    vec2  q = rel.xz;
    float r = max(length(q), 1e-4);
    vec3  tang = vec3(-q.y, 0.0, q.x) / r;                    // 切向
    float omega = 0.55 / pow(r / uRadius + 0.06, 1.5);        // ω ∝ r^-1.5
    acc += (tang * omega * r * 3.0 - vel) * 2.2;
    acc.y -= rel.y * 26.0;                                    // 压扁（留一点厚度）
    acc -= vec3(q.x, 0.0, q.y) / r * 0.24;                    // 吸积：放缓,让环带更宽
    float outward = smoothstep(1.02, 1.30, r / uRadius);
    acc -= vec3(q.x, 0.0, q.y) / r * outward * 4.5;           // 只在盘外回收
  } else {
    float dist = length(rel);
    float push = smoothstep(0.78, 1.12, dist / uRadius);
    acc -= rel / max(dist, 1e-4) * push * 3.2;
    acc.y -= 0.012;                           // 极轻的下沉
  }

  vel += acc * uDt;
  vel *= exp(-uDamp * uDt);                   // 黏滞：手停下后墨继续旋，慢慢停
  p   += vel * uDt;

  // 4. 轮回：寿命到了就重生；捏合/按住左键时从指尖注入新墨
  life -= uDt;
  bool eaten = uBH > 0.5 && length(rel.xz) < uRadius * 0.14;   // 掉进事件视界
  if (life <= 0.0 || eaten){
    float seed = vUv.x * 7919.0 + vUv.y * 104729.0 + uTime * 131.0;
    vec3 dir = normalize(hash31(seed) * 2.0 - 1.0 + vec3(1e-4));
    float rr = pow(hash11(seed + 3.7), 0.3333);
    if (uInjectN > 0.5) {
      int wi = (uInjectN > 1.5 && hash11(seed + 21.3) > 0.5) ? 1 : 0;   // 两手时各分一半
      vec3 hp = uInjectPos[wi];
      if (uBH > 0.5) {
        // 环的旋转是在渲染时施加的，而这里是模拟空间 —— 不做逆变换的话，
        // 注入在手上的粒子会被各自的环转走，既不在手上、又散成三股。
        int pidx = int(floor(vUv.y * uRows)) * 256 + int(floor(vUv.x * 256.0));
        int g = int(floor(hash11(float(pidx) * 0.37714) * 3.0));
        hp = uCenter + uRingInv[g] * (hp - uCenter);
      }
      p = hp + dir * rr * 0.035;
    } else if (uBH > 0.5) {
      float a2 = hash11(seed + 5.1) * 6.2831853;               // 从外缘重新流入
      float r2 = uRadius * (0.42 + 0.62 * hash11(seed + 7.7));   // 铺满整条环带
      p = uCenter + vec3(cos(a2) * r2, (hash11(seed + 11.3) - 0.5) * uRadius * 0.05, sin(a2) * r2);
    } else {
      p = uCenter + dir * rr * uRadius * 0.62;
    }
    vel = vec3(0.0);
    life = 7.0 + hash11(seed + 9.1) * 17.0;
  }
  outPos = vec4(p, life);
  outVel = vec4(vel, 0.0);
}`;

// 把当前位置拷进历史环形缓冲的一个槽位；w 存速率，渲染层用它做飞白
const FS_HIST = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uPos, uVel;
void main(){
  o = vec4(texture(uPos, vUv).xyz, length(texture(uVel, vUv).xyz));
}`;

const VS_INK = `#version 300 es
precision highp float;
uniform sampler2D uHist;
uniform mat4 uProj, uView;
uniform int  uN, uRows, uHead, uSlots, uTail;
uniform float uSize, uVpH, uDry, uDoppler, uRadius, uLens, uPhotonAng, uPass, uTilt, uRingIdx;
uniform mat3 uRingRot;
uniform vec3 uCamPos, uCenter;
out float vFade, vSeed, vDry, vDop, vRing;

float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }

// 罗德里格旋转：绕单位轴 k 把 v 转 a 弧度
vec3 rotAxis(vec3 v, vec3 k, float a){
  float c = cos(a), s = sin(a);
  return v * c + cross(k, v) * s + k * dot(k, v) * (1.0 - c);
}

void main(){
  int id  = gl_VertexID;
  int s   = id / uN;                        // 0 = 最新，越大越旧
  int pid = id - s * uN;

  if (s >= uTail){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }

  // 每个粒子按哈希固定归属一个环，而不是把同一批粒子画三遍。
  // 这样注入的那一股只出现一次（不会变成三条），填充率也降到三分之一。
  if (uRingIdx >= 0.0) {
    float g = floor(h11(float(pid) * 0.37714) * 3.0);
    if (abs(g - uRingIdx) > 0.5){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
  }

  int ring = uHead - s;  ring += (ring < 0) ? uSlots : 0;   // 环形缓冲回绕
  ivec2 uv = ivec2(pid % ${TEX_W}, ring * uRows + pid / ${TEX_W});
  vec4 d = texelFetch(uHist, uv, 0);

  vSeed = h11(float(pid) * 0.73513);
  vDry  = clamp(d.w * uDry, 0.0, 1.0);
  float age = float(s) / float(max(uTail - 1, 1));
  vFade = pow(1.0 - age, 1.35);             // 尾巴渐淡

  // 三环：同一批粒子画三遍，分别绕 X 轴倾斜 0 / +60 / -60 度
  vec3 rel0 = d.xyz - uCenter;
  float ct = cos(uTilt), st = sin(uTilt);
  vec3 rel = vec3(rel0.x, rel0.y * ct - rel0.z * st, rel0.y * st + rel0.z * ct);
  // 整组环的姿态：一个自由翻滚的旋转矩阵，手可以往任意方向推。
  // 只对分环的风格生效 —— 渐变不分环，转了只会让注入点跟着偏。
  if (uRingIdx >= 0.0) rel = uRingRot * rel;
  vec3 P = uCenter + rel;

  // 引力透镜的次级像：光线绕过洞之后看起来来自哪个方向。
  // 在 相机-洞-粒子 构成的平面内，把「看向洞」的方向朝粒子的反侧转到光子球角半径附近。
  // 盘的远侧因此被拱到洞的上方/下方 —— 那条光弧才是「像黑洞」的来源。
  if (uPass > 0.5) {
    vec3 toC = uCenter - uCamPos;
    vec3 toP = P - uCamPos;
    float dC = length(toC);
    vec3 uC = toC / max(dC, 1e-4);
    vec3 axis = cross(uC, normalize(toP));
    float al = length(axis);
    if (al < 1e-4 || uLens < 0.5) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
    P = uCamPos + rotAxis(uC, axis / al, -uPhotonAng * 1.06) * length(toP);
  }

  // 多普勒集束：吸积盘切向速度朝向观察者的一侧增亮。
  // 原作只是个左右的 exp 渐变；这里用每个粒子真实的切向方向算，所以随视角自然变化。
  vDop = 0.0; vRing = 0.0;
  if (uDoppler > 0.0) {
    float r0 = max(length(rel0.xz), 1e-4);
    vec3 tang0 = vec3(-rel0.z, 0.0, rel0.x) / r0;              // 未倾斜时的切向
    vec3 t1 = vec3(tang0.x, tang0.y * ct - tang0.z * st,       // 跟着环一起转
                            tang0.y * st + tang0.z * ct);
    vec3 tang = (uRingIdx >= 0.0) ? uRingRot * t1 : t1;
    vDop = dot(tang, normalize(uCamPos - P));
    vRing = exp(-pow((r0 / uRadius - 0.21) / 0.030, 2.0));
  }

  vec4 vp = uView * vec4(P, 1.0);
  gl_Position = uProj * vp;
  float dist = max(-vp.z, 0.02);
  float size = uSize * (0.65 + 0.7 * vSeed) * (1.0 - 0.35 * age);
  gl_PointSize = clamp(size * uProj[1][1] * uVpH * 0.5 / dist, 1.0, 72.0);
}`;

// 乘法混合：dst *= src。越叠越暗 = 墨，且与绘制顺序无关 → 三维半透明免排序。
// 不用 discard（一旦出现 discard，硬件的 Early-Z 就会被关掉，哪怕从未执行到）——
// 圆外让 alpha 归零即可，乘以白色等于无操作。
const FS_INK = `#version 300 es
precision highp float;
in float vFade, vSeed, vDry, vDop, vRing;
out vec4 frag;
uniform float uOpacity, uAdditive, uSharp, uDoppler;
uniform vec3 uInkCool, uInkWarm;
void main(){
  vec2 c = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(c, c);
  float e = max(0.0, 1.0 - r2);
  float core = pow(e, mix(1.2, 4.5, uSharp));       // 笔芯：锐度越高越紧
  float halo = pow(e, 0.32);                        // 光晕：糊的主因，锐度高时几乎去掉
  float a = (core * mix(0.70, 0.99, uSharp) + halo * mix(0.30, 0.01, uSharp)) * vFade * uOpacity;
  vec3 tint = mix(uInkCool, uInkWarm, vSeed * vSeed);
  if (uDoppler > 0.0) {
    tint = mix(uInkWarm, uInkCool, clamp(vDop * 0.5 + 0.5, 0.0, 1.0));  // 迎面蓝移,背向红移
    // 变暗那侧只用一半强度 —— 全强度下 exp(-1.15)=0.32，背向侧注入的粒子直接看不见了
    a *= exp(vDop * (vDop > 0.0 ? uDoppler : uDoppler * 0.45));
    a *= 1.0 + vRing * 0.9;                                             // 光子环
  }
  if (uAdditive > 0.5) {
    // 等离子：快 = 更亮更白（跟墨的飞白正好相反），芯部烧到白
    a *= mix(0.55, 1.9, vDry);
    tint = mix(tint, vec3(1.0), pow(core, 3.0) * 0.85);
    frag = vec4(tint * a * 1.3, 1.0);               // 配 screen 混合，见 drawScene
  } else {
    a *= mix(1.0, 0.28, vDry);                      // 飞白：走得快的墨变淡
    frag = vec4(mix(vec3(1.0), tint, clamp(a, 0.0, 1.0)), 1.0);
  }
}`;

// 手：同样的点精灵，但写深度，让墨被手正确遮挡；视觉上是一双水墨画的手
// 洞的剪影与光子环。都是朝向相机的四边形（不用点精灵：凑近时会撞上 gl_PointSize 上限）。
// 相机的 right/up 直接从视图矩阵的行里取。
const VS_HALO = `#version 300 es
precision highp float;
uniform mat4 uProj, uView;
uniform vec3 uCenter;
uniform float uR;
out vec2 vQ;
const vec2 QUAD[6] = vec2[6](vec2(-1.0,-1.0), vec2(1.0,-1.0), vec2(-1.0,1.0),
                             vec2(-1.0, 1.0), vec2(1.0,-1.0), vec2( 1.0,1.0));
void main(){
  vec2 q = QUAD[gl_VertexID];
  vQ = q;
  vec3 right = vec3(uView[0].x, uView[1].x, uView[2].x);
  vec3 up    = vec3(uView[0].y, uView[1].y, uView[2].y);
  gl_Position = uProj * uView * vec4(uCenter + (right * q.x + up * q.y) * uR, 1.0);
}`;

const FS_HALO = `#version 300 es
precision highp float;
in vec2 vQ;
out vec4 frag;
uniform vec3  uRingCol;
uniform float uRingW, uSpread, uRingEps;
void main(){
  // 光子环：永远正对观察者（真实的光子环不在盘平面里）。
  // 质感对齐吸积盘：窄亮芯 + 宽柔光晕，而不是一条干净的细线。
  // 四边形画得比环大 uSpread 倍，这里换算回去，让光晕在四边形边界前衰减干净。
  float r = length(vQ) * uSpread;
  // 倒数衰减，对应原作的 1.0 / (0.03 + abs(length(p) - 0.7))。
  // 高斯的尾巴掉得太快，看起来像"画出来的亮带"；倒数是极窄的炽白芯 + 拖很长的辉光尾，
  // 数学上无上界 —— 那才是"光"的观感。
  // 单独设计：不跟粒子带统一材质。单层倒数衰减，细而亮。
  float a = uRingW / (uRingEps + abs(r - 1.0));
  if (a < 0.003) discard;
  frag = vec4(uRingCol * a, 1.0);
}`;

const VS_HAND = `#version 300 es
precision highp float;
layout(location = 0) in vec4 aJoint;       // xyz 位置, w 半径
uniform mat4 uProj, uView;
uniform float uVpH;
out float vR;
void main(){
  vec4 vp = uView * vec4(aJoint.xyz, 1.0);
  gl_Position = uProj * vp;
  float dist = max(-vp.z, 0.02);
  gl_PointSize = clamp(abs(aJoint.w) * 2.2 * uProj[1][1] * uVpH * 0.5 / dist, 2.0, 200.0);
  vR = aJoint.w < 0.0 ? 1.0 : 0.0;              // 负半径 = 这只手攥紧了，画亮一点
}`;
const FS_HAND = `#version 300 es
precision highp float;
in float vR;
out vec4 frag;
uniform float uAdditive;
void main(){
  vec2 c = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(c, c);
  if (r2 > 1.0) discard;                              // 手要写深度，必须真的剔掉圆外
  float a = pow(1.0 - r2, 0.9);
  if (uAdditive > 0.5) frag = vec4(vec3(0.35, 0.80, 1.0) * a * mix(0.5, 1.4, vR), 1.0);  // 冷蓝的手，攥紧更亮
  else                 frag = vec4(mix(vec3(1.0), vec3(0.30, 0.28, 0.27), a * 0.55), 1.0);
}`;

// 辉光：逐级降采样。每级用 4 抽样盒式平均（配合 LINEAR 实际覆盖 4x4），
// 是确定性的、天然平滑 —— 不像稀疏螺旋采样那样在稀疏光源上留下噪点，
// 那种噪点在 1/4 分辨率上放大回来就是背景马赛克。
const FS_DOWN = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;
uniform sampler2D uSrc;
uniform vec4 uBounds;          // 这只眼睛在源纹理里的 uv 范围（立体时不能跨眼采样）
uniform vec2 uTexel;
void main(){
  vec2 uv = mix(uBounds.xy, uBounds.zw, vUv);
  vec2 o = uTexel;
  vec4 c = texture(uSrc, clamp(uv + vec2(-o.x, -o.y), uBounds.xy, uBounds.zw))
         + texture(uSrc, clamp(uv + vec2( o.x, -o.y), uBounds.xy, uBounds.zw))
         + texture(uSrc, clamp(uv + vec2(-o.x,  o.y), uBounds.xy, uBounds.zw))
         + texture(uSrc, clamp(uv + vec2( o.x,  o.y), uBounds.xy, uBounds.zw));
  frag = c * 0.25;
}`;

// 合成：能量在 HDR 缓冲里自由累积（纯加法，无上界），到这里才压回 [0,1)。
// 1 - exp(-x) 就是原作黑洞收尾那条曲线：高光渐近饱和，不会硬截断成死白。
const FS_COMPOSITE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;
uniform sampler2D uScene, uB0, uB1, uB2;
uniform float uExposure, uBloomAmt, uWide;
void main(){
  vec3 g = texture(uB0, vUv).rgb * 0.50
         + texture(uB1, vUv).rgb * 0.35 * uWide
         + texture(uB2, vUv).rgb * 0.25 * uWide * uWide;
  vec3 c = texture(uScene, vUv).rgb + g * uBloomAmt;
  frag = vec4(1.0 - exp(-c * uExposure), 1.0);
}`;

// 宣纸：纤维 + 颗粒 + 上下渐变 + 地面墨晕。
// 关键：所有噪声都 hash 在「世界空间视线方向」上，不是屏幕坐标 ——
// 否则双眼拿到不同的颗粒，在头显里会闪得眼睛疼。
const FS_PAPER = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;
uniform mat4 uInvVP;
uniform vec3 uCamPos, uCenter;
uniform float uRadius, uFloorY, uDark;

float h13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
// 三线性插值的值噪声。之前直接 h13(floor(p)) 没有插值，本身就是一格一格的方块 ——
// HDR + tonemap 把它抬出来就成了背景上的马赛克。
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = h13(i), n100 = h13(i + vec3(1,0,0));
  float n010 = h13(i + vec3(0,1,0)), n110 = h13(i + vec3(1,1,0));
  float n001 = h13(i + vec3(0,0,1)), n101 = h13(i + vec3(1,0,1));
  float n011 = h13(i + vec3(0,1,1)), n111 = h13(i + vec3(1,1,1));
  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
             mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
}
float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++){ v += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return v;
}

void main(){
  vec4 far = uInvVP * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
  vec3 dir = normalize(far.xyz / far.w - uCamPos);

  // 暗底：给加光显示的眼镜用 —— 黑 = 透明，辉光直接浮在真实房间里。
  // 保持极暗但不是纯黑，纯黑在某些屏上会出色带。
  if (uDark > 0.5) {
    vec3 night = vec3(0.010, 0.014, 0.026);
    night *= 1.0 + 0.8 * smoothstep(0.25, -0.9, dir.y);
    night += 0.006 * fbm(dir * 260.0);
    frag = vec4(night, 1.0);
    return;
  }

  vec3 paper = vec3(0.945, 0.918, 0.866);
  paper *= 1.0 - 0.10 * smoothstep(0.1, -0.85, dir.y);      // 下方微沉
  paper *= 1.0 + 0.035 * smoothstep(0.0, 0.9, dir.y);       // 上方微亮

  vec3 n = dir * 340.0;
  paper *= 1.0 - 0.030 * fbm(n);                            // 颗粒
  paper *= 1.0 - 0.022 * fbm(vec3(n.x * 0.12, n.y * 7.0, n.z * 0.12));  // 拉长的纤维

  // 地面上的一团墨晕，把悬空的墨球锚在空间里
  if (dir.y < -0.02){
    float t = (uFloorY - uCamPos.y) / dir.y;
    if (t > 0.0){
      vec3 hit = uCamPos + dir * t;
      vec2 d = (hit.xz - uCenter.xz) / (uRadius * 2.6);
      float w = exp(-dot(d, d) * 2.2);
      w *= 0.72 + 0.28 * fbm(hit * 26.0);                   // 边缘不规则,像洇开的水痕
      paper *= 1.0 - 0.30 * w;
    }
  }
  float vig = length(vUv - 0.5);
  paper *= 1.0 - 0.13 * smoothstep(0.35, 0.95, vig);
  frag = vec4(paper, 1.0);
}`;

// ── 程序 & 资源 ──────────────────────────────────────────────────────────────

const OK = !!(gl && extCBF);
let progUpdate, progHist, progInk, progHand, progPaper, progHalo, progBloom, progComp;
try {
  if (!OK) throw new Error('skip');
  progUpdate = program(VS_QUAD, FS_UPDATE);
  progHist   = program(VS_QUAD, FS_HIST);
  progInk    = program(VS_INK,  FS_INK);
  progHand   = program(VS_HAND, FS_HAND);
  progPaper  = program(VS_QUAD, FS_PAPER);
  progHalo   = program(VS_HALO,  FS_HALO);
  progBloom  = program(VS_QUAD,  FS_DOWN);
  progComp   = program(VS_QUAD,  FS_COMPOSITE);
} catch (e) { if (OK) fatal("着色器编译失败：<br><pre style='text-align:left;font-size:11px'>" + e.message + "</pre>"); }

const vaoEmpty = OK ? gl.createVertexArray() : null;

let N, ROWS, SLOTS = MAX_SLOTS, head = 0;
let posT = [], velT = [], simFbo = [], cur = 0, histT, histFbo;

function seedData(n) {                       // 初始：整个球内均匀分布（拒绝采样天然均匀）
  const a = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) {
    let x, y, z, d;
    do { x = Math.random() * 2 - 1; y = Math.random() * 2 - 1; z = Math.random() * 2 - 1; d = x * x + y * y + z * z; } while (d > 1);
    const r = P.radius * 0.88;
    a[i * 4]     = C[0] + x * r;
    a[i * 4 + 1] = C[1] + y * r;
    a[i * 4 + 2] = C[2] + z * r;
    a[i * 4 + 3] = Math.random() * 24;   // 铺开寿命,否则头几秒没有可回收的粒子,注入是哑的
  }
  return a;
}

function initParticles(count) {
  [...posT, ...velT, histT].forEach(t => t && gl.deleteTexture(t));
  [...simFbo, histFbo].forEach(f => f && gl.deleteFramebuffer(f));
  N = count; ROWS = N / TEX_W;
  const seed = seedData(N);
  posT = [tex(TEX_W, ROWS, seed), tex(TEX_W, ROWS, seed)];
  velT = [tex(TEX_W, ROWS, new Float32Array(N * 4)), tex(TEX_W, ROWS, new Float32Array(N * 4))];
  simFbo = [fbo([posT[0], velT[0]]), fbo([posT[1], velT[1]])];
  const hist = new Float32Array(TEX_W * ROWS * SLOTS * 4);
  for (let s = 0; s < SLOTS; s++)
    for (let i = 0; i < N; i++) {
      hist[(s * N + i) * 4]     = seed[i * 4];
      hist[(s * N + i) * 4 + 1] = seed[i * 4 + 1];
      hist[(s * N + i) * 4 + 2] = seed[i * 4 + 2];
    }
  histT = tex(TEX_W, ROWS * SLOTS, hist);
  histFbo = fbo([histT]);
  cur = 0; head = 0;
}

// ── HDR 渲染目标 ─────────────────────────────────────────────────────────────
// 所有东西先加法累积进 RGBA16F，最后统一 tonemap。这样"总能量"才存在，
// 才压得出层次 —— 逐精灵自限的混合方程做不到这件事。
let hdrTex = null, hdrFbo = null, hdrDepth = null, hdrW = 0, hdrH = 0;
let bloomTex = [], bloomFbo = [];
const BLOOM_LEVELS = 3;        // 1/4, 1/8, 1/16

function texHDR(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function ensureHDR(w, h) {
  if (w === hdrW && h === hdrH) return;
  [hdrTex, ...bloomTex].forEach(t => t && gl.deleteTexture(t));
  [hdrFbo, ...bloomFbo].forEach(f => f && gl.deleteFramebuffer(f));
  if (hdrDepth) gl.deleteRenderbuffer(hdrDepth);
  hdrW = w; hdrH = h;
  hdrTex = texHDR(w, h);
  hdrFbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdrFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, hdrTex, 0);
  hdrDepth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, hdrDepth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, hdrDepth);
  bloomTex = []; bloomFbo = [];
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    const d = 4 << i;
    const t = texHDR(Math.max(1, Math.floor(w / d)), Math.max(1, Math.floor(h / d)));
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    bloomTex.push(t); bloomFbo.push(f);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// rects: 每只眼睛在 HDR 缓冲里的 [x,y,w,h]。辉光按眼分别做并夹住采样范围，
// 否则左眼的光会漏进右眼（立体下极难受）。合成是逐像素的，整张一次过即可。
function postProcess(target, rects) {
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
  gl.bindVertexArray(vaoEmpty);
  gl.useProgram(progBloom.p);
  gl.uniform1i(progBloom.u.uSrc, 0);
  gl.activeTexture(gl.TEXTURE0);

  // 逐级降采样：hdr -> 1/4 -> 1/8 -> 1/16
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    const src = i === 0 ? hdrTex : bloomTex[i - 1];
    const srcDiv = i === 0 ? 1 : (4 << (i - 1));
    const dstDiv = 4 << i;
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFbo[i]);
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.uniform2f(progBloom.u.uTexel, srcDiv / hdrW, srcDiv / hdrH);
    for (const r of rects) {
      gl.viewport(Math.floor(r[0] / dstDiv), Math.floor(r[1] / dstDiv),
                  Math.floor(r[2] / dstDiv), Math.floor(r[3] / dstDiv));
      gl.uniform4f(progBloom.u.uBounds, r[0] / hdrW, r[1] / hdrH,
                   (r[0] + r[2]) / hdrW, (r[1] + r[3]) / hdrH);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, target);
  gl.viewport(0, 0, hdrW, hdrH);
  gl.useProgram(progComp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdrTex);
  gl.uniform1i(progComp.u.uScene, 0);
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    gl.activeTexture(gl.TEXTURE1 + i); gl.bindTexture(gl.TEXTURE_2D, bloomTex[i]);
    gl.uniform1i(progComp.u["uB" + i], 1 + i);
  }
  gl.uniform1f(progComp.u.uExposure, P.exposure);
  gl.uniform1f(progComp.u.uBloomAmt, P.bloom);
  gl.uniform1f(progComp.u.uWide, P.bloomR);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
}

const handBuf = OK ? gl.createBuffer() : null;
const handVao = OK ? gl.createVertexArray() : null;
if (OK) {
gl.bindVertexArray(handVao);
gl.bindBuffer(gl.ARRAY_BUFFER, handBuf);
gl.bufferData(gl.ARRAY_BUFFER, 60 * 4 * 4, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);
}
const handData = new Float32Array(60 * 4);
let handCount = 0;

// ── 搅动点 ───────────────────────────────────────────────────────────────────

const C = [0, 1.25, -0.5];                 // 墨球中心（world / local-floor）
let   floorY = 0;
const stirPos = new Float32Array(MAX_STIR * 3);
const stirVel = new Float32Array(MAX_STIR * 3);
const stirW   = new Float32Array(MAX_STIR);
const stirGrab = new Float32Array(MAX_STIR);   // 每个搅动点的「攥紧」程度 0..1
function smooth01(x, a, b){ const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
const injectPos = new Float32Array(6);     // 最多两个注入点（左右手各一）
let   injectN = 0;

// 三环整体的姿态：自由翻滚，不限定在某一个轴上。
// 手的力矩取完整的 r × v（三个分量都要），所以往任意方向划都能推动它。
// 力矩推完之后角速度慢慢回落到一个很缓的基础翻滚 —— 永远在动，但从不乱。
let ringRot = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);   // 列主序 3x3
const ringOmega = [0.03, 0.06, 0.09];
const OMEGA_BASE = [0.03, 0.06, 0.09];

function mul3(a, b) {                                  // 列主序 a*b
  const o = new Float32Array(9);
  for (let c = 0; c < 3; c++)
    for (let r = 0; r < 3; r++)
      o[c * 3 + r] = a[r] * b[c * 3] + a[3 + r] * b[c * 3 + 1] + a[6 + r] * b[c * 3 + 2];
  return o;
}

// 三个环各自的完整变换 = ringRot × 绕X倾斜(θ)；它的逆 = 转置。
// 注入点先过这个逆，渲染时再被正变换转回来，于是正好落在手上。
const RING_TILTS = [0, Math.PI / 3, -Math.PI / 3];
const _ringInv = new Float32Array(27);
function ringInvMats() {
  for (let k = 0; k < 3; k++) {
    const c = Math.cos(RING_TILTS[k]), si = Math.sin(RING_TILTS[k]);
    const T = new Float32Array([1, 0, 0, 0, c, si, 0, -si, c]);   // 绕 X，列主序
    const R = mul3(ringRot, T);
    for (let col = 0; col < 3; col++)
      for (let row = 0; row < 3; row++)
        _ringInv[k * 9 + col * 3 + row] = R[row * 3 + col];       // 转置 = 逆
  }
  return _ringInv;
}

// 握拳时整个中心点跟着手走：粒子在世界空间不动，中心一移，软容器就把整团拽过去 ——
// 于是「攥住 → 聚拢 → 拖着走」是一个连贯动作。
let wasGrabbing = false;
function updateGrabDrag(dt) {
  let n = 0, vx = 0, vy = 0, vz = 0;
  for (let i = 0; i < MAX_STIR; i++) {
    if (stirW[i] <= 0 || stirGrab[i] < 0.5) continue;
    vx += stirVel[i * 3]; vy += stirVel[i * 3 + 1]; vz += stirVel[i * 3 + 2]; n++;
  }
  const grabbing = n > 0;
  // 起手那一帧不拖：手追刚重新出现时 prevJoint 还是旧位置，差分出来的速度是假的暴冲，
  // 整团会被瞬间甩走 —— 看起来就像「位置被重置」。
  if (!grabbing || !wasGrabbing) { wasGrabbing = grabbing; return; }
  const k = dt / n;
  let dx = vx * k, dy = vy * k, dz = vz * k;
  const step = Math.hypot(dx, dy, dz), cap = 0.04;      // 单帧位移上限 4cm，兜住残余跳变
  if (step > cap) { const f = cap / step; dx *= f; dy *= f; dz *= f; }
  C[0] += dx; C[1] += dy; C[2] += dz;
}

function updateRingSpin(dt) {
  let tx = 0, ty = 0, tz = 0;
  for (let i = 0; i < MAX_STIR; i++) {
    if (stirW[i] <= 0) continue;
    const rx = stirPos[i * 3] - C[0], ry = stirPos[i * 3 + 1] - C[1], rz = stirPos[i * 3 + 2] - C[2];
    const vx = stirVel[i * 3], vy = stirVel[i * 3 + 1], vz = stirVel[i * 3 + 2];
    const r2 = rx * rx + ry * ry + rz * rz + 0.004;
    tx += (ry * vz - rz * vy) / r2 * stirW[i];         // 完整的叉积，不再只取 Z
    ty += (rz * vx - rx * vz) / r2 * stirW[i];
    tz += (rx * vy - ry * vx) / r2 * stirW[i];
  }
  ringOmega[0] += tx * 0.10 * dt;
  ringOmega[1] += ty * 0.10 * dt;
  ringOmega[2] += tz * 0.10 * dt;
  const back = Math.min(1, 0.22 * dt);                 // 慢慢回到基础翻滚
  for (let i = 0; i < 3; i++) ringOmega[i] += (OMEGA_BASE[i] - ringOmega[i]) * back;

  let sp = Math.hypot(ringOmega[0], ringOmega[1], ringOmega[2]);
  if (sp > 3.0) { const k = 3.0 / sp; ringOmega[0] *= k; ringOmega[1] *= k; ringOmega[2] *= k; sp = 3.0; }

  const ang = sp * dt;
  if (ang > 1e-7) {                                    // 罗德里格：把姿态绕 ω 转 ω·dt
    const x = ringOmega[0] / sp, y = ringOmega[1] / sp, z = ringOmega[2] / sp;
    const c = Math.cos(ang), si = Math.sin(ang), t = 1 - c;
    ringRot = mul3(new Float32Array([
      t * x * x + c,      t * x * y + si * z, t * x * z - si * y,
      t * x * y - si * z, t * y * y + c,      t * y * z + si * x,
      t * x * z + si * y, t * y * z - si * x, t * z * z + c,
    ]), ringRot);
    // 每帧做一次 Gram-Schmidt，防止长时间累积的数值漂移把矩阵拉歪
    let l = Math.hypot(ringRot[0], ringRot[1], ringRot[2]);
    ringRot[0] /= l; ringRot[1] /= l; ringRot[2] /= l;
    const d = ringRot[0] * ringRot[3] + ringRot[1] * ringRot[4] + ringRot[2] * ringRot[5];
    ringRot[3] -= ringRot[0] * d; ringRot[4] -= ringRot[1] * d; ringRot[5] -= ringRot[2] * d;
    l = Math.hypot(ringRot[3], ringRot[4], ringRot[5]);
    ringRot[3] /= l; ringRot[4] /= l; ringRot[5] /= l;
    ringRot[6] = ringRot[1] * ringRot[5] - ringRot[2] * ringRot[4];
    ringRot[7] = ringRot[2] * ringRot[3] - ringRot[0] * ringRot[5];
    ringRot[8] = ringRot[0] * ringRot[4] - ringRot[1] * ringRot[3];
  }
}

let idleT = 0;                             // 距上次真实输入的秒数
let autoActive = false;                    // 当前是不是「看不见的手」在搅
function autoStir(dt) {                    // 无人时的「看不见的手」
  autoActive = true;
  const a = tSec * 0.5, R = P.radius;
  pushStir(0, "auto",
    C[0] + R * 0.58 * Math.sin(a),
    C[1] + R * 0.42 * Math.sin(a * 0.73 + 1.3),
    C[2] + R * 0.58 * Math.cos(a * 0.91), dt);
}

const prevJoint = new Map();               // key -> [x,y,z] 上一帧位置,用来差分出速度
function pushStir(i, key, x, y, z, dt) {
  const pv = prevJoint.get(key);
  let vx = 0, vy = 0, vz = 0;
  if (pv && dt > 0) {
    vx = (x - pv[0]) / dt; vy = (y - pv[1]) / dt; vz = (z - pv[2]) / dt;
    const sp = Math.hypot(vx, vy, vz), cap = 4.0;       // 掐掉追踪跳变导致的暴冲
    if (sp > cap) { const k = cap / sp; vx *= k; vy *= k; vz *= k; }
    prevJoint.set(key, [x, y, z]);
  } else prevJoint.set(key, [x, y, z]);
  stirPos[i * 3] = x; stirPos[i * 3 + 1] = y; stirPos[i * 3 + 2] = z;
  stirVel[i * 3] = vx; stirVel[i * 3 + 1] = vy; stirVel[i * 3 + 2] = vz;
  stirW[i] = 1;
}

// ── 桌面相机 & 鼠标 ──────────────────────────────────────────────────────────

const camDesk = { yaw: 0, pitch: 0.12, dist: 0.8 };
const mouse = { x: 0, y: 0, inside: false, orbit: false, inject: false, lx: 0, ly: 0 };
const mProj = mat4(), mView = mat4(), mVP = mat4(), mInvVP = mat4();

canvas.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect();
  const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
  const ny = 1 - ((e.clientY - r.top) / r.height) * 2;
  if (mouse.orbit) {
    camDesk.yaw   -= (nx - mouse.x) * 2.2;
    camDesk.pitch = Math.max(-1.3, Math.min(1.3, camDesk.pitch + (ny - mouse.y) * 1.6));
  }
  mouse.x = nx; mouse.y = ny; mouse.inside = true;
});
canvas.addEventListener("pointerleave", () => { mouse.inside = false; });
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  if (e.button === 0) mouse.inject = true; else mouse.orbit = true;
});
window.addEventListener("pointerup", e => { if (e.button === 0) mouse.inject = false; else mouse.orbit = false; });
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  camDesk.dist = Math.max(0.35, Math.min(3, camDesk.dist * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });

function desktopCamera(aspect) {
  const cp = Math.cos(camDesk.pitch), eye = [
    C[0] + camDesk.dist * cp * Math.sin(camDesk.yaw),
    C[1] + camDesk.dist * Math.sin(camDesk.pitch),
    C[2] + camDesk.dist * cp * Math.cos(camDesk.yaw),
  ];
  perspective(mProj, 0.9, aspect, 0.02, 60);
  lookAt(mView, eye, C, [0, 1, 0]);
  mul(mVP, mProj, mView); invert(mInvVP, mVP);
  return eye;
}
function desktopStir(eye, aspect, dt) {
  stirW.fill(0); stirGrab.fill(0); handCount = 0; injectN = 0;
  if (!mouse.inside) {
    prevJoint.delete("m");
    idleT += dt;
    if (idleT > 6) autoStir(dt); else autoActive = false;
    return;
  }
  idleT = 0; autoActive = false; prevJoint.delete("auto");
  const th = Math.tan(0.9 / 2);
  const f = [C[0] - eye[0], C[1] - eye[1], C[2] - eye[2]];
  let l = Math.hypot(...f); f[0] /= l; f[1] /= l; f[2] /= l;
  const r = [-f[2], 0, f[0]]; l = Math.hypot(...r) || 1; r[0] /= l; r[2] /= l;
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  const d = [
    f[0] + r[0] * mouse.x * th * aspect + u[0] * mouse.y * th,
    f[1] + r[1] * mouse.x * th * aspect + u[1] * mouse.y * th,
    f[2] + r[2] * mouse.x * th * aspect + u[2] * mouse.y * th,
  ];
  l = Math.hypot(...d); d[0] /= l; d[1] /= l; d[2] /= l;
  const t = (C[0] - eye[0]) * d[0] + (C[1] - eye[1]) * d[1] + (C[2] - eye[2]) * d[2];
  const px = eye[0] + d[0] * t, py = eye[1] + d[1] * t, pz = eye[2] + d[2] * t;
  pushStir(0, "m", px, py, pz, dt);
  injectN = mouse.inject ? 1 : 0;
  injectPos[0] = px; injectPos[1] = py; injectPos[2] = pz;
  handData[0] = px; handData[1] = py; handData[2] = pz; handData[3] = 0.012;
  handCount = 1;
}

// ── 每帧 ─────────────────────────────────────────────────────────────────────

let lastT = 0, tSec = 0, frames = 0, fpsAcc = 0, fps = 0;

function simulate(dt) {
  tSec += dt;
  updateGrabDrag(dt);
  updateRingSpin(dt);
  gl.bindVertexArray(vaoEmpty);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);

  // 1) 更新位置 + 速度（MRT 一次写两张）
  gl.bindFramebuffer(gl.FRAMEBUFFER, simFbo[1 - cur]);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.viewport(0, 0, TEX_W, ROWS);
  const U = progUpdate.u;
  gl.useProgram(progUpdate.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, posT[cur]); gl.uniform1i(U.uPos, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, velT[cur]); gl.uniform1i(U.uVel, 1);
  gl.uniform1f(U.uDt, dt); gl.uniform1f(U.uTime, tSec);
  gl.uniform3fv(U.uCenter, C);
  gl.uniform1f(U.uRadius, P.radius);
  gl.uniform1f(U.uDamp, P.damp);
  gl.uniform1f(U.uTurb, P.turb);
  gl.uniform3fv(U.uStirPos, stirPos);
  gl.uniform3fv(U.uStirVel, stirVel);
  gl.uniform1fv(U.uStirW, stirW);
  gl.uniform1fv(U.uStirGrab, stirGrab);
  gl.uniform1f(U.uStirRadius, P.srad);
  gl.uniform1f(U.uStirStrength, P.stir * 0.2);
  gl.uniform1f(U.uAttract, autoActive ? 0.0 : P.attract);   // 自动搅动不吸附
  gl.uniform1f(U.uBH, ST.bh || 0);
  gl.uniform1f(U.uRows, ROWS);
  gl.uniformMatrix3fv(U.uRingInv, false, ringInvMats());
  gl.uniform3fv(U.uInjectPos, injectPos);
  gl.uniform1f(U.uInjectN, injectN);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  cur = 1 - cur;

  // 2) 写进历史环形缓冲的下一个槽位
  head = (head + 1) % SLOTS;
  gl.bindFramebuffer(gl.FRAMEBUFFER, histFbo);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  gl.viewport(0, head * ROWS, TEX_W, ROWS);
  gl.useProgram(progHist.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, posT[cur]); gl.uniform1i(progHist.u.uPos, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, velT[cur]); gl.uniform1i(progHist.u.uVel, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function drawScene(proj, view, camPos, vpH) {
  mul(mVP, proj, view); invert(mInvVP, mVP);

  // 背景纯黑：不画任何背景 —— 清屏已经是 0，tonemap 后仍是 0。
  // 顺带省掉一整遍全屏，也彻底断了背景噪声这个伪影来源。
  // （加光显示的眼镜上，纯黑 = 完全透明，辉光直接浮在真实房间里。）

  // 手。墨：写深度让墨被手遮挡。发光风格：不写深度，辉光该从手上漫过去，
  //     否则手会变成一块死黑的剪影。
  if (handCount) {
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
    gl.depthMask(ST.additive ? false : true);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);   // HDR 里纯加法，压缩留给合成那一步
    gl.useProgram(progHand.p);
    gl.uniform1f(progHand.u.uAdditive, ST.additive);
    gl.bindVertexArray(handVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, handBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, handData, 0, handCount * 4);
    gl.useProgram(progHand.p);
    gl.uniformMatrix4fv(progHand.u.uProj, false, proj);
    gl.uniformMatrix4fv(progHand.u.uView, false, view);
    gl.uniform1f(progHand.u.uVpH, vpH);
    gl.drawArrays(gl.POINTS, 0, handCount);
  }

  // 粒子：测深度但不写深度。墨 = 乘法（越叠越暗），发光 = 加法（越叠越亮）。
  // 两者都与绘制顺序无关，三维半透明的排序问题直接消失。
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);   // HDR 里纯加法，压缩留给合成那一步
  gl.bindVertexArray(vaoEmpty);
  const K = progInk.u;
  gl.useProgram(progInk.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, histT); gl.uniform1i(K.uHist, 0);
  gl.uniformMatrix4fv(K.uProj, false, proj);
  gl.uniformMatrix4fv(K.uView, false, view);
  gl.uniform1i(K.uN, N); gl.uniform1i(K.uRows, ROWS);
  gl.uniform1i(K.uHead, head); gl.uniform1i(K.uSlots, SLOTS);
  gl.uniform1i(K.uTail, Math.round(P.tail));
  gl.uniform1f(K.uSize, P.size);
  gl.uniform1f(K.uVpH, vpH);
  gl.uniform1f(K.uDry, P.dry);
  gl.uniform1f(K.uOpacity, P.op);
  gl.uniform1f(K.uAdditive, ST.additive);
  gl.uniform1f(K.uSharp, P.sharp);
  gl.uniform1f(K.uDoppler, ST.doppler || 0);
  gl.uniform1f(K.uRadius, P.radius);
  gl.uniform3fv(K.uCamPos, camPos);
  gl.uniform3fv(K.uCenter, C);
  gl.uniform1f(K.uLens, ST.lens || 0);
  gl.uniformMatrix3fv(K.uRingRot, false, ringRot);
  // 光子球的角半径：次级像全部落在这个角度的圆环上，构成拱过洞顶的那道光弧
  const dCam = Math.hypot(camPos[0] - C[0], camPos[1] - C[1], camPos[2] - C[2]);
  gl.uniform1f(K.uPhotonAng, Math.asin(Math.min(0.99, (P.radius * 0.26) / Math.max(dCam, 0.05))));
  gl.uniform3fv(K.uInkCool, ST.cool);
  gl.uniform3fv(K.uInkWarm, ST.warm);
  // 三环：同一批粒子，倾角 0 / +60 / -60 各画一遍
  const TILTS = ST.rings ? RING_TILTS : [0];
  const nPts = N * Math.round(P.tail);
  for (let ti = 0; ti < TILTS.length; ti++) {
    gl.uniform1f(K.uTilt, TILTS[ti]);
    gl.uniform1f(K.uRingIdx, ST.rings ? ti : -1);
    gl.enable(gl.DEPTH_TEST);
    gl.uniform1f(K.uOpacity, P.op);
    gl.uniform1f(K.uPass, 0);
    gl.drawArrays(gl.POINTS, 0, nPts);
    if (ST.lens) {                                 // 次级像：更暗，且不参与深度（它是绕过来的光）
      gl.disable(gl.DEPTH_TEST);
      gl.uniform1f(K.uOpacity, P.op * 0.45);
      gl.uniform1f(K.uPass, 1);
      gl.drawArrays(gl.POINTS, 0, nPts);
    }
  }
  gl.uniform1f(K.uTilt, 0);

  // 光子环：环绕阴影的细亮圈，永远正对观察者（真实的光子环不在盘平面里）
  if (ST.bh) {
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progHalo.p);
    gl.uniformMatrix4fv(progHalo.u.uProj, false, proj);
    gl.uniformMatrix4fv(progHalo.u.uView, false, view);
    gl.uniform3fv(progHalo.u.uCenter, C);
    gl.uniform1f(progHalo.u.uR, P.radius * 0.26 * 2.4);   // 四边形半宽 = 环半径 × uSpread
    gl.uniform1f(progHalo.u.uRingW, 0.0045);     // 倒数的分子（压暗，别盖住细节）
    gl.uniform1f(progHalo.u.uRingEps, 0.045);    // 细
    gl.uniform1f(progHalo.u.uSpread, 2.4);
    gl.uniform3f(progHalo.u.uRingCol, 1.0, 0.94, 0.86);   // 自己的暖白，不跟风格走
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
}

// ── 桌面循环 ─────────────────────────────────────────────────────────────────

let rafId = 0;
function desktopFrame(t) {
  rafId = requestAnimationFrame(desktopFrame);
  const dt = Math.min((t - lastT) / 1000 || 0.016, 0.05);
  lastT = t;
  tickStats(dt);

  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const aspect = w / h;

  updateAuto(dt);
  const eye = desktopCamera(aspect);
  desktopStir(eye, aspect, dt);
  simulate(dt);

  ensureHDR(w, h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdrFbo);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1); gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawScene(mProj, mView, eye, h);
  postProcess(null, [[0, 0, w, h]]);
}

// ── WebXR ────────────────────────────────────────────────────────────────────

const TIPS = ["thumb-tip", "index-finger-tip", "middle-finger-tip", "ring-finger-tip", "pinky-finger-tip", "wrist"];
let xrSession = null, xrRefSpace = null, needPlace = false;

let xrBusy = false;
async function enterXR() {
  // 防重入：requestSession 在飞行中时再点一次，Chrome 会直接抛 InvalidStateError
  // （"已有活动会话"），把真正的错误盖掉。
  if (xrBusy || xrSession) return;
  xrBusy = true;
  const btn = document.getElementById("xr");
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "启动中…";
  try { await enterXRInner(); }
  finally { xrBusy = false; btn.disabled = false; btn.textContent = label; }
}

async function enterXRInner() {
  // 逐级降级：有些 runtime 对 optionalFeatures 也会整个拒掉，退到最朴素的配置再试
  const attempts = [
    { optionalFeatures: ["hand-tracking", "local-floor", "bounded-floor"] },
    { optionalFeatures: ["local-floor"] },
    {},
  ];
  // 只有「配置不支持」才值得降级再试；其它错误立刻停 ——
  // 否则后续尝试会撞上「已有活动会话」，把真正的根因盖掉。报第一个错，不是最后一个。
  let firstErr = null;
  for (const cfg of attempts) {
    try { xrSession = await navigator.xr.requestSession("immersive-vr", cfg); break; }
    catch (e) {
      if (!firstErr) firstErr = e;
      if (e.name !== "NotSupportedError") break;
    }
  }
  if (!xrSession) {
    const e = firstErr || { name: "?", message: "?" };
    let msg = "进入 XR 失败：" + e.name + " — " + e.message + "\n\n";
    if (e.name === "InvalidStateError") {
      msg += "浏览器认为已经有一个沉浸式会话在跑，多半是上一次失败留下的残留。\n" +
             "关掉这个标签页重开；还不行就结束 Chrome 的 XR 设备服务进程\n" +
             "（任务管理器里的 “XR 设备服务” / xr_device_service），不必重启整个浏览器。";
    } else {
      msg += "runtime 能被看到，但开不出 session。常见原因：\n" +
             "· runtime 服务是陈旧实例 —— 设备接入只在服务启动时判定一次，\n" +
             "  眼镜是服务起来之后才插的就会报这个。杀掉服务让它重起。\n" +
             "· 眼镜没进 XR / 3D 模式，当前只是普通扩展屏。\n" +
             "· 另一个程序独占了 XR 设备。";
    }
    alert(msg);
    return;
  }

  await gl.makeXRCompatible();
  xrSession.updateRenderState({
    baseLayer: new XRWebGLLayer(xrSession, gl, { antialias: false, framebufferScaleFactor: 0.85 }),
    depthNear: 0.02, depthFar: 60,
  });
  // 不要硬写世界坐标。3DoF / 无地面追踪的 runtime 会把 local-floor 的原点报在头的位置，
  // 于是 y=1.25 就跑到头顶一米多。改成：进去后按当前头姿把球摆在正前方。
  try { xrRefSpace = await xrSession.requestReferenceSpace("local-floor"); }
  catch { xrRefSpace = await xrSession.requestReferenceSpace("local"); }
  needPlace = true;          // 只在进入会话时摆一次；之后只认面板上的「重新摆位」按钮

  cancelAnimationFrame(rafId);
  setPanel(false);
  document.body.classList.add("xr-active");
  xrSession.addEventListener("end", () => {
    xrSession = null;
    document.body.classList.remove("xr-active");
    C[1] = 1.25; floorY = 0; prevJoint.clear();
    lastT = performance.now(); rafId = requestAnimationFrame(desktopFrame);
  });
  lastT = performance.now();
  xrSession.requestAnimationFrame(onXRFrame);
}

function updateHands(frame, dt) {
  stirW.fill(0); stirGrab.fill(0); handCount = 0; injectN = 0;
  let slot = 0;
  for (const src of frame.session.inputSources) {
    const hand = src.hand;
    if (hand) {
      const hc0 = handCount;
      // 渲染用全部关节；物理只用指尖 + 腕
      for (const joint of hand.values()) {
        if (handCount >= 60) break;
        const jp = frame.getJointPose(joint, xrRefSpace);
        if (!jp) continue;
        const p = jp.transform.position;
        handData[handCount * 4] = p.x; handData[handCount * 4 + 1] = p.y;
        handData[handCount * 4 + 2] = p.z; handData[handCount * 4 + 3] = jp.radius || 0.008;
        handCount++;
      }
      const slot0 = slot;
      let thumb = null, index = null, wrist = null, tipSum = 0, tipN = 0, fist = 0;
      for (const name of TIPS) {
        if (slot >= MAX_STIR) break;
        const j = hand.get(name);
        const jp = j && frame.getJointPose(j, xrRefSpace);
        if (!jp) continue;
        const p = jp.transform.position;
        pushStir(slot++, src.handedness + name, p.x, p.y, p.z, dt);
        if (name === "thumb-tip") thumb = p;
        if (name === "index-finger-tip") index = p;
        if (name === "wrist") wrist = p;
      }
      // 握拳检测：指尖到腕的平均距离，用这只手自己的尺度归一化（手有大小之分）。
      // 张开 ≈ 2.2 倍掌骨长，握紧 ≈ 1.1 倍。不依赖 runtime 是否支持 squeeze 手势。
      if (wrist) {
        for (const name of TIPS) {
          if (name === "wrist") continue;
          const j = hand.get(name);
          const jp = j && frame.getJointPose(j, xrRefSpace);
          if (!jp) continue;
          const p = jp.transform.position;
          tipSum += Math.hypot(p.x - wrist.x, p.y - wrist.y, p.z - wrist.z); tipN++;
        }
        const mc = hand.get("middle-finger-metacarpal");
        const mcp = mc && frame.getJointPose(mc, xrRefSpace);
        const scale = mcp
          ? Math.hypot(mcp.transform.position.x - wrist.x,
                       mcp.transform.position.y - wrist.y,
                       mcp.transform.position.z - wrist.z)
          : 0.075;
        if (tipN && scale > 0.02) {
          const ratio = (tipSum / tipN) / scale;
          fist = 1.0 - smooth01(ratio, 1.35, 1.95);        // 1 = 攥紧, 0 = 张开
          for (let k = slot0; k < slot; k++) stirGrab[k] = fist;
          if (fist > 0.5) for (let k = hc0; k < handCount; k++)  // 攥紧的手画亮一点
            if (handData[k * 4 + 3] > 0) handData[k * 4 + 3] = -handData[k * 4 + 3];
        }
      }

      // 捏合注入。必须排在握拳之后并把握拳排除掉 —— 攥拳时拇指和食指本来就贴在一起，
      // 不排除的话一握拳就在疯狂注入粒子。
      if (thumb && index && fist < 0.35 && injectN < 2) {
        const d = Math.hypot(thumb.x - index.x, thumb.y - index.y, thumb.z - index.z);
        if (d < 0.028) {
          injectPos[injectN * 3]     = (thumb.x + index.x) / 2;
          injectPos[injectN * 3 + 1] = (thumb.y + index.y) / 2;
          injectPos[injectN * 3 + 2] = (thumb.z + index.z) / 2;
          injectN++;
        }
      }
    } else if (src.gripSpace && slot < MAX_STIR) {           // 手柄兜底
      const gp = frame.getPose(src.gripSpace, xrRefSpace);
      if (gp) {
        const p = gp.transform.position;
        pushStir(slot++, src.handedness + "grip", p.x, p.y, p.z, dt);
        if (handCount < 60) {
          handData[handCount * 4] = p.x; handData[handCount * 4 + 1] = p.y;
          handData[handCount * 4 + 2] = p.z; handData[handCount * 4 + 3] = 0.02; handCount++;
        }
        const gamepad = src.gamepad;
        if (gamepad && gamepad.buttons[0] && gamepad.buttons[0].pressed && injectN < 2) {
          injectPos[injectN * 3] = p.x; injectPos[injectN * 3 + 1] = p.y; injectPos[injectN * 3 + 2] = p.z;
          injectN++;
        }
      }
    }
  }
  if (slot === 0) { idleT += dt; if (idleT > 6) autoStir(dt); }
  else { idleT = 0; autoActive = false; prevJoint.delete("auto"); }
}

function onXRFrame(t, frame) {
  xrSession.requestAnimationFrame(onXRFrame);
  const dt = Math.min((t - lastT) / 1000 || 0.011, 0.05);
  lastT = t;
  tickStats(dt);

  const pose = frame.getViewerPose(xrRefSpace);
  if (!pose) return;

  // 把球摆到头正前方 0.55m。只在进入会话时做一次，或按面板上的「重新摆位」。
  // 不绑任何手势 —— 之前绑了 squeeze，而 runtime 对握拳也发 squeeze，于是吸附时球会突然重置。
  const hm = pose.transform.matrix;
  if (needPlace) {
    needPlace = false;
    C[0] = hm[12] - hm[8] * 0.55;    // 头矩阵第三列取负 = 视线正前方
    C[1] = hm[13] - hm[9] * 0.55;
    C[2] = hm[14] - hm[10] * 0.55;
    floorY = C[1] - 1.1;
    initParticles(P.count);          // 粒子是绕旧中心播的，得重播
  }

  updateAuto(dt);
  updateHands(frame, dt);
  simulate(dt);                                   // 与视角无关，双眼只跑一次

  const layer = xrSession.renderState.baseLayer;
  ensureHDR(layer.framebufferWidth, layer.framebufferHeight);
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdrFbo);
  gl.viewport(0, 0, hdrW, hdrH);
  gl.clearColor(0, 0, 0, 1); gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const rects = [];
  for (const view of pose.views) {
    const vp = layer.getViewport(view);
    gl.viewport(vp.x, vp.y, vp.width, vp.height);
    const m = view.transform.matrix;              // 视图矩阵的逆 = 相机位置
    drawScene(view.projectionMatrix, view.transform.inverse.matrix, [m[12], m[13], m[14]], vp.height);
    rects.push([vp.x, vp.y, vp.width, vp.height]);
  }
  postProcess(layer.framebuffer, rects);
}

// ── UI ───────────────────────────────────────────────────────────────────────

function tickStats(dt) {
  frames++; fpsAcc += dt;
  if (fpsAcc > 0.5) { fps = frames / fpsAcc; frames = 0; fpsAcc = 0; }
}
const statEl = document.getElementById("stat");
setInterval(() => {
  if (!statEl) return;
  statEl.textContent = `${fps.toFixed(0)} fps · ${(N / 1000).toFixed(0)}k 粒子 × ${Math.round(P.tail)} 段 = ${((N * P.tail) / 1000).toFixed(0)}k 点`;
}, 400);

const bind = (id, key, fmt) => {
  const el = document.getElementById("p_" + id), out = document.getElementById("v_" + id);
  if (!el) return;
  const sync = () => { P[key] = parseFloat(el.value); if (out) out.textContent = fmt ? fmt(P[key]) : P[key].toFixed(2); };
  el.addEventListener("input", sync); sync();
};
bind("exposure", "exposure"); bind("bloom", "bloom"); bind("bloomR", "bloomR");
bind("sharp", "sharp");
bind("attract", "attract");
bind("stir", "stir"); bind("srad", "srad", v => v.toFixed(3) + "m"); bind("damp", "damp");
bind("turb", "turb"); bind("size", "size", v => (v * 1000).toFixed(0) + "mm");
bind("op", "op"); bind("tail", "tail", v => v.toFixed(0)); bind("dry", "dry");
bind("rad", "radius", v => (v * 100).toFixed(0) + "cm");

document.getElementById("p_count").addEventListener("change", e => {
  P.count = parseInt(e.target.value, 10); initParticles(P.count);
});

// 切风格：把预设灌进 P，并把滑块拨到对应位置（之后仍可手调）
function syncSliders() {
  for (const k of LERP_KEYS) {
    const el = document.getElementById("p_" + k);
    if (el) { el.value = P[k]; el.dispatchEvent(new Event("input")); }
  }
}
function applyStyle(name) {
  P.style = name;
  ST = (name === "auto") ? AUTO : STYLES[name];
  if (name !== "auto") {
    for (const k of LERP_KEYS) {
      if (ST[k] === undefined) continue;
      P[k] = ST[k];
    }
    syncSliders();
  }
  document.documentElement.toggleAttribute("data-dark", !!ST.dark);
  document.documentElement.style.background = ST.dark ? "#05070C" : "#EFE9DC";
  document.body.style.background = ST.dark ? "#05070C" : "#EFE9DC";
  document.body.style.color = ST.dark ? "#C8D4E4" : "#2B2118";
  document.getElementById("title").textContent = (ST.label || "自动渐变").replace(/（.*$/, "");
}
document.getElementById("p_style").addEventListener("change", e => applyStyle(e.target.value));
function setPanel(open) {
  document.getElementById("panel").classList.toggle("open", open);
  document.getElementById("ui").classList.toggle("shift", open);
}
document.getElementById("toggle").addEventListener("click", () =>
  setPanel(!document.getElementById("panel").classList.contains("open")));
document.getElementById("close").addEventListener("click", () => setPanel(false));
document.getElementById("exit").addEventListener("click", () => {
  if (xrSession) xrSession.end();
});
document.getElementById("recenter").addEventListener("click", () => { needPlace = true; });
canvas.addEventListener("pointerdown", () => setPanel(false));   // 点画布也关
document.getElementById("reset").addEventListener("click", () => initParticles(P.count));
window.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") initParticles(P.count);
  if (e.key === "h" || e.key === "H") setPanel(!document.getElementById("panel").classList.contains("open"));
  if (e.key === "Escape") setPanel(false);
});

const xrBtn = document.getElementById("xr");
if (navigator.xr) {
  navigator.xr.isSessionSupported("immersive-vr").then(ok => {
    xrBtn.disabled = !ok;
    xrBtn.textContent = ok ? "进入 VR" : "此设备无 VR";
    if (ok) xrBtn.addEventListener("click", enterXR);
  }).catch(() => { xrBtn.textContent = "此设备无 VR"; });
} else xrBtn.textContent = "浏览器无 WebXR";

// ── 启动 ─────────────────────────────────────────────────────────────────────
if (OK) {
  applyStyle(P.style);
  initParticles(P.count);
  lastT = performance.now();
  rafId = requestAnimationFrame(desktopFrame);
}
</script>
</body>
</html>
