<style>
  :root {
    --bg: #07060d; --ink: #ece7dc; --dim: #9a958c; --faint: #5d5a55; --gold: #e2b65c;
    --panel: rgba(12, 11, 20, .92); --line: rgba(236, 231, 220, .16);
    --pix: "Silkscreen", ui-monospace, monospace;
    --serif: Georgia, "Songti SC", "STSong", "SimSun", serif;
    --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 14px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  /* 星图：画布按「像素」低分辨率渲染，CSS 用最近邻放大 */
  #sky { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; display: block; }
  #sky.hot { cursor: pointer; }

  #brand { position: fixed; left: 0; top: 0; padding: calc(22px + env(safe-area-inset-top, 0px)) 24px 0; pointer-events: none; transition: opacity .4s; }
  .kicker { font: 11px/1 var(--pix); letter-spacing: .18em; color: var(--gold); text-transform: uppercase; }
  h1 { margin: 10px 0 4px; font: 400 clamp(26px, 4.4vw, 42px)/1.15 var(--serif); letter-spacing: .05em; text-shadow: 0 2px 0 #000; }
  .lede { margin: 0; color: var(--dim); max-width: 34ch; font-size: 13px; text-shadow: 0 1px 0 #000; }
  body.focused #brand { opacity: .25; }

  #lang { --pb: #3d3656; position: fixed; right: 24px; top: calc(24px + env(safe-area-inset-top, 0px)); z-index: 5; font: 11px/1 var(--pix); letter-spacing: .12em;
          background: #0e0c19; border: 0; padding: 7px 10px; cursor: pointer;
          box-shadow: 0 -3px 0 0 var(--pb), 0 3px 0 0 var(--pb), -3px 0 0 0 var(--pb), 3px 0 0 0 var(--pb); }
  #lang:hover, #lang:focus-visible { --pb: var(--gold); outline: none; }

  /* 星球名字、星系名字：DOM 文字，保证清楚 */
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .pl { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-align: center; transition: opacity .25s; text-shadow: 0 1px 0 #000, 0 0 6px #000; }
  .pl b { display: block; font: 400 13px/1.3 var(--sans); letter-spacing: .06em; }
  .pl i { display: block; font: 9px/1.4 var(--pix); font-style: normal; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
  .pl.hov b { color: var(--gold); }

  /* 像素框：四条 box-shadow 拼出缺角的直角边，再加一个硬投影 */
  .px { --pb: #3d3656; box-shadow: 0 -3px 0 0 var(--pb), 0 3px 0 0 var(--pb), -3px 0 0 0 var(--pb), 3px 0 0 0 var(--pb), 6px 6px 0 3px rgba(0, 0, 0, .55); }

  /* 信息卡 */
  #card { position: fixed; right: 30px; top: 50%; width: 352px; max-height: calc(100% - 60px); overflow: auto; z-index: 4; background: #0e0c19;
          transform: translate(calc(100% + 60px), -50%); transition: transform .34s steps(6, end); scrollbar-width: thin; }
  #card.on { transform: translate(0, -50%); }
  .cbar { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 10px; background: var(--gold); color: #1a1206;
          font: 10px/1 var(--pix); letter-spacing: .14em; }
  .cbar .dots { display: flex; gap: 3px; margin-left: auto; }
  .cbar .dots i { width: 6px; height: 6px; background: #1a1206; opacity: .35; }
  .cbar .dots i:first-child { opacity: .85; }
  #close { width: 20px; height: 20px; padding: 0; border: 0; background: #1a1206; color: var(--gold); font: 12px/20px var(--pix); cursor: pointer; }
  #close:hover, #close:focus-visible { background: #fff3cf; color: #1a1206; outline: none; }
  #c-cv { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border-bottom: 3px solid #3d3656; }
  .cbody { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 11px; }
  .cmeta { display: flex; justify-content: space-between; gap: 10px; font: 9px/1.4 var(--pix); letter-spacing: .12em; color: #6f6888; text-transform: uppercase; }
  #card h2 { margin: 0; font: 700 22px/1.25 var(--sans); letter-spacing: .08em; text-shadow: 2px 2px 0 #000; }
  #card h2 small { display: block; font: 10px/1.8 var(--pix); color: var(--gold); letter-spacing: .14em; text-transform: uppercase; text-shadow: none; }
  #card p { margin: 0; color: #cfc9be; font-size: 13px; line-height: 1.75; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 0 3px; }
  .chips span { --pb: #2a2540; font-size: 11px; line-height: 1.5; color: var(--dim); background: #16132a; padding: 1px 7px;
                box-shadow: 0 -2px 0 0 var(--pb), 0 2px 0 0 var(--pb), -2px 0 0 0 var(--pb), 2px 0 0 0 var(--pb); }
  .chips.dev span { --pb: #1d4a55; color: #a9e4ee; background: #0c2129; }
  .cact { display: flex; gap: 12px; margin-top: 6px; padding: 0 3px 3px; }
  .btn { --pb: #3d3656; display: inline-flex; align-items: center; justify-content: center; padding: 9px 12px; border: 0; background: #16132a; color: var(--ink);
         font: 11px/1 var(--pix); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; cursor: pointer;
         box-shadow: 0 -3px 0 0 var(--pb), 0 3px 0 0 var(--pb), -3px 0 0 0 var(--pb), 3px 0 0 0 var(--pb), 3px 3px 0 3px #000; }
  .btn:hover, .btn:focus-visible { --pb: var(--gold); outline: none; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 -3px 0 0 var(--pb), 0 3px 0 0 var(--pb), -3px 0 0 0 var(--pb), 3px 0 0 0 var(--pb); }
  .btn.go { --pb: #f4cf7a; flex: 1; background: var(--gold); color: #1a1206; }
  .btn.go:hover, .btn.go:focus-visible { background: #f4cf7a; --pb: #fff3cf; }

  #hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 12px; color: var(--faint);
          white-space: nowrap; pointer-events: none; transition: opacity .4s; text-shadow: 0 1px 0 #000; }
  #foot { position: fixed; left: 24px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: var(--faint); transition: opacity .4s; }
  #foot a { color: var(--dim); }
  body.focused #hint, body.focused #foot { opacity: 0; pointer-events: none; }

  #fade { position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .35s; }

  /* 读屏器和键盘用的作品清单；没有 WebGL 时它就是整个页面 */
  #list { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #list a:focus { outline: none; }
  body.nogl { overflow: auto; }
  body.nogl #sky, body.nogl #labels, body.nogl #hint { display: none; }
  body.nogl #brand { position: static; }
  body.nogl #foot { position: static; padding: 0 24px 32px; }
  body.nogl #list { position: static; width: auto; height: auto; clip-path: none; display: grid; gap: 10px; padding: 24px; max-width: 720px; }
  body.nogl #list a { display: block; padding: 12px 14px; border: 2px solid var(--line); text-decoration: none; }
  body.nogl #list a:hover, body.nogl #list a:focus { border-color: var(--gold); }

  @media (max-width: 760px) {
    #brand { padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0; }
    #lang { right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); }
    #card { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 62%; box-shadow: 0 -3px 0 0 #3d3656; transform: translateY(105%); }
    #card.on { transform: translateY(0); }
    #c-cv { aspect-ratio: 21 / 9; }
    #foot { left: 16px; right: 16px; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); text-align: center; }
    #hint { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  }
</style>

<body>
<canvas id="sky" aria-hidden="true"></canvas>
<header id="brand">
  <div class="kicker" data-i18n="kicker"></div>

  <p class="lede" data-i18n="lede"></p>

<button id="lang" type="button"></button>
<div id="labels"></div>

  <div class="cbody">
    <div class="cmeta"><span id="c-dir"></span><span id="c-note"></span></div>
    <h2 id="c-title"></h2>
    <p id="c-blurb"></p>
    <div class="chips dev" id="c-dev"></div>
    <div class="chips" id="c-tags"></div>
    <div class="cact">
      <button class="btn" id="c-prev" type="button" aria-label="previous">◀</button>
      <a class="btn go" id="c-go" href="#"></a>
      <button class="btn" id="c-next" type="button" aria-label="next">▶</button>
    </div>
  </div>
</aside>
<nav id="list"></nav>
<div id="hint" data-i18n="hint"></div>
<footer id="foot" data-i18n-html="foot"></footer>
<div id="fade"></div>

<script type="module">

// ---------- 着色器 ----------
const NOISE = /* glsl */`
  float h31(vec3 p) { p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
  float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
  float vn3(vec3 p) {
    vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(mix(h31(i), h31(i + vec3(1, 0, 0)), f.x), mix(h31(i + vec3(0, 1, 0)), h31(i + vec3(1, 1, 0)), f.x), f.y),
               mix(mix(h31(i + vec3(0, 0, 1)), h31(i + vec3(1, 0, 1)), f.x), mix(h31(i + vec3(0, 1, 1)), h31(i + vec3(1, 1, 1)), f.x), f.y), f.z);
  }
  float fbm3(vec3 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn3(p); p = p * 2.03 + 17.1; a *= .5; } return s / .9375; }
  float vn2(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
  float fbm2(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn2(p); p = p * 2.03 + 11.7; a *= .5; } return s / .9375; }
  float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2. + a.y * a.y * .75); }
  float bayer4(vec2 a) { return bayer2(.5 * a) * .25 + bayer2(a); }
`;

// 背景：远星 / 星云 / 中星 / 近尘四层，各按自己的视差系数跟相机走（伪 3D 的纵深感来自这里）
const BG_FRAG = /* glsl */`
  uniform vec2 uRes, uCam, uHubA, uHubB; uniform float uZoom, uTime, uFlip;
  ${NOISE}
  float starLayer(vec2 s, float k, float cell, float dens, float seed, out vec3 tint) {
    vec2 w = floor(s / pow(uZoom, k) + uCam * k + seed * 97.);
    vec2 c = floor(w / cell);
    float h = h21(c + seed);
    vec2 sp = c * cell + floor(vec2(h21(c + seed + 3.1), h21(c + seed + 7.7)) * (cell - 2.)) + 1.;
    float t = h21(c + seed + 1.3);
    tint = t < .15 ? vec3(1., .8, .55) : t < .3 ? vec3(.6, .85, 1.) : vec3(1.);
    if (h < 1. - dens) return 0.;
    vec2 d = abs(w - sp);
    float tw = .55 + .45 * sin(uTime * (.6 + 2. * t) + h * 40.);
    if (d.x + d.y < .5) return tw;
    if (k > .5 && h > 1. - dens * .35 && d.x + d.y < 1.5 && min(d.x, d.y) < .5) return tw * .45;   // 近一点的亮星带十字
    return 0.;
  }
  // 远处的小星系：每个大格子里有一定概率放一个小旋涡，几档亮度
  float farGalaxy(vec2 s, float k) {
    vec2 w = s / pow(uZoom, k) + uCam * k;
    float cell = 150.;
    vec2 c = floor(w / cell);
    if (h21(c + 21.) < .55) return 0.;
    vec2 o = (vec2(h21(c + 3.), h21(c + 5.)) * .6 + .2) * cell;
    vec2 p = w - c * cell - o;
    float a = h21(c + 9.) * 3.14, ca = cos(a), sa = sin(a);
    p = vec2(ca * p.x - sa * p.y, sa * p.x + ca * p.y);
    float sz = 5. + h21(c + 7.) * 9.;
    vec2 e = p / vec2(sz, sz * (.3 + h21(c + 11.) * .4));
    float r = length(e), th = atan(e.y, e.x);
    float dens = exp(-r * r * 2.2) + max(cos(2. * (th - 2.2 * log(r + .1))), 0.) * exp(-r * 1.6) * .45;
    return floor(dens * 3.2) / 3.;
  }
  void main() {
    vec2 s = gl_FragCoord.xy - uRes * .5;
    vec2 world = s / uZoom + uCam;
    vec3 col = vec3(.03, .026, .058);
    // 星云：形状按自己的视差层走，颜色按离哪个星团近（作品那边暖、游戏那边冷）。不抖动，只分档。
    vec2 nw = s / pow(uZoom, .15) + uCam * .15;
    vec2 q = nw * .0058;
    float warp = fbm2(q * 1.7 + 3.);
    float n = fbm2(q * 1.3 + warp * 1.6);
    float dA = length(world - uHubA), dB = length(world - uHubB), dS = length(world);
    float side = clamp(.5 + (dB - dA) / 520. + (warp - .5) * .5, 0., 1.);
    float near = clamp(1.15 - min(min(dA, dB), dS * 1.25) / 380., .2, 1.);   // 星团和中心附近更浓
    float lv = floor(clamp((n - .4) * 3.2 * near, 0., .999) * 5.);
    vec3 warm0 = vec3(.10, .04, .10), warm1 = vec3(.20, .07, .16), warm2 = vec3(.33, .11, .19), warm3 = vec3(.48, .2, .18);
    vec3 cool0 = vec3(.03, .07, .12), cool1 = vec3(.04, .14, .22), cool2 = vec3(.07, .24, .32), cool3 = vec3(.15, .38, .42);
    vec3 neb = lv < .5 ? vec3(0.) : lv < 1.5 ? mix(cool0, warm0, side) : lv < 2.5 ? mix(cool1, warm1, side) : lv < 3.5 ? mix(cool2, warm2, side) : mix(cool3, warm3, side);
    // 档与档交界处亮一条细边，像素画星云的「描边」感
    float n2 = fbm2((nw + vec2(1., 0.)) * .0058 * 1.3 + warp * 1.6);
    float lv2 = floor(clamp((n2 - .4) * 3.2 * near, 0., .999) * 5.);
    if (lv2 != lv && lv >= 2.) neb *= 1.35;
    col += neb * .5;
    // 中心恒星的大光晕：几圈分档的暖光
    float halo = 1. - dS / 520.;
    col += vec3(.16, .07, .03) * floor(clamp(halo, 0., 1.) * 4.) / 4. * .55;
    col += vec3(.55, .45, .75) * farGalaxy(s, .08) * .35;
    vec3 tint;
    col += .4 * starLayer(s, .05, 6., .3, 1., tint) * tint;
    col += .75 * starLayer(s, .25, 11., .3, 2., tint) * tint;
    col += starLayer(s, .55, 19., .34, 3., tint) * tint;
    // 流星：每 6 秒一个时段，大约一半时段里划过一颗
    float slot = floor(uTime / 6.), ph = fract(uTime / 6.) * 6.;
    if (h21(vec2(slot, 4.)) > .45 && ph < 1.1) {
      vec2 st = (vec2(h21(vec2(slot, 1.)), h21(vec2(slot, 2.))) - .5) * uRes * .9;
      vec2 dir = normalize(vec2(-.9, -.35 - h21(vec2(slot, 3.)) * .5));
      vec2 head = st + dir * ph * 220.;
      vec2 rel = s - head;
      float along = -dot(rel, dir), across = abs(rel.x * dir.y - rel.y * dir.x);
      if (along > 0. && along < 34. && across < .7) col += vec3(1., .95, .85) * (1. - along / 34.) * (1. - ph / 1.1);
    }
    // 近尘：比星球还近，慢慢飘
    vec2 ds = s + vec2(uTime * 3., uTime * 1.3);
    float d = starLayer(ds, 1.6, 37., .25, 4., tint);
    col += d * vec3(.9, .8, .65) * .55;
    gl_FragColor = vec4(col, 1.);
  }
`;

// 星球：一个方块上的球面着色器。type 0 类地 / 1 熔岩 / 2 深海冰 / 3 带环气态 / 4 旋臂星系 / 5 恒星 / 6 卫星
const PL_FRAG = /* glsl */`
  uniform float uType, uTime, uSeed, uSpin, uTilt, uScale, uSea, uCloud, uLights, uBands, uSwirl, uExt, uPx, uHover, uDim, uRingTilt, uPulse, uQuant, uSphere;
  uniform mat3 uCamRot;
  uniform vec3 uLight, uBg, uE1, uE2;
  uniform vec3 uA[4], uB[4], uC[4], uD[4];
  varying vec2 vUv;
  varying vec3 vNv;
  ${NOISE}
  vec3 rA(float i) { return i < .5 ? uA[0] : i < 1.5 ? uA[1] : i < 2.5 ? uA[2] : uA[3]; }
  vec3 rB(float i) { return i < .5 ? uB[0] : i < 1.5 ? uB[1] : i < 2.5 ? uB[2] : uB[3]; }
  vec3 rC(float i) { return i < .5 ? uC[0] : i < 1.5 ? uC[1] : i < 2.5 ? uC[2] : uC[3]; }
  vec3 rD(float i) { return i < .5 ? uD[0] : i < 1.5 ? uD[1] : i < 2.5 ? uD[2] : uD[3]; }
  vec3 spin(vec3 n, float speed) {
    float c = cos(uTilt), s = sin(uTilt);
    n.xy = vec2(c * n.x - s * n.y, s * n.x + c * n.y);
    float a = uTime * speed + uSeed * 6.3; float ca = cos(a), sa = sin(a);
    n.xz = vec2(ca * n.x - sa * n.z, sa * n.x + ca * n.z);
    return n;
  }
  float level(float lam, vec2 px, float bias) {
    float L = clamp(lam * .75 + .42 + bias, 0., 1.);
    return clamp(floor(L * 3.999 + (bayer4(px) - .5) * .75), 0., 3.);
  }
  void main() {
    vec2 p = uSphere > .5 ? vNv.xy : (vUv * 2. - 1.) * uExt;   // 以半径为单位；球体模式用视空间法线的 xy
    if (uQuant > 0.) p = (floor(p * uQuant) + .5) / uQuant;   // XR 里没有低分辨率画布，在这里取整出像素格
    vec2 px = floor(p * uPx);                  // 星球自己的像素格（抖动钉在星球上，不随屏幕闪）
    float d = length(p);
    float onePx = 1. / max(uPx, 1.);
    vec3 col = vec3(0.); bool hit = false;

    if (uType > 6.5 && uType < 7.5) {          // 彗星：尾巴背着太阳，越靠近太阳越长
      vec2 L2 = normalize(uLight.xy + vec2(1e-4));
      vec2 T = -L2;
      float along = dot(p, T), across = abs(p.x * T.y - p.y * T.x);
      float b = bayer4(px);
      float len = uScale;
      if (d < 1.) { col = d < .55 ? uE1 : rA(3.); hit = true; }
      else if (d < 2.1 && 1. - (d - 1.) / 1.1 > b * .9 + .05) { col = rA(2.); hit = true; }
      else if (along > 0. && along < len) {
        float wdt = .7 + along * .32;
        float f = (1. - along / len) * (1. - across / wdt);
        float grain = h21(floor(px * .5) + floor(uTime * 6.));
        if (across < wdt && f + (grain - .5) * .35 > b * .75 + .08) { col = f > .55 ? rA(2.) : f > .3 ? rA(1.) : rA(0.); hit = true; }
        // 第二条：弯一点的尘埃尾，偏暖
        vec2 Tb = normalize(T + vec2(-T.y, T.x) * .35);
        float al2 = dot(p, Tb), ac2 = abs(p.x * Tb.y - p.y * Tb.x);
        if (!hit && al2 > 0. && al2 < len * .7 && ac2 < .5 + al2 * .45 && (1. - al2 / (len * .7)) * .7 > b * .8 + .1) { col = mix(uE2, rA(1.), .4); hit = true; }
      }
      if (hit) col += uHover * .15;
    } else if (uType > 3.5 && uType < 4.5) {          // 旋臂星系
      float c = cos(uTilt), s = sin(uTilt);
      vec2 r2 = vec2(c * p.x - s * p.y, s * p.x + c * p.y);
      vec2 e = vec2(r2.x, r2.y / .62) * 1.15;
      float r = length(e), th = atan(e.y, e.x);
      float arms = cos(2. * (th - 2.4 * log(r + .06) - uTime * uSpin));
      float n = fbm2(e * 3.2 + uSeed * 9.);
      float dens = exp(-r * 2.6) * 1.3 + pow(max(arms, 0.), 1.5) * exp(-r * .95) * (.5 + .6 * n) * .95 - .07 + (n - .5) * .14;
      dens += uHover * .12;
      float lv = floor(dens * 5. + (bayer4(px) - .5) * .8);
      if (lv < .5) {
        if (h21(px + uSeed) > .985 && r < 1.9) { col = rA(2.); hit = true; }   // 外围零星的星
      } else { col = lv > 3.5 ? uE1 : rA(lv - 1.); hit = true; }
    } else if (uType > 4.5 && uType < 5.5) {   // 恒星：米粒状对流 + 临边昏暗 + 黑子，外面是一圈圈火焰日冕
      float b = bayer4(px);
      if (d < 1.) {
        vec3 n = vec3(p, sqrt(1. - d * d));
        vec3 q = spin(n, uSpin);
        float gran = vn3(q * 9. + vec3(0., uTime * .25, 0.)) * .6 + fbm3(q * 3.5 + vec3(uTime * .05)) * .7;
        float spot = fbm3(q * 2.2 + uSeed * 5.);
        float v = n.z * 1.15 + (gran - .65) * .9;
        float lv = floor(v * 3.6 + (b - .5) * .55);
        if (spot > .72) lv -= spot > .78 ? 2. : 1.;
        col = lv >= 4. ? uE1 : rA(clamp(lv, 0., 3.));
        hit = true;
      } else {
        float a = atan(p.y, p.x);
        // 两层火舌：慢的大火舌 + 快的细火苗，沿着角度起伏
        float big = fbm2(vec2(a * 2.2 + uSeed * 9., uTime * .18));
        float fine = vn2(vec2(a * 14., uTime * .9 - d * 3.));
        float reach = (uExt - 1.) * (.25 + big * .95 + fine * .25);
        float g = 1. - (d - 1.) / reach;
        if (g > .72) { col = uA[3]; hit = true; }
        else if (g > .42 + (b - .5) * .18) { col = uA[2]; hit = true; }
        else if (g > .12 + (b - .5) * .2) { col = uA[1]; hit = true; }
        else if (g > -.25 && b > .82 - g * .5) { col = mix(uBg, uE2, .45); hit = true; }   // 最外面稀疏的光点
      }
    } else {
      // 环（type 3）：倾斜的椭圆环，后半圈被星球挡住
      bool ringHit = false; bool ringFront = false; vec3 ringCol = vec3(0.);
      if (uType > 2.5 && uType < 3.5 && uSphere < .5) {
        float c = cos(uRingTilt), s = sin(uRingTilt);
        vec2 r2 = vec2(c * p.x - s * p.y, s * p.x + c * p.y);
        vec2 e = vec2(r2.x, r2.y / .28);
        float rr = length(e);
        if (rr > 1.35 && rr < 2.15) {
          float band = h21(vec2(floor(rr * 16.), uSeed));
          if (band > .18) {
            ringHit = true; ringFront = e.y < 0.;
            float lv = clamp(floor(band * 3.2 + uPulse * 1.6 + (bayer4(px) - .5) * .6), 0., 3.);
            ringCol = mix(rC(lv), uE1, uPulse * .35 * step(2., lv));
          }
        }
      }
      if (d < 1.) {
        vec3 n = vec3(p, sqrt(1. - d * d));
        if (uSphere > .5) n = uCamRot * n;       // 球体：取整后的视空间法线转回世界方向，图案钉在星球上、光照用真实太阳方向
        float lam = dot(n, uLight);
        vec3 q = spin(n, uSpin);
        if (uType < .5) {                      // 类地
          float h = fbm3(q * uScale + uSeed * 7.);
          bool land = h > uSea;
          float lv = level(lam, px, 0.);
          if (land) {
            if (uBands > .5) { float y = q.y; col = y > .3 ? rA(lv) : y < -.3 ? rB(lv) : rD(lv); }
            else col = rA(lv);
          } else col = rB(lv);
          vec3 qc = spin(n, uSpin * 1.6);
          float cl = uSwirl > .5 ? fbm3(qc * 2.2 + vec3(fbm3(qc * 3.) * 2.5, 0., uSeed)) : fbm3(qc * 3.1 + uSeed * 3.);
          bool cloud = cl > uCloud;
          if (cloud) col = rC(level(lam, px, .1));
          if (uLights > 0. && land && !cloud && lam < -.02) {
            vec3 g = floor(q * uLights);
            if (h31(g + uSeed) > .87) col = uE1 * (.75 + .25 * sin(uTime * 2. + h31(g) * 9.));
          }
        } else if (uType < 1.5) {              // 熔岩（霓虹）
          float lv = level(lam, px, -.05);
          col = rA(lv);
          float r = 1. - abs(fbm3(q * uScale + uSeed * 5.) * 2. - 1.);
          if (r > uSea) {
            float which = fbm3(q * 1.3 + 5.);
            col = which > .5 ? uE1 : uE2;
            if (r < uSea + .05) col *= .6;
            col *= .8 + .2 * sin(uTime * 3. + which * 12.);
          }
        } else if (uType < 2.5) {              // 深海冰星 + 会游的冷光点
          float h = fbm3(q * uScale + uSeed * 4.);
          float lv = level(lam, px, 0.);
          col = abs(q.y) + h * .35 > .95 ? rB(lv) : rA(lv);
          vec3 qd = spin(n, uSpin * 2.3);
          vec3 g = floor(qd * uLights);
          vec3 f = fract(qd * uLights) - .5;
          float hh = h31(g + uSeed);
          if (hh > .82 && length(f) < .3) col = hh > .97 ? uE2 : uE1 * (.6 + .4 * sin(uTime * 2.5 + hh * 30.));
        } else if (uType < 3.5) {              // 气态巨行星：带状
          float b = q.y * uScale + (fbm3(q * vec3(2., 5., 2.) + uSeed) - .5) * 3.;
          float t = sin(b) * .5 + .5;
          float lv = level(lam, px, 0.);
          col = t > .5 ? rA(lv) : rB(lv);
        } else if (uType > 7.5 && uType < 8.5) {   // 入画：几幅名画拼成的星球，油彩顺着笔触方向走，星月夜那块有旋涡
          float lv = level(lam, px, .05);
          float reg = fbm3(q * .75 + uSeed * 3.);
          float ang = fbm3(q * 1.8 + 11.) * 9.4;
          vec3 t1 = normalize(cross(q, vec3(0., 1., 0.)) + 1e-3), t2 = cross(q, t1);
          vec3 fl = t1 * cos(ang) + t2 * sin(ang), ac = cross(q, fl);
          float stroke = fract(dot(q, ac) * 34. + vn3(q * 9.) * 1.5);   // 一道道平行的笔触
          float k = clamp(lv + (stroke < .34 ? -1. : stroke > .7 ? 1. : 0.), 0., 3.);
          if (reg < .53) {                                          // 星月夜：深蓝底 + 黄白旋涡
            col = rA(k);
            vec3 g = floor(q * 2. + uSeed), c = g + .5 + (vec3(h31(g), h31(g + 4.), h31(g + 9.)) - .5) * .4;
            vec3 v = q * 2. - c; float r = length(v);
            if (r < .48 && sin(r * 30. - atan(v.y, v.x + v.z) * 2. - uTime * .6) > .35) col = r < .12 ? uE1 : r < .3 ? vec3(.96, .8, .3) : mix(vec3(.96, .8, .3), rA(3.), .35);
          } else if (reg < .6) col = rB(k);                        // 麦田 / 向日葵：赭黄
          else if (reg < .66) {                                    // 睡莲：青绿水面，零星粉色花
            col = rC(min(k, 2.));

    v.homeQ.setFromAxisAngle(new V3(0, 1, 0), Math.atan2(-f.x, -f.z)); v.Q.copy(v.homeQ); v.Qt.copy(v.homeQ);
    v.px.x = v.homeP.x; v.py.x = v.homeP.y; v.pz.x = v.homeP.z; v.k.x = 0; v.px.v = v.py.v = v.pz.v = v.k.v = 0;
  }
  { // 双手旋转：两手连线从上一帧转到这一帧的那个旋转，放大一点后加到星系朝向上（没聚焦时绕太阳转，聚焦时绕那颗星球转）
    const [a, b] = xrHands, v = xrView;
    if (a.down && b.down && a.both) {
      const d = b.c.position.clone().sub(a.c.position);
      if (d.lengthSq() > 1e-4) {
        d.normalize();
        if (xrGrabV) {
          const dq = new THREE.Quaternion().setFromUnitVectors(xrGrabV, d), ang = 2 * Math.acos(Math.min(1, Math.abs(dq.w)));
          if (ang > 1e-5) { const ax = new V3(dq.x, dq.y, dq.z).normalize().multiplyScalar(Math.sign(dq.w) || 1); dq.setFromAxisAngle(ax, ang * 1.6); }

  }
  { // 星系摆放：朝向追目标，大小和位置走弹簧
    const v = xrView, fw = xrFocus >= 0 ? WORKS[xrFocus] : null;
    if (!xrGrabV) v.Q.slerp(v.Qt, 1 - Math.exp(-dt * 5));
    spring(v.k, fw ? Math.log(Math.max(1, XR_FOCUS_R / (sizeOf(fw) * XR.S))) : 0, .8, dt);
    const k = Math.exp(v.k.x);
    let tp = v.homeP;
    if (fw) tp = v.anchor.clone().sub(xrLocal(fw, orbitT).v.multiplyScalar(k).applyQuaternion(v.Q));   // 让这颗星球落在聚焦点上
    spring(v.px, tp.x, .8, dt); spring(v.py, tp.y, .8, dt); spring(v.pz, tp.z, .8, dt);
    xrRoot.position.set(v.px.x, v.py.x, v.pz.x); xrRoot.quaternion.copy(v.Q); xrRoot.scale.setScalar(k);
  }
  const K = xrRoot.scale.x;
  spring(orbitRate, xrPoint >= 0 || xrFocus >= 0 || xrGrabV ? 0 : 1, .6, dt);
  orbitT += dt * orbitRate.x;
  xrRoot.updateMatrixWorld();
  const sunW = xrRoot.localToWorld(new V3());
  for (const w of WORKS) { const L = xrLocal(w, orbitT); w.xw = xrRoot.localToWorld(L.v); w.dist = L.dist; }
  // 手的射线选中：射线前方、离射线足够近的星球里最近的那颗；都没有再看太阳
  for (const h of xrHands) {
    const hit = h.hit; hit.i = -1; hit.sun = false; hit.d = XR_RAY_LEN;
    if (!h.c.visible) continue;
    const o = h.c.position, dir = new V3(0, 0, -1).applyQuaternion(h.c.quaternion);
    for (const w of WORKS) {
      const to = w.xw.clone().sub(o), along = to.dot(dir), miss = to.clone().addScaledVector(dir, -along).length();
      if (along > 0 && miss < sizeOf(w) * XR.S * K * 1.5 && along < hit.d + (hit.i < 0 ? 9 : 0)) { hit.d = along; hit.i = w.i; }
    }
    { const to = sunW.clone().sub(o), along = to.dot(dir), miss = to.clone().addScaledVector(dir, -along).length();   // 太阳挡在前面就算太阳
      if (along > 0 && miss < SUN.r * XR.S * K && (hit.i < 0 || along < hit.d)) { hit.sun = true; hit.i = -1; hit.d = along; } }
  }
  { const a = xrHands.find(h => h.down) || xrHands.find(h => h.hit.i >= 0 || h.hit.sun);
    xrPoint = a ? a.hit.i : -1; xrSunPoint = !!a && a.hit.sun; }
  SUN.xw = sunW;
  for (const b of xrList) {
    const isW = b.i !== undefined, gz = isW && b.i === xrPoint, fz = isW && b.i === xrFocus;
    const s = { x: b.scale, v: b.sv }; spring(s, fz ? 1 : gz ? 1.25 : 1, .3, dt); b.scale = s.x; b.sv = s.v;
    b.hov += ((gz ? 1 : 0) - b.hov) * Math.min(1, dt * 10);
    b.xm.position.copy(b.xw); if (!b.sphere) b.xm.quaternion.copy(headQ); b.xm.scale.setScalar(b.r * XR.S * K * b.scale);
    const u = b.u, q = isW ? (b.planet.type === 7 ? 7 : XR.quant) : 56;
    u.uQuant.value = q; u.uPx.value = q; u.uTime.value = t; u.uHover.value = b.hov; u.uDim.value = Math.max(xrFocus >= 0 && !fz ? .55 : 0, Math.min(1, Math.max(0, (.5 - b.xw.distanceTo(headPos)) / .15)));   // 聚焦时其它星体压暗（和页面一样）；转到脸跟前的星体淡掉，不糊脸
    if (isW) {
      const ld = sunW.clone().sub(b.xw).normalize();          // 球体：世界里的太阳方向
      if (!b.sphere) ld.applyQuaternion(headInv);               // 方块（彗星）：换到「面向头」的方块坐标里
      u.uLight.value.copy(ld);
      if (b.planet.type === 7) u.uScale.value = Math.max(2.4, Math.min(8.5, 2300 / Math.max(b.dist, 1)));
      if (b.planet.bpm) u.uPulse.value = Math.pow(Math.max(0, Math.cos(t * Math.PI * 2 * b.planet.bpm / 60)), 10);
      // 拖尾：往回取一段时间里的位置
      const T = DISK.period * Math.pow(b.kepler.a / DISK.aRef, 1.5), step = T * TUNE.trail / (Math.PI * 2) / TRAIL_N;
      const arr = b.xt.geometry.attributes.position.array;
      for (let j = 0; j < TRAIL_N; j++) { const v = xrLocal(b, orbitT - j * step).v; arr[j * 3] = v.x; arr[j * 3 + 1] = v.y; arr[j * 3 + 2] = v.z; }
      b.xt.geometry.attributes.position.needsUpdate = true;
    }
  }
  { // NEXUS 的小卫星
    const m = nexus.moonBody, a = t * .5 + 1, R = nexus.r * XR.S * K * nexus.scale;
    const off = new V3(Math.cos(a) * R * 1.75, 0, Math.sin(a) * R * 1.75).applyQuaternion(xrView.Q);
    xrMoon.position.copy(nexus.xw).add(off); xrMoon.scale.setScalar(m.r * XR.S * K);
    m.u.uQuant.value = 8; m.u.uPx.value = 8; m.u.uTime.value = t; m.u.uLight.value.copy(nexus.u.uLight.value); m.u.uDim.value = nexus.u.uDim.value;
  }
  xrBelt.rotation.y += dt * .01;
  xrRing.position.copy(ringBody.xw); xrRing.scale.setScalar(ringBody.r * XR.S * K * ringBody.scale); xrRing.quaternion.copy(xrView.Q).multiply(XR_RING_Q);
  xrStars.position.copy(headPos); for (const nb of xrNebulae) nb.visible = true;   // 星空跟着头走 = 无限远
  // 名字牌
  const T = I18N[LANG];
  const up = new V3(0, 1, 0).applyQuaternion(headQ);
  if (xrPoint >= 0 && xrPoint !== xrFocus) {
    const w = WORKS[xrPoint];
    drawLabel(w[LANG].title, T.xrPick);
    xrLabel.position.copy(w.xw).addScaledVector(up, (w.planet.type === 3 ? 2.2 : 1.3) * w.r * XR.S * K * w.scale + .06);
    xrLabel.quaternion.copy(headQ); xrLabel.visible = true;
  } else xrLabel.visible = false;
  if (xrFocus >= 0) {   // 信息卡：贴在聚焦星球右边，面向头
    const w = WORKS[xrFocus], right = new V3(1, 0, 0).applyQuaternion(headQ);
    drawCard(w);
    xrCard.position.copy(w.xw).addScaledVector(right, (w.planet.type === 3 ? 2 : 1.15) * w.r * XR.S * K + .02 + XR_CARD_W / 2);
    xrCard.quaternion.copy(headQ); xrCard.visible = true;
  } else xrCard.visible = false;
  for (const h of xrHands) {   // 射线：指中东西时到它为止、变金色
    const { line, dot } = h.ray, on = h.c.visible && !xrGrabV;
    line.visible = dot.visible = on; if (!on) continue;
    const o = h.c.position, end = o.clone().addScaledVector(new V3(0, 0, -1).applyQuaternion(h.c.quaternion), h.hit.d);
    const arr = line.geometry.attributes.position.array; o.toArray(arr, 0); end.toArray(arr, 3); line.geometry.attributes.position.needsUpdate = true;
    const hot = h.hit.i >= 0 || h.hit.sun, col = hot ? '#e2b65c' : '#fff3cf';
    line.material.color.set(col); dot.material.color.set(col); line.material.opacity = hot ? .8 : .45;
    dot.position.copy(end); dot.quaternion.copy(headQ); dot.scale.setScalar(h.down ? .6 : 1);
  }
  renderer.render(xrScene, xrCam);
}

// ---------- 每帧 ----------
let last = performance.now(), t0 = last;
window.__map = { WORKS, get z() { return z; }, get mode() { return mode; }, get focused() { return focused; }, get hovered() { return hovered; }, get orbitT() { return orbitT; }, fps: [] };
const snap = (v, c) => Math.round((v - c) * z) / z + c;   // 对齐像素格，平移时不闪
function frame(now) {
  if (renderer.xr.isPresenting) { xrFrame(now); return; }
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
  const t = (now - t0) / 1000, still = reduce.matches;
  // 公转：指着或看着某颗星球时整个星系慢慢停下，方便点
  const busy = hovered >= 0 || focused >= 0 || entering >= 0;
  spring(orbitRate, busy || still ? 0 : 1, .6, dt);
  orbitT += dt * orbitRate.x;
  placeWorks();

  const tg = camTarget();
  if (!Number.isFinite(cam.x.x + cam.y.x + cam.lz.x + cam.x.v + cam.y.v + cam.lz.v)) {   // 兜底：相机状态坏了就直接落到目标
    cam.x = { x: tg.x, v: 0 }; cam.y = { x: tg.y, v: 0 }; cam.lz = { x: Math.log(tg.z), v: 0 };
  }
  if (still) { cam.x.x = tg.x; cam.y.x = tg.y; cam.lz.x = Math.log(tg.z); }
  else { spring(cam.x, tg.x, tg.t, dt); spring(cam.y, tg.y, tg.t, dt); spring(cam.lz, Math.log(tg.z), tg.t, dt); }
  z = Math.exp(cam.lz.x);
  cx = Math.round(cam.x.x * z) / z; cy = Math.round(cam.y.x * z) / z;
  camera.zoom = z; camera.position.x = cx; camera.position.y = cy; camera.updateProjectionMatrix();
  bgMat.uniforms.uCam.value.set(cx, cy); bgMat.uniforms.uZoom.value = z; bgMat.uniforms.uTime.value = t;
  orbU.uDim.value += ((focused >= 0 ? 1 : 0) - orbU.uDim.value) * Math.min(1, dt * 6);

  for (const b of [...WORKS, SUN]) {
    const isW = b.i !== undefined;
    const want = isW && (b.i === hovered || b.i === focused || b.i === entering) ? TUNE.hoverScale : 1;
    if (still) b.scale = want; else { const s = { x: b.scale, v: b.sv }; spring(s, want, .35, dt); b.scale = s.x; b.sv = s.v; }
    const hv = isW && (b.i === hovered || b.i === focused) ? 1 : 0;
    b.hov += (hv - b.hov) * Math.min(1, dt * 10);
    const dm = (focused >= 0 && b.i !== focused) || (focused < 0 && hovered >= 0 && isW && b.i !== hovered) ? (focused >= 0 ? 1 : .45) : 0;
    b.dim += (dm - b.dim) * Math.min(1, dt * 6);
    const x = snap(b.pos[0], cx), y = snap(b.pos[1], cy);
    b.dpos = [x, y];
    // 伪 3D：轨道远端（盘面 y > 0）小一点、暗一点、从太阳后面绕过去
    const far = isW ? Math.max(0, b.depth) : 0;
    // 半径对齐到整像素：否则远近缩放让星球每帧变一点点大小，表面的像素格跟着重采样，看着像在抖
    const R = Math.max(1, Math.round(b.r * b.scale * (isW ? 1 - TUNE.depthScale * b.depth : 1) * z)) / z;
    b.mesh.position.set(x, y, 0); b.mesh.scale.setScalar(R);
    b.mesh.renderOrder = isW ? (b.i === focused || b.i === hovered ? 3 : b.depth > 0 ? -2 : 2) : 0;
    const u = b.u;
    u.uTime.value = still ? 0 : t; u.uPx.value = R * z; u.uHover.value = b.hov; u.uDim.value = Math.max(b.dim, far * .35);
    const ll = Math.hypot(x, y) || 1;   // 光从太阳（原点）来
    u.uLight.value.set(-x / ll * .78, -y / ll * .78, .62).normalize();
    if (b.planet.type === 7) u.uScale.value = Math.max(2.4, Math.min(8.5, 2300 / Math.max(b.dist, 1)));   // 彗尾：越近太阳越长
    if (b.planet.bpm) u.uPulse.value = still ? 0 : Math.pow(Math.max(0, Math.cos(t * Math.PI * 2 * b.planet.bpm / 60)), 10);
    if (b.moonBody) {   // NEXUS 的小卫星：绕着转，转到后面时画在星球后面
      const m = b.moonBody, a = t * .5 + 1, ox = Math.cos(a) * R * 1.75, oy = Math.sin(a) * R * .45;
      m.mesh.position.set(snap(x + ox, cx), snap(y + oy, cy), 0); m.mesh.scale.setScalar(m.r);
      m.mesh.renderOrder = b.mesh.renderOrder + (Math.sin(a) > 0 ? -.5 : .5);
      m.u.uTime.value = t; m.u.uPx.value = m.r * z; m.u.uDim.value = u.uDim.value; m.u.uLight.value.copy(u.uLight.value);
    }
    if (isW) {   // 名字标签跟着星球
      const sx = (x - cx) * z + W / 2, sy = H / 2 - (y - cy) * z + sizeOf(b) * b.scale * z * (b.planet.type === 7 ? .45 : 1) + 3;
      b.label.style.left = sx * PXcss + 'px'; b.label.style.top = sy * PXcss + 'px';
      b.label.classList.toggle('hov', b.hov > .5);
      b.label.style.opacity = focused >= 0 || entering >= 0 ? 0 : hovered >= 0 && hovered !== b.i ? .3 : .9 - far * .35;
    }
  }
  WORKS.forEach((w, i) => orbU.uM.value[i].set(w.dpos[0], w.dpos[1], (w.planet.type === 3 ? 2.2 : w.planet.type === 7 ? 1.6 : 1.15) * w.r * w.scale * (1 - TUNE.depthScale * w.depth) + 2 / z));
  renderer.render(scene, camera);
  const f = window.__map.fps; f.push(now); while (f.length && now - f[0] > 2000) f.shift();
}
renderer.setAnimationLoop(frame);
</script>
