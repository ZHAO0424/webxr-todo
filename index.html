<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebXR 作品 · WebXR Works</title>
<meta name="description" content="四件 WebXR 作品：粒子场、NEXUS / 2086、入画、像素村落。Four WebXR works: Particle Fields, NEXUS / 2086, Into the Painting, Pixel Village.">
<style>
  :root {
    --bg: #0b0b0e; --panel: #131318; --ink: #ece7dc; --dim: #9a958c; --faint: #5d5a55;
    --line: rgba(236,231,220,.12); --gold: #c9a45c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) 16px 56px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 40px; }
  .kicker { font-size: 11px; letter-spacing: .32em; color: var(--gold); text-transform: uppercase; }
  h1 { margin: 6px 0 4px; font: 400 clamp(32px, 6vw, 52px)/1.15 Georgia, "Songti SC", "STSong", serif; letter-spacing: .04em; }
  .lede { margin: 0; color: var(--dim); max-width: 46ch; }
  #lang { font: inherit; font-size: 12px; letter-spacing: .08em; color: var(--ink); background: transparent; border: 1px solid var(--line);
          border-radius: 999px; padding: 7px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
  #lang:hover { border-color: rgba(236,231,220,.4); background: rgba(236,231,220,.05); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 20px; }
  .work { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
          text-decoration: none; transition: border-color .2s, transform .2s; }
  .work:hover { border-color: rgba(201,164,92,.55); transform: translateY(-2px); }
  .work:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .cover { aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; border-bottom: 1px solid var(--line); }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; letter-spacing: .2em; color: var(--faint); text-transform: uppercase; }
  .work h2 { margin: 0; font: 400 24px/1.3 Georgia, "Songti SC", "STSong", serif; letter-spacing: .03em; }
  .work h2 small { display: block; font: italic 14px/1.4 Georgia, "Songti SC", serif; color: var(--dim); letter-spacing: 0; margin-top: 2px; }
  .work p { margin: 0; color: #c9c3b8; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .tags span { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; line-height: 1.8; }
  footer a { color: var(--dim); }
  @media (max-width: 560px) {
    .wrap { padding-top: calc(28px + env(safe-area-inset-top, 0px)); } header { margin-bottom: 28px; }
    .meta { flex-direction: column; gap: 0; letter-spacing: .14em; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker" data-i18n="kicker">WebXR · 四件作品</div>
      <h1 data-i18n="title">伸手进去的空间</h1>
      <p class="lede" data-i18n="lede">电脑上用鼠标，头显里用手。每件作品都是一个独立的网页，点开就能看。</p>
    </div>
    <button id="lang" type="button">EN</button>
  </header>

  <main class="grid" id="works"></main>

  <footer data-i18n-html="foot"></footer>
</div>

<script>
"use strict";
// 仓库根目录：所有作品的目录页。每件作品住在自己的文件夹里，这页只负责列出来。
// 语言跟各作品共用 localStorage 键 pf-lang：在这里切一次，点进作品还是同一种语言。

const WORKS = [
  { dir: "particle-fields", cover: "covers/particle-fields.jpg",
    zh: { title: "粒子场", sub: "Particle Fields",
          blurb: "伸手搅动一团悬浮的粒子。八章轮流接管同一团粒子：旋度噪声、洛伦兹吸引子、霍普夫纤维化、叶序、克拉尼图形、密度波，然后是黑洞和极光。",
          tags: ["生成艺术", "数学", "手势"], note: "单个 HTML · 零依赖" },
    en: { title: "Particle Fields", sub: "粒子场",
          blurb: "Reach in and stir a floating cloud of particles. Eight chapters take turns driving it: curl noise, the Lorenz attractor, the Hopf fibration, phyllotaxis, Chladni figures, a density wave, then a black hole and an aurora.",
          tags: ["Generative", "Mathematics", "Hands"], note: "Single HTML · no dependencies" } },
  { dir: "jelly-harbor", cover: "covers/jelly-harbor.jpg",
    zh: { title: "NEXUS / 2086", sub: "三境圆筒沙盘",
          blurb: "工业港口、生态研究园区、废土配给站共用一个原地翻转的圆筒装置：货轮与机械臂、玻璃屋顶与双轨运输车、飞轮连杆与蒸汽动力。",
          tags: ["沙盘", "机械联动", "天气"], note: "three.js · 需联网" },
    en: { title: "NEXUS / 2086", sub: "A three-sided cylinder diorama",
          blurb: "An industrial harbour, an ecological research park and a wasteland ration station share one cylinder that flips in place: freighters and cranes, glass roofs and twin-rail carts, flywheels, linkages and steam.",
          tags: ["Diorama", "Machinery", "Weather"], note: "three.js · needs a connection" } },
  { dir: "masterpieces", cover: "covers/masterpieces.jpg",
    zh: { title: "入画", sub: "Into the Painting",
          blurb: "把凡·高、修拉、蒙克、透纳、莫奈、克里姆特、勃克林、弗里德里希的名画放进空间，九件作品各用一种算法，再配一个只属于它的交互。",
          tags: ["名画", "画廊", "视线 · 手 · 声音"], note: "九件作品 · three.js · 需联网" },
    en: { title: "Into the Painting", sub: "入画",
          blurb: "Paintings by Van Gogh, Seurat, Munch, Turner, Monet, Klimt, Böcklin and Friedrich placed in space. Nine works, each with an algorithm that suits the painting and an interaction of its own.",
          tags: ["Paintings", "Gallery", "Gaze · hands · voice"], note: "Nine works · three.js · needs a connection" } },
  { dir: "pixel-village", cover: "covers/pixel-village.jpg",
    zh: { title: "像素村落", sub: "Pixel Village",
          blurb: "太行山里的石头村，2.5D 像素风体素沙盘。28 个村民按职业和日程过日子，院门开合、天黑点灯，傍晚村口轮着唱戏、篝火、开村会。",
          tags: ["体素", "模拟", "四季"], note: "three.js · 需联网" },
    en: { title: "Pixel Village", sub: "像素村落",
          blurb: "A stone village in the Taihang Mountains, built as a 2.5D pixel-art voxel diorama. Twenty-eight villagers live out their trades and routines; gates swing, lamps come on at dusk, and evenings bring opera, a bonfire or a village meeting.",
          tags: ["Voxels", "Simulation", "Seasons"], note: "three.js · needs a connection" } },
];

const I18N = {
  zh: { kicker: "WebXR · 四件作品", title: "伸手进去的空间",
        lede: "电脑上用鼠标，头显里用手。每件作品都是一个独立的网页，点开就能看。",
        foot: "WebXR 需要 HTTPS 或 localhost；头显里用 Quest Browser 或 Chrome。每件作品的源码和说明在仓库对应的文件夹里。" +
              " · <a href=\"https://github.com/ZHAO0424/webxr-todo\">GitHub</a> · MIT",
        langBtn: "EN", docTitle: "WebXR 作品" },
  en: { kicker: "WebXR · Four works", title: "Spaces to reach into",
        lede: "Mouse on desktop, hands in a headset. Each work is a standalone web page — just open it.",
        foot: "WebXR needs HTTPS or localhost; in a headset use Quest Browser or Chrome. Source and notes for each work live in its folder in the repository." +
              " · <a href=\"https://github.com/ZHAO0424/webxr-todo\">GitHub</a> · MIT",
        langBtn: "中文", docTitle: "WebXR Works" },
};

let LANG = "";
try { LANG = localStorage.getItem("pf-lang") || ""; } catch (e) { LANG = ""; }
if (!I18N[LANG]) LANG = /^zh/i.test(navigator.language || "") ? "zh" : "en";

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const T = I18N[LANG];
  document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
  document.title = T.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = T[el.dataset.i18nHtml]; });
  document.getElementById("lang").textContent = T.langBtn;
  document.getElementById("works").innerHTML = WORKS.map(w => {
    const t = w[LANG];
    return `<a class="work" href="${w.dir}/">
      <div class="cover" style="background-image:url('${w.cover}')" role="img" aria-label="${esc(t.title)}"></div>
      <div class="body">
        <div class="meta"><span>${esc(w.dir)}/</span><span>${esc(t.note)}</span></div>
        <h2>${esc(t.title)}<small>${esc(t.sub)}</small></h2>
        <p>${esc(t.blurb)}</p>
        <div class="tags">${t.tags.map(g => `<span>${esc(g)}</span>`).join("")}</div>
      </div>
    </a>`;
  }).join("");
}

document.getElementById("lang").addEventListener("click", () => {
  LANG = LANG === "en" ? "zh" : "en";
  try { localStorage.setItem("pf-lang", LANG); } catch (e) { /* 隐私模式等：只是不记 */ }
  render();
});
render();
</script>
</body>
</html>
