             "· runtime 服务是陈旧实例 —— 设备接入只在服务启动时判定一次，\n" +
             "  眼镜是服务起来之后才插的就会报这个。杀掉服务让它重起。\n" +
             "· 眼镜没进 XR / 3D 模式，当前只是普通扩展屏。\n" +
             "· 另一个程序独占了 XR 设备。";
    }
    alert(msg);
    return;
  }

  await gl.makeXRCompatible();
  xrSession.updateRenderState({
    // 分辨率直接影响锐度。0.85 是在给自己打折 —— 取 runtime 报的原生比例
    // （1:1 对上显示面板的像素），上限 1.0 是给填充率留的余量。
    baseLayer: new XRWebGLLayer(xrSession, gl, {
      antialias: false,
      framebufferScaleFactor: Math.min(1.0, (XRWebGLLayer.getNativeFramebufferScaleFactor
                                             && XRWebGLLayer.getNativeFramebufferScaleFactor(xrSession)) || 1.0),
    }),
    depthNear: 0.02, depthFar: 200,
  });
  // 不要硬写世界坐标。3DoF / 无地面追踪的 runtime 会把 local-floor 的原点报在头的位置，
  // 于是 y=1.25 就跑到头顶一米多。改成：进去后按当前头姿把球摆在正前方。
  try { xrRefSpace = await xrSession.requestReferenceSpace("local-floor"); }
  catch { xrRefSpace = await xrSession.requestReferenceSpace("local"); }
  needPlace = true;          // 只在进入会话时摆一次；之后只认面板上的「重新摆位」按钮

  cancelAnimationFrame(rafId);
  setPanel(false);
  document.body.classList.add("xr-active");
  xrSession.addEventListener("end", () => {
    xrSession = null;
    document.body.classList.remove("xr-active");
    C[1] = 1.25; floorY = 0; prevJoint.clear();
    lastT = performance.now(); rafId = requestAnimationFrame(desktopFrame);
  });
  lastT = performance.now();
  xrSession.requestAnimationFrame(onXRFrame);
}

function updateHands(frame, dt) {
  stirW.fill(0); stirGrab.fill(0); handCount = 0; injectN = 0;
  let slot = 0;
  for (const src of frame.session.inputSources) {
    const hand = src.hand;
    if (hand) {
      const hc0 = handCount;
      // 渲染用全部关节；物理只用指尖 + 腕
      for (const joint of hand.values()) {
        if (handCount >= 60) break;
        const jp = frame.getJointPose(joint, xrRefSpace);
        if (!jp) continue;
        const p = jp.transform.position;
        handData[handCount * 4] = p.x; handData[handCount * 4 + 1] = p.y;
        handData[handCount * 4 + 2] = p.z; handData[handCount * 4 + 3] = jp.radius || 0.008;
        handCount++;
      }
      const slot0 = slot;
      let thumb = null, index = null, wrist = null, tipSum = 0, tipN = 0, fist = 0;
      for (const name of TIPS) {
        if (slot >= MAX_STIR) break;
        const j = hand.get(name);
        const jp = j && frame.getJointPose(j, xrRefSpace);
        if (!jp) continue;
        const p = jp.transform.position;
        pushStir(slot++, src.handedness + name, p.x, p.y, p.z, dt);
        if (name === "thumb-tip") thumb = p;
        if (name === "index-finger-tip") index = p;
        if (name === "wrist") wrist = p;
      }
      // 握拳检测：指尖到腕的平均距离，用这只手自己的尺度归一化（手有大小之分）。
      // 张开 ≈ 2.2 倍掌骨长，握紧 ≈ 1.1 倍。不依赖 runtime 是否支持 squeeze 手势。
      if (wrist) {
        for (const name of TIPS) {
          if (name === "wrist") continue;
          const j = hand.get(name);
          const jp = j && frame.getJointPose(j, xrRefSpace);
          if (!jp) continue;
          const p = jp.transform.position;
          tipSum += Math.hypot(p.x - wrist.x, p.y - wrist.y, p.z - wrist.z); tipN++;
        }
        const mc = hand.get("middle-finger-metacarpal");
        const mcp = mc && frame.getJointPose(mc, xrRefSpace);
        const scale = mcp
          ? Math.hypot(mcp.transform.position.x - wrist.x,
                       mcp.transform.position.y - wrist.y,
                       mcp.transform.position.z - wrist.z)
          : 0.075;
        if (tipN && scale > 0.02) {
          const ratio = (tipSum / tipN) / scale;
          fist = 1.0 - smooth01(ratio, 1.35, 1.95);        // 1 = 攥紧, 0 = 张开
          for (let k = slot0; k < slot; k++) stirGrab[k] = fist;
          if (fist > 0.5) for (let k = hc0; k < handCount; k++)  // 攥紧的手画亮一点
            if (handData[k * 4 + 3] > 0) handData[k * 4 + 3] = -handData[k * 4 + 3];
        }
      }

      // 捏合注入。必须排在握拳之后并把握拳排除掉 —— 攥拳时拇指和食指本来就贴在一起，
      // 不排除的话一握拳就在疯狂注入粒子。
      if (thumb && index && fist < 0.35 && injectN < 2) {
        const d = Math.hypot(thumb.x - index.x, thumb.y - index.y, thumb.z - index.z);
        if (d < 0.028) {
          injectPos[injectN * 3]     = (thumb.x + index.x) / 2;
          injectPos[injectN * 3 + 1] = (thumb.y + index.y) / 2;
          injectPos[injectN * 3 + 2] = (thumb.z + index.z) / 2;
          injectN++;
        }
      }
    } else if (src.gripSpace && slot < MAX_STIR) {           // 手柄兜底
      const gp = frame.getPose(src.gripSpace, xrRefSpace);
      if (gp) {
        const p = gp.transform.position;
        pushStir(slot++, src.handedness + "grip", p.x, p.y, p.z, dt);
        if (handCount < 60) {
          handData[handCount * 4] = p.x; handData[handCount * 4 + 1] = p.y;
          handData[handCount * 4 + 2] = p.z; handData[handCount * 4 + 3] = 0.02; handCount++;
        }
        const gamepad = src.gamepad;
        if (gamepad && gamepad.buttons[0] && gamepad.buttons[0].pressed && injectN < 2) {
          injectPos[injectN * 3] = p.x; injectPos[injectN * 3 + 1] = p.y; injectPos[injectN * 3 + 2] = p.z;
          injectN++;
        }
      }
    }
  }
  if (slot === 0) { idleT += dt; if (idleT > 6) autoStir(dt); }
  else { idleT = 0; autoActive = false; prevJoint.delete("auto"); }
}

const onXRFrame = guardFrame(function (t, frame) {
  xrSession.requestAnimationFrame(onXRFrame);
  const dt = Math.max(0, Math.min((t - lastT) / 1000 || 0.011, 0.05));
  lastT = t;
  tickStats(dt);

  const pose = frame.getViewerPose(xrRefSpace);
  if (!pose) return;

  // 把球摆到头正前方 0.55m。只在进入会话时做一次，或按面板上的「重新摆位」。
  // 不绑任何手势 —— 之前绑了 squeeze，而 runtime 对握拳也发 squeeze，于是吸附时球会突然重置。
  const hm = pose.transform.matrix;
  if (needPlace) {
    needPlace = false;
    C[0] = hm[12] - hm[8] * 0.55;    // 头矩阵第三列取负 = 视线正前方
    C[1] = hm[13] - hm[9] * 0.55;
    C[2] = hm[14] - hm[10] * 0.55;
    floorY = C[1] - 1.1;
    if (ST.ride) {
      // 隧道的原点是头本身（要穿过去，不是看着它），朝向取当前视线的水平投影
      C[0] = hm[12]; C[1] = hm[13]; C[2] = hm[14];
      setRideAxis(Math.atan2(hm[8], hm[10]));
      initRide();
    }
    initParticles(P.count);          // 粒子是绕旧中心播的，得重播
  }

  updateAuto(dt);
  updateHands(frame, dt);
  updateRide(dt);
  simulate(dt);                                   // 与视角无关，双眼只跑一次

  const layer = xrSession.renderState.baseLayer;
  ensureHDR(layer.framebufferWidth, layer.framebufferHeight);
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdrFbo);
  gl.viewport(0, 0, hdrW, hdrH);
  gl.clearColor(0, 0, 0, 1); gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const rects = [];
  for (const view of pose.views) {
    const vp = layer.getViewport(view);
    gl.viewport(vp.x, vp.y, vp.width, vp.height);
    const m = view.transform.matrix;              // 视图矩阵的逆 = 相机位置
    drawScene(view.projectionMatrix, view.transform.inverse.matrix, [m[12], m[13], m[14]], vp.height);
    rects.push([vp.x, vp.y, vp.width, vp.height]);
  }
  postProcess(layer.framebuffer, rects);
});

// ── UI ───────────────────────────────────────────────────────────────────────

function tickStats(dt) {
  frames++; fpsAcc += dt;
  if (fpsAcc > 0.5) { fps = frames / fpsAcc; frames = 0; fpsAcc = 0; }
}
const statEl = document.getElementById("stat");
setInterval(() => {
  if (!statEl) return;
  statEl.textContent = `${fps.toFixed(0)} fps · ${(N / 1000).toFixed(0)}k 粒子 × ${Math.round(P.tail)} 段 = ${((N * P.tail) / 1000).toFixed(0)}k 点`;
}, 400);

const bind = (id, key, fmt) => {
  const el = document.getElementById("p_" + id), out = document.getElementById("v_" + id);
  if (!el) return;
  const sync = () => { P[key] = parseFloat(el.value); if (out) out.textContent = fmt ? fmt(P[key]) : P[key].toFixed(2); };
  el.addEventListener("input", sync); sync();
};
bind("exposure", "exposure"); bind("bloom", "bloom"); bind("bloomR", "bloomR");
bind("sharp", "sharp");
bind("attract", "attract");
bind("stir", "stir"); bind("srad", "srad", v => v.toFixed(3) + "m"); bind("damp", "damp");
bind("turb", "turb"); bind("size", "size", v => (v * 1000).toFixed(0) + "mm");
bind("op", "op"); bind("tail", "tail", v => v.toFixed(0)); bind("dry", "dry");
bind("rad", "radius", v => (v * 100).toFixed(0) + "cm");
bind("speed", "speed", v => v.toFixed(1) + "m/s");

document.getElementById("p_count").addEventListener("change", e => {
  P.count = parseInt(e.target.value, 10); initParticles(P.count);
});

// 切风格：把预设灌进 P，并把滑块拨到对应位置（之后仍可手调）
function syncSliders() {
  for (const k of LERP_KEYS) {
    const el = document.getElementById("p_" + k);
    if (el) { el.value = P[k]; el.dispatchEvent(new Event("input")); }
  }
}
function applyStyle(name) {
  P.style = name;
  ST = (name === "auto") ? AUTO : STYLES[name];
  if (name !== "auto") {
    for (const k of LERP_KEYS) {
      if (ST[k] === undefined) continue;
      P[k] = ST[k];
    }
    syncSliders();
  }
  if (name === "tunnel") { initRide(); initParticles(P.count); }
  // 换形态要重新摆位：隧道的原点是头本身（要穿过去），其它形态是头前方 0.55 米
  if (xrSession) needPlace = true;
  document.documentElement.toggleAttribute("data-dark", !!ST.dark);
  document.documentElement.style.background = ST.dark ? "#05070C" : "#EFE9DC";
  document.body.style.background = ST.dark ? "#05070C" : "#EFE9DC";
  document.body.style.color = ST.dark ? "#C8D4E4" : "#2B2118";
  document.getElementById("title").textContent = (ST.label || "自动渐变").replace(/（.*$/, "");
}
document.getElementById("p_style").addEventListener("change", e => applyStyle(e.target.value));
function setPanel(open) {
  document.getElementById("panel").classList.toggle("open", open);
  document.getElementById("ui").classList.toggle("shift", open);
}
document.getElementById("toggle").addEventListener("click", () =>
  setPanel(!document.getElementById("panel").classList.contains("open")));
document.getElementById("close").addEventListener("click", () => setPanel(false));
document.getElementById("exit").addEventListener("click", () => {
  if (xrSession) xrSession.end();
});
document.getElementById("recenter").addEventListener("click", () => { needPlace = true; });
canvas.addEventListener("pointerdown", () => setPanel(false));   // 点画布也关
document.getElementById("reset").addEventListener("click", () => initParticles(P.count));
window.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") initParticles(P.count);
  if (e.key === "h" || e.key === "H") setPanel(!document.getElementById("panel").classList.contains("open"));
  if (e.key === "Escape") setPanel(false);
});

const xrBtn = document.getElementById("xr");
if (navigator.xr) {
  navigator.xr.isSessionSupported("immersive-vr").then(ok => {
    xrBtn.disabled = !ok;
    xrBtn.textContent = ok ? "进入 VR" : "此设备无 VR";
    if (ok) xrBtn.addEventListener("click", enterXR);
  }).catch(() => { xrBtn.textContent = "此设备无 VR"; });
} else xrBtn.textContent = "浏览器无 WebXR";

// ── 启动 ─────────────────────────────────────────────────────────────────────
if (OK) {
  applyStyle(P.style);
  initParticles(P.count);
  lastT = performance.now();
  rafId = requestAnimationFrame(desktopFrame);
}
</script>
</body>
</html>
