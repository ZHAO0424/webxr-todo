<script type="module">

const V3 = THREE.Vector3, clamp = THREE.MathUtils.clamp, TAU = Math.PI * 2;
const QS = new URLSearchParams(location.search);
// 发光物的混合（同节拍门 / 萤群）：颜色相加；alpha 取亮度，Liquid 投屏按 alpha 叠图时暗的光晕外圈不会盖出黑边
const AR_GLOW = {
  blending: THREE.CustomBlending, premultipliedAlpha: true,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  onBeforeCompile: s => { s.fragmentShader = s.fragmentShader.replace(/\}\s*$/, 'gl_FragColor.a = max(gl_FragColor.r, max(gl_FragColor.g, gl_FragColor.b));\n}'); },
};

// ---------- 双语 ----------
const STR = {
  zh: {
    ctl: '电脑：鼠标左键 / F = 左手，右键 / J = 右手，跟着下方滑来的鼓面交替敲；空格 = 夺标',
    name: '龙舟鼓手', alt: 'DRAGON BOAT DRUMMER', tag: '桌上一段描金的河，四条龙舟竞渡。你是船头的鼓手：手往下一敲，二十支桨跟着你入水。',
    how: ['手在空中往下敲：一下就是一记鼓点；捏合手指也算敲一下（敲不准时用它保底）', '敲得稳，桨就齐、船就快；乱敲桨就乱；停下，桨手举桨等你', '起航敲快些（约 100），中段稳住（约 80），最后冲刺（约 105）', '左右手交替敲最快；一直用同一只手，船只出一半多的力', '双手同时落下 = 重鼓', '领先过线：捏合举起标旗', '电脑：F / ← 左手，J / → 右手，鼠标左键 / 右键 = 左 / 右手；R 重新摆放'],
    credit: '声音全部实时合成 · three.js', start: '往下敲两下  开始', startPc: '敲两下 / 点击 开始',
    seg: { start: '起航', cruise: '巡航', sprint: '冲刺' }, rank: n => `第 ${n} 名`, bpm: '鼓', sync: '齐',
    judge: { steady: '稳', ok: '可', off: '乱', perfect: '完美', good: '好', fast: '太快', slow: '慢了' }, guide: '跟着闪的鼓敲', ready: ['三', '二', '一'], go: '起！',
    result: '终点', time: '用时', avgSync: '平均整齐', steadyPct: '稳拍', streak: '最长连稳', again: '敲两下 / 捏合 再来一局',
    win: '夺 冠', places: ['夺 冠', '第 二', '第 三', '第 四'], grab: '捏合 举标', grabPc: '点击 / 空格 举标', grabbed: '夺标！',
    names: ['你', '稳', '猛', '后发'], altHint: '左右交替！', same: '换手', mute: '关声音', unmute: '开声音', lang: 'EN', handHint: '手抬高一点',
  },
  en: {
    ctl: 'PC: left click / F = left hand, right click / J = right hand; alternate on the drum notes below; Space = take the flag',
    name: 'DRAGON BOAT DRUMMER', alt: '龙舟鼓手', tag: 'A gold-lined river on your desk, four dragon boats racing. You are the drummer: strike down in the air and twenty paddles dig in on your beat.',
    how: ['Strike down in the air: each strike is a drum beat; a pinch also counts as one beat (fallback when strikes are not detected)', 'Steady beats line the paddles up and the boat flies; erratic beats scatter them; stop and the crew waits for you', 'Start fast (~100), hold steady mid-race (~80), sprint at the end (~105)', 'Alternate left and right for top speed; one hand alone gives barely half the power', 'Both hands at once = a heavy beat', 'Cross first: pinch to raise the flag', 'Desktop: F / ← left hand, J / → right hand, left / right mouse button = left / right; R to re-place'],
    credit: 'All sound synthesized live · three.js', start: 'STRIKE TWICE TO START', startPc: 'STRIKE TWICE / CLICK TO START',
    seg: { start: 'START', cruise: 'CRUISE', sprint: 'SPRINT' }, rank: n => ['1st', '2nd', '3rd', '4th'][n - 1], bpm: 'BPM', sync: 'SYNC',
    judge: { steady: 'STEADY', ok: 'OK', off: 'OFF', perfect: 'PERFECT', good: 'GOOD', fast: 'TOO FAST', slow: 'TOO SLOW' }, guide: 'Hit with the flashing drum', ready: ['3', '2', '1'], go: 'GO!',
    result: 'FINISH', time: 'Time', avgSync: 'Avg sync', steadyPct: 'Steady', streak: 'Best streak', again: 'STRIKE TWICE / PINCH TO RACE AGAIN',
    win: 'CHAMPION', places: ['CHAMPION', '2ND', '3RD', '4TH'], grab: 'PINCH TO RAISE THE FLAG', grabPc: 'CLICK / SPACE TO RAISE THE FLAG', grabbed: 'FLAG TAKEN!',
    names: ['YOU', 'STEADY', 'BURST', 'CLOSER'], altHint: 'ALTERNATE L / R!', same: 'SWITCH', mute: 'Sound off', unmute: 'Sound on', lang: '中文', handHint: 'Raise your hands a little',
  },
};
let lang = 'zh';
try { lang = localStorage.getItem('dragon-lang') || (/^zh/i.test(navigator.language) ? 'zh' : 'en'); } catch (e) { lang = /^zh/i.test(navigator.language) ? 'zh' : 'en'; }
const S = () => STR[lang];
const FONT = () => lang === 'zh' ? '"STKaiti","KaiTi","Kaiti SC","Songti SC",serif' : '"Georgia","Times New Roman",serif';
let muted = false;
try { muted = localStorage.getItem('dragon-mute') === '1'; } catch (e) { }
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('t-name').textContent = S().name;
  document.getElementById('t-alt').textContent = S().alt;
  document.getElementById('t-tag').textContent = S().tag;
  document.getElementById('t-how').innerHTML = S().how.map(s => `<li>${s}</li>`).join('');
  document.getElementById('t-ctl').textContent = S().ctl;
  document.getElementById('t-credit').textContent = S().credit;
  document.getElementById('lang').textContent = S().lang;
  document.getElementById('mute').textContent = muted ? S().unmute : S().mute;
  makeWordTextures(); panelDirty = hudDirty = true;
}

// ---------- 渲染 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.info.autoReset = false;   // 每帧开头手动清零，后处理多遍渲染也能数全
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
mirrorThree(renderer);
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050302);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 20);
const world = new THREE.Group(); scene.add(world);
// 沙盘：视点前 0.55 m、低 0.28 m；宽 40 cm（x 沿河道，y 向上，z 朝观者）
const DIO = new V3(0, -0.32, -0.52);   // 俯角约 32°：车道在视线里分得开（审查 #2-7）
const dio = new THREE.Group(); dio.position.copy(DIO); world.add(dio);
const WX = 0.2, SCALE = 0.01;                    // 窗口半宽（米）；1 游戏米 = 1 cm
const LANE_Z = [0.078, 0.026, -0.026, -0.078];   // 你的船离观者最近；间距 48 mm > 船宽 + 桨展（审查 #1：桨不能伸进隔壁车道）
const RIVER_Z = 0.088, FAR_Z = -0.1, NEAR_Z = 0.1;

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------- 画面：笔墨描金（见 art.js） ----------
const GAIN = { value: 1 };
const art = createArt(THREE, AR_GLOW, dio, GAIN);
const C = art.C;
// 3D 层：船、人、堤、亭、牌坊、柳、灯笼、水面（卡通着色 + 描金描边）
const w3d = createWorld3D(dio, { laneZ: LANE_Z, raceLen: 200, AR_GLOW, onSplash: (x, z, i) => art.splash(x, z, i) });
// 主角船：Tripo 生成的整条龙舟（vermilion 漆 + 金鳞 + 龙头龙尾 + 鼓），套卡通着色 + 描金；加载失败就保留程序船
w3d.loadHeroHead('assets/models/hero-boat.glb', { replaceBody: true, rot: [0, Math.PI / 2, 0], len: 96, at: [7, -4.6, 0], squash: [1, 0.7, 0.55] }).then(info => { heroModelInfo = info; document.body.dataset.hero = JSON.stringify(info); }).catch(e => { console.warn('hero model', e); heroModelInfo = { error: String(e) }; document.body.dataset.hero = JSON.stringify(heroModelInfo); });
let heroModelInfo = null;
// 对手三条船：同样是 Tripo 生成（青银 / 翠金 / 紫银），压扁到同一船宽；紫船的龙头朝 -Z，要反过来转
const OPP_MODELS = [
  [1, 'assets/models/opp-blue.glb', { rot: [0, Math.PI / 2, 0], squash: [1, 0.6, 0.63] }],
  [2, 'assets/models/opp-green.glb', { rot: [0, Math.PI / 2, 0], squash: [1, 0.66, 0.75] }],
  [3, 'assets/models/opp-purple.glb', { rot: [0, -Math.PI / 2, 0], squash: [1, 0.66, 0.75] }],
];
for (const [i, url, o] of OPP_MODELS) w3d.loadBoatModel(i, url, { replaceBody: true, len: 96, at: [7, -4.6, 0], ...o }).catch(e => console.warn('opp model', i, e));

// ---------- 场景状态（画面每帧从这里取） ----------
const race = new Race(20261113 + Math.floor(Math.random() * 1000));
let cx = -3, wave = { x: -9, t: 9 }, excite = 0.3, flagGrab = null, archReveal = 0, roarT = -9;
const toX = m => (m - cx) * SCALE;
const lastHand = [{ t: -9 }, { t: -9 }];   // 你的鼓手左右手上一次落槌
// 鼓点反馈：墨花。头显里画在手落下的地方（大）；桌面上没有手，画在你船上的鼓面（小）
function ripple(worldP, judge) {
  const p = dio.worldToLocal(worldP.clone()), xr = renderer.xr.isPresenting;
  const col = judge === 'steady' ? C.goldHi : judge === 'ok' ? C.gold : judge === 'off' ? C.dim : C.verm;
  if (xr) art.inkBloom(p.x, p.y, p.z, col, 1, judge === 'heavy');
  // 你船上的鼓面：每一下都炸一圈金环（头显里和手上的墨花呼应）
  if (race.state === 'race' || race.state === 'finish') { w3d.hitSpray(0); syncFlare = now(); art.waterRing(toX(race.you.pos) - 36 * 0.00135 + 25.5 * 0.00135, LANE_Z[0], col, judge === 'off', judge === 'steady' || judge === 'heavy' ? 1 : judge === 'ok' ? 0.7 : 0.85); const S = 0.00135; art.drumPulse(toX(race.you.pos) - 36 * S + 25.5 * S, 9.4 * S + 0.0008, LANE_Z[0], col, judge === 'heavy', judge === 'off'); }   // 水面金环从鼓的位置发出（审查 #8-3）
}

// 判定字：小块画布贴图
// 太鼓式判定字：完美 / 好 / 太快 / 慢了 / 乱 / 换手（眼镜里黑 = 透明，颜色都要亮）
const WORDS = ['steady', 'ok', 'off', 'grabbed', 'same', 'perfect', 'good', 'fast', 'slow'], wordTex = {};
const WORD_COL = { steady: '#ffe6a0', ok: '#e8c27a', off: '#c0a8e0', grabbed: '#ff7a50', same: '#ff8a60', perfect: '#fff0a0', good: '#ffd27a', fast: '#ff6a40', slow: '#80d8ff' };
function makeWordTextures() {
  for (const w of WORDS) {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 96;
    const g = cv.getContext('2d'), txt = w === 'grabbed' ? S().grabbed : w === 'same' ? S().same : S().judge[w];
    g.font = `${lang === 'zh' ? 400 : 700} ${lang === 'zh' ? 64 : (txt.length > 6 ? 34 : 40)}px ${FONT()}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = WORD_COL[w]; g.shadowBlur = 18; g.fillStyle = WORD_COL[w]; g.fillText(txt, 128, 50);
    if (w === 'perfect') { g.shadowBlur = 0; g.lineWidth = 1.5; g.strokeStyle = '#ffffff'; g.strokeText(txt, 128, 50); }
    if (wordTex[w]) wordTex[w].dispose();
    wordTex[w] = new THREE.CanvasTexture(cv); wordTex[w].colorSpace = THREE.SRGBColorSpace;
  }
  for (const s of words) { s.m.material.map = wordTex[s.w] || null; s.m.material.needsUpdate = true; }
}
const words = Array.from({ length: 8 }, () => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.019), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, depthTest: false }));   // 用户 11-16：眼镜里看不见 → 改成和 HUD 一样的普通混合、最后画
  m.visible = false; m.renderOrder = 997; world.add(m); return { m, t: 9, w: 'ok' };
});
let wordI = 0;
function word(w, worldP, big = 1) {
  const s = words[wordI++ % words.length];
  s.w = w; s.t = 0; s.big = big; s.m.material.map = wordTex[w]; s.m.material.needsUpdate = true;
  s.m.position.copy(worldP).add(new V3(0, 0.025, 0)); s.m.lookAt(headLocal()); s.m.visible = true;
}

// 判定：换手 > 太快 / 慢了（相对本段节奏带，用最近 4 拍的中位数，不会一下一闪）> 完美 / 好 / 乱
function hitWord(j) {
  const y = race.you;
  if (j.judge === 'set') return null;
  if (!j.alt && y.hits > 2) return 'same';
  const band = SEGS[segAt(y.pos)].band, bpm = y.tempo.bpm();
  if (bpm > band[1] + 4) return 'fast';
  if (bpm < band[0] - 4) return 'slow';
  const nn = nearestNote(now()), d = laneOffset(now());   // 和轨道上最近音符的时间差（负 = 抢拍）
  if (nn && nn.hand !== 2 && lastPlayerHit && nn.hand !== lastPlayerHit.hand && Math.abs(d) < 0.2) return 'same';   // 谱面要另一只手
  return Math.abs(d) <= 0.07 ? 'perfect' : Math.abs(d) <= 0.14 ? 'good' : d < 0 ? 'fast' : 'slow';
}
const drumLocal = () => new V3(toX(race.you.pos) - 36 * 0.00135 + 25.5 * 0.00135, 0.012, LANE_Z[0]).add(DIO);
// 节拍引导：按本段的建议节奏（起航 100 / 巡航 82 / 冲刺 105）左右交替"闪"一面鼓；你敲得准时引导会向你的拍子对齐
const GUIDE_BPM = pos => pos < 25 ? 100 : pos > RACE_LEN - 50 ? 105 : 82;
let guideT = 0, guideHand = 0, guideFlash = -9, musDone = false;
function guideStep(t) {
  if (race.state !== 'race') { guideT = t; return; }
  const iv = 60 / GUIDE_BPM(race.you.pos);
  if (t - guideT > iv) { guideT = t; musDone = false; }   // 落后太多（刚开赛 / 卡顿）：从现在起拍
  // 配乐提前约 0.1 s 按音频时钟排好这一拍（帧抖动不影响节奏）
  if (AC && !musDone && guideT - t < 0.1) {
    musDone = true;   // 每拍只排一次（之后你的鼓点把引导拍挪一点点也不重排）
    const band = SEGS[segAt(race.you.pos)].band, bpm = race.you.tempo.bpm(), lost = race.you.tempo.waiting(t) || bpm > band[1] + 4 || bpm < band[0] - 4;
    musicBeat(AC.currentTime + Math.max(0, guideT - t), iv, segAt(race.you.pos), lost && race.you.hits > 2);
  }
  if (t >= guideT) { guideT += iv; guideN++; musDone = false; guideHand ^= 1; guideFlash = t; hudDirty = true; hudT = 0; }
  // 换段：从下一小节起按新赛段的难度出谱（已经生成、还没开始的小节丢掉重出）
  const seg = segAt(race.you.pos); if (seg !== lastSeg) { lastSeg = seg; const nb = Math.floor(guideN / 4) + 1; chart.length = Math.min(chart.length, nb); chartSegStart = nb; }
}
function guideNudge(t) {
  const iv = 60 / GUIDE_BPM(race.you.pos), prev = guideT - iv, d = Math.abs(t - prev) < Math.abs(t - guideT) ? t - prev : t - guideT;
  if (Math.abs(d) < iv * 0.3) guideT += d * 0.3;
}

// ---------- 打击轨道（太鼓式，用户 11-16）：河道下方 / 靠近你的一条描金漆条 ----------
// 音符 = 引导节拍（本段建议节奏），左右手交替上色（左朱、右青）；滑到左端判定圈时敲。敲中的音符炸成金环，判定字在圈上方弹出
// 画布 1536 px：中间 1024 px 是主体（判定圈 + 音符区，和之前一样大），左右各 256 px 是渐隐的描金尾巴（用户 11-16：轨道长一点）
const LANE_PAD = 256, LANE_MAIN = 1024, LANE_W = LANE_MAIN + 2 * LANE_PAD, LANE_H = 192, LANE_HIT = LANE_PAD + 132, LANE_PX = 360;   // 判定圈 x、每秒滑多少像素（约 2.5 s 预告）
const lane = canvasPanel(LANE_W, LANE_H, 0.45, 0.05625);
lane.m.material = new THREE.MeshBasicMaterial({ map: lane.tx, transparent: true, depthWrite: false, depthTest: false }); lane.m.renderOrder = 998;
let laneDone = [], lanePop = null;
// 谱面（用户 11-16：左右手节奏像音游一样复杂多变）：每小节 4 拍，从节奏型库里按赛段随机挑一个；
// 音符的手按"上一个音符的另一只手"自动分配（交替），双击 = 两手同落（重鼓）。拍上的音符驱动划桨节奏，拍间的八分音符是花点
// 节奏型：[拍内位置, 是否双击]
const RHYTHMS = {
  basic: [[0], [1], [2], [3]],
  accent: [[0, 1], [1], [2], [3]],
  eighth3: [[0], [1], [2], [2.5], [3]],
  eighth1: [[0], [0.5], [1], [2], [3]],
  swing: [[0], [1], [1.5], [2], [3], [3.5]],
  rest: [[0], [1], [2]],
  big: [[0, 1], [2, 1]],
  roll: [[0], [0.5], [1], [1.5], [2], [3]],
};
const RHYTHM_POOL = {
  start: ['basic', 'basic', 'accent', 'eighth3', 'rest'],
  cruise: ['basic', 'eighth3', 'eighth1', 'rest', 'big', 'accent'],

  if (k === 'Space' || k === 'KeyF' || k === 'KeyJ' || k === 'ArrowLeft' || k === 'ArrowRight') {
    e.preventDefault();
    if (flagGrab && flagGrab.stage === 'wait' && k === 'Space') { initAudio(); grabFlag(); return; }
    // 空格分不出左右：鼓手动作轮换，但算"同一只手"（交替要用 F / J 或方向键）
    const hand = k === 'KeyF' || k === 'ArrowLeft' ? 0 : k === 'KeyJ' || k === 'ArrowRight' ? 1 : (deskHand ^= 1);
    playerHit(e.timeStamp / 1000, hand, 0.6, deskPoint(hand), k === 'Space' ? -1 : hand);
  }
  if (k === 'KeyR' && renderer.xr.isPresenting) needPlace = true;
});
document.getElementById('lang').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; try { localStorage.setItem('dragon-lang', lang); } catch (e) { } applyLang(); };
document.getElementById('mute').onclick = () => {
  muted = !muted; try { localStorage.setItem('dragon-mute', muted ? '1' : '0'); } catch (e) { }
  initAudio(); OUT.gain.setTargetAtTime(muted ? 0 : 0.9, AC.currentTime, 0.05); applyLang();
};

// ---------- XR 摆放（同节拍门 / 萤群）----------
let needPlace = false, placeWait = 0, bothT = 0;
const BG = scene.background;
renderer.xr.addEventListener('sessionstart', () => { w3d.setXR(true); art.setWidth(0.5); needPlace = true; placeWait = 0; xrNow = true; scene.background = null; renderer.setClearColor(0x000000, 0); GAIN.value = 1.25; panelDirty = true; document.getElementById('card').style.opacity = 0; document.getElementById('btns').style.opacity = 0; });
renderer.xr.addEventListener('sessionend', () => { w3d.setXR(false); art.setWidth(0.2); xrNow = false; world.position.set(0, 0, 0); world.rotation.set(0, 0, 0); scene.background = BG; renderer.setClearColor(0x000000, 1); GAIN.value = 1; palm[0] = palm[1] = null; panelDirty = true; document.getElementById('card').style.opacity = 1; document.getElementById('btns').style.opacity = 1; onResize(); });
function place() {
  const cam = renderer.xr.getCamera(), p = new V3().setFromMatrixPosition(cam.matrixWorld);
  const d = new V3(0, 0, -1).transformDirection(cam.matrixWorld);
  world.position.copy(p); world.rotation.set(0, Math.atan2(-d.x, -d.z), 0); needPlace = false;
  detectors.forEach(d => d.reset());
}

// ---------- 桌面后处理（眼镜里不跑；发光已做进材质） ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.25, 0.3, 0.82);
composer.addPass(bloom); composer.addPass(new OutputPass());
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 56 : 33;   // 两头石墩都收进画面（11-16 试过按宽度放大，用户觉得河变短了，已退回）
  if (innerWidth > 900) camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.06, 0, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize); onResize();

// ---------- 主循环 ----------
applyLang();
// 测量：每帧更新 + 提交渲染的 CPU 用时，环形缓冲
const perfBuf = new Float32Array(300); let perfI = 0, perfN = 0;
const artBuf = new Float32Array(300); let artI = 0;   // 只算画面组装（JS），不含 GPU
function perf() { const a = Array.from(perfBuf.slice(0, perfN)).sort((x, y) => x - y); return { n: perfN, mean: a.reduce((s, v) => s + v, 0) / Math.max(1, a.length), p95: a[Math.floor(a.length * 0.95)] || 0, ...art.counts, artMs: (() => { const a = Array.from(artBuf.slice(0, Math.min(artI, 300))).sort((x, y) => x - y); return { mean: +(a.reduce((s, v) => s + v, 0) / Math.max(1, a.length)).toFixed(2), p95: a[Math.floor(a.length * 0.95)] || 0 }; })(), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; }
// 自动鼓手（测试用 ?auto）：按节奏带 + 4% 抖动敲
const FF = +(QS.get('ff') || 0), AUTO = QS.has('auto') || FF > 0;
if (QS.has('wide')) { w3d.setWidth(0.5); art.setWidth(0.5); }   // 桌面预览头显里的加长河道
let autoNext = 0;
function autoDrum(t) {
  if (race.state === 'title') { if (t > 0.8 && !QS.has('title')) startRace(t); return; }
  if (race.state === 'result') return;
  if (race.state !== 'race' && race.state !== 'finish') return;
  if (flagGrab && flagGrab.stage === 'wait') { grabFlag(); return; }
  if (t < autoNext) return;
  const p = race.you.pos, bpm = p < 25 ? 100 : p > RACE_LEN - 50 ? 105 : 82;
  playerHit(t, race.you.hits % 2, 0.6, deskPoint(race.you.hits % 2));
  autoNext = t + 60 / bpm * (1 + (Math.random() - 0.5) * 0.08);
}
let simT = 0, lastReal = performance.now();
function frame(time, xrFrame) {
  const t0 = performance.now();
  renderer.info.reset();
  const realDt = Math.min(1 / 20, (t0 - lastReal) / 1000); lastReal = t0;
  const dt = Math.min(1 / 30, realDt);
  const xr = renderer.xr.isPresenting;
  const t = clockT = AUTO ? (simT += dt) : t0 / 1000;
  if (needPlace && xr && ++placeWait > 5) place();
  if (!xr) { camera.position.set(0, 0, 0); camera.lookAt(0, DIO.y + 0.045, DIO.z); }
  world.updateMatrixWorld(true);
  if (xr) xrControl(t, dt); else palm[0] = palm[1] = null;
  if (AUTO) autoDrum(t);
  guideStep(now());
  update(t, dt);
  draw(t, dt);
  hudT -= dt;
  if (hudDirty && hudT <= 0) { drawHud(); hudDirty = false; hudT = now() - syncFlare < 0.3 || now() - guideFlash < 0.3 ? 0.03 : 0.12; }
  if ((race.state === 'race' || race.state === 'finish') && hudT <= 0) hudDirty = true;
  const showPanel = race.state === 'title' || race.state === 'ready' || race.state === 'result' || (race.state === 'race' && t - goT < 0.9) || (flagGrab && flagGrab.stage === 'wait');
  if (showPanel) drawPanel(t);
  panel.m.visible = !!showPanel;
  hud.m.visible = race.state === 'race' || race.state === 'finish';
  const halfH = xr ? (((renderer.xr.getCamera().cameras[0] || {}).viewport || { w: 1200 }).w / 2) : renderer.domElement.height / 2;
  art.setScale(halfH);
  if (xr) renderer.render(scene, camera); else composer.render();
  perfBuf[perfI] = performance.now() - t0; perfI = (perfI + 1) % perfBuf.length; perfN = Math.min(perfN + 1, perfBuf.length);
  // ?probe：跑 12 帧后把结果写进 DOM，给无头检查读
}
// ?probe：快进之后同步画 30 帧，把结果写进 DOM 给无头检查读（无头 Chrome 的 rAF 不可靠）
const PROBE = QS.has('probe');
function probe() {
  for (let i = 0; i < 30; i++) { lastReal = performance.now() - 1000 / 60; frame(); }
  document.body.dataset.result = JSON.stringify({ chart: chart.map(b => b.map(n => n.off + (n.hand === 2 ? 'B' : n.hand ? 'R' : 'L')).join(' ')), music: musPick, hero: heroModelInfo, w3d: w3d.dbg(), errors: window.__errs, state: race.state, stats: race.stats(), ...art.counts, perf: perf() });
}
// ?ff=N：开局后先用逻辑快进 N 秒（截图 / 测试用，不画）
if (FF > 0) {
  startRace(0); simT = 0; let tt = 0;
  while (tt < FF - 1.2) { tt += 1 / 60; simT = clockT = tt; autoDrum(tt); guideStep(tt); update(tt, 1 / 60); }   // guideStep：快进时谱面 / 引导拍也跟着走
  art.clearFx();
  // 最后 1.2 秒逐帧走画面，让瞬时特效（鼓环、水花、烟花）按真实时长出现
  while (tt < FF) { tt += 1 / 60; simT = clockT = tt; autoDrum(tt); guideStep(tt); update(tt, 1 / 60); draw(tt, 1 / 60); }
}
if (PROBE) probe();
renderer.setAnimationLoop(frame);
// 测试用
window.__dragon = {
  chart: () => chart.map(b => b.map(n => n.off + (n.hand === 2 ? 'B' : n.hand ? 'R' : 'L')).join(' ')), music: () => ({ ...musPick }),
  race, get state() { return race.state; }, perf, detectors, startRace, playerHit: (hand = 0) => playerHit(now(), hand, 0.6, deskPoint(hand)),
  stats: () => race.stats(), get counts() { return art.counts; }, get excite() { return excite; },
};
document.body.dataset.ready = '1';
</script>
</body>
</html>
