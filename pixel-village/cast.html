<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>演员表</title>
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2440; }</style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <script type="module">
    // 调试页：28 个体素村民 + 全部动物排成两排，和村里同一套光。?t=秒 控制走路相位；?yaw=度 转角度
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { buildMaterials } from './src/textures.js';
    import { RESIDENTS } from './src/residents.js';
    import { HAIRS, BUILDS } from './src/characters.js';
    import { voxelCharacter, voxelAnimalFrames } from './src/voxel.js';
    import { ANIMAL_NAMES } from './src/animals.js';
    import { setSeason } from './src/season.js';
    setSeason(new URLSearchParams(location.search).get('season') ?? 'autumn'); // ?season= 看四季的衣服

    const q = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.append(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#2a2440');
    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 6, 24);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.update();
    const sun = new THREE.DirectionalLight('#ffb27a', 3.4);
    sun.position.set(-8, 6, 6);
    sun.castShadow = true;
    Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 10, bottom: -10 });
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun, new THREE.HemisphereLight('#8a84c8', '#6a4250', 1.5));
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshToonMaterial({ color: '#8a6446' }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const M = buildMaterials();
    const t = Number(q.get('t') ?? 0.3);
    const yaw = (Number(q.get('yaw') ?? 20) * Math.PI) / 180;
    // ?only=id,id 只看这几个人（排一排、放大）；?pose=work|walk|idle|sit|squat|scatter|eat 统一姿势；?item=名 换手持物；?back=名 背上背的（firewood / sheaf / basket:corn / sack）；?items=a,b&backs=c,d 按顺序一人一样（- 表示没有）
    // ?vary=hair|hat|style|pattern|acc|face|build|extra：逐个检查捏人选项——每个选项一组，正面、左侧、背面、右侧各一个（&sex=女 &top=red 换底子）
    const VARY = { hair: Object.keys(HAIRS), hat: ['', 'skullcap', 'towel', 'felt', 'scarf', 'straw', 'furcap', 'douli', 'veil'], style: ['', 'side', 'vest', 'cotton', 'zhongshan', 'overalls', 'singlet', 'doudou', 'gown', 'magua', 'sheepskin', 'army', 'cape', 'opera'],
      pattern: ['', 'floral', 'plaid', 'stripe', 'patch', 'trim'], acc: ['', 'dalian', 'satchel', 'scarf', 'towel', 'lock', 'redscarf', 'beads', 'pipe', 'glasses', 'shades'], face: ['', 'beard', 'mustache', 'blush', 'smile'], build: ['', ...Object.keys(BUILDS)], extra: ['apron:indigo', 'sash:red'] };
    const vary = q.get('vary');
    if (vary) {
      scene.children.filter((o) => o.isMesh).forEach((o) => { o.visible = false; }); // 地板藏起来
      const woman = q.get('sex') === '女';
      const base = { name: '样', sex: woman ? '女' : '男', age: Number(q.get('age') ?? 30), body: q.get('body') ?? (woman ? 'woman' : 'man'), hair: woman ? 'bun' : 'short', top: q.get('top') ?? 'teal', pants: 'black', skin: 'skin', style: woman ? 'side' : undefined, hat: q.get('hat') ?? undefined };
      const from = Number(q.get('from') ?? 0), opts = VARY[vary].slice(from, from + Number(q.get('n') ?? 99)), cols = Number(q.get('cols') ?? 3); // &from=&n= 分页，&cols= 一行几组
      opts.forEach((v, i) => [0, -90, 180, 90].forEach((deg, j) => {
        const p = { ...base };
        if (vary === 'face') { if (v) p[v] = true; } else if (vary === 'extra') { const [k, c] = v.split(':'); p[k] = c; } else p[vary] = v || undefined;
        const c = voxelCharacter(p, M);
        c.pose('idle', 0);
        c.object.position.set(((i % cols) - (cols - 1) / 2) * 7.2 + (j - 1.5) * 1.55, -Math.floor(i / cols) * 2.9, 0);
        c.object.rotation.y = (deg * Math.PI) / 180;
        scene.add(c.object);
      }));
      const rows = Math.ceil(opts.length / cols), A = innerWidth / innerHeight, H = Math.max(rows * 2.9 / 2 + 0.3, (cols * 7.2) / 2 / A);
      const cam = new THREE.OrthographicCamera(-H * A, H * A, H, -H, 0.1, 200);
      cam.position.set(0, -rows * 2.9 / 2 + 1.6 + 3, 30); cam.lookAt(0, -rows * 2.9 / 2 + 1.6, 0);
      sun.color.set('#fff2e0');
      renderer.setAnimationLoop(() => renderer.render(scene, cam));
      document.documentElement.dataset.ready = '1';
      throw new Error('vary'); // 下面的村民、动物不排了
    }
    const only = q.get('only')?.split(',');
    const list = only ? RESIDENTS.filter((p) => only.includes(p.id)) : RESIDENTS;
    list.forEach((p, i) => {
      const c = voxelCharacter(p, M);
      if (q.has('rain')) c.setRain(true); // ?rain=1：披上蓑衣、戴上斗笠（下雨天下地的样子）
      if (only) c.object.position.set((i - (list.length - 1) / 2) * 2.2, 0, 8);
      else c.object.position.set((i % 14 - 6.5) * 1.6, 0, i < 14 ? -1.5 : 1.5);
      c.object.rotation.y = yaw;
      const item = q.get('items')?.split(',')[i] ?? q.get('item'), back = q.get('backs')?.split(',')[i] ?? q.get('back');
      if (item) c.setItem(item === '-' ? null : item);
      if (back && back !== '-') c.setBack(back);
      c.pose(q.get('pose') ?? (i % 3 === 0 ? 'walk' : i % 3 === 1 ? 'work' : 'idle'), t, i);
      scene.add(c.object);
    });
    if (only) { const z = q.get('zoom') ? Number(q.get('zoom')) : 17; camera.position.set(0, 1.2 + z * 0.12, 8 + z * 0.55); controls.target.set(0, 0.9, 8); controls.update(); }
    // ?animals=dog,goose,duck：只看这几样动物（排一排、放大，村民藏起来）
    const onlyA = q.get('animals')?.split(',');
    if (onlyA) { scene.children.filter((o) => o.isGroup || o.isObject3D && o.type === 'Object3D').forEach((o) => { o.visible = false; }); camera.position.set(0, 3.2, 17); controls.target.set(0, 0.5, 8); controls.update(); }
    (onlyA ?? ANIMAL_NAMES).forEach((k, i, all) => {
      const m = voxelAnimalFrames(k, M)[0];
      m.position.set(onlyA ? (i - (all.length - 1) / 2) * 2.4 : (i - ANIMAL_NAMES.length / 2) * 1.8, 0, onlyA ? 8 : 5);
      m.rotation.y = yaw - Math.PI / 2;
      scene.add(m);
    });
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
    document.documentElement.dataset.ready = '1';
  </script>
</body>
</html>
