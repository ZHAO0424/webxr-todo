<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>石峪村村民档案</title>
  <link rel="stylesheet" href="src/ui/ui.css">
  <style>
    html, body { background: #1e1a2a; }
    body { margin: 0; min-height: 100vh; }
    main.px, .night { color: #eadccc; } /* 深底上用之前的米色字（像素 UI 默认的深棕字是给羊皮纸用的） */
    main { max-width: calc(560 * var(--p)); margin: 0 auto; padding: calc(8 * var(--p)) calc(4 * var(--p)) calc(30 * var(--p)); color: #eadccc; }
    /* 深色木框（和之前的深紫配色一致：底 #2a2438、金色标题、米色正文） */
    .night { border-style: solid; border-width: calc(5 * var(--p)); border-image: var(--frame-night) 5 fill / calc(5 * var(--p)) round; padding: calc(3 * var(--p)) calc(4 * var(--p)); }
    h1 { margin: 0; font-size: calc(24 * var(--p)); line-height: calc(28 * var(--p)); font-weight: normal; color: #ffcf8a; }
    .intro { margin: calc(3 * var(--p)) 0; color: #b0a090; }
    .top a { color: #ffcf8a; }
    .filters { display: flex; flex-wrap: wrap; gap: calc(3 * var(--p)); margin: calc(6 * var(--p)) 0; }
    section.house { margin-top: calc(6 * var(--p)); }
    .house h2 { margin: 0; font-size: calc(12 * var(--p)); font-weight: normal; display: flex; align-items: center; gap: calc(3 * var(--p)); }
    .house h2 .hname { font-size: calc(24 * var(--p)); line-height: calc(26 * var(--p)); color: #ffcf8a; }
    .house .note { color: #b0a090; margin: calc(2 * var(--p)) 0 calc(4 * var(--p)); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(250 * var(--p)), 1fr)); gap: calc(4 * var(--p)); }
    .tile { display: flex; gap: calc(5 * var(--p)); align-items: flex-start; cursor: pointer; }
    .tile:hover { filter: brightness(1.12); }
    .tile .face { flex: none; border-style: solid; border-width: calc(4 * var(--p)); border-image: var(--frame-dark) 5 fill / calc(4 * var(--p)) round;
                  background: linear-gradient(#4a3a6a, #b0607a 70%, #e89a6a); display: grid; place-items: end center; }
    .tile .face canvas { display: block; width: calc(28 * 2 * var(--p)); }
    .tile .txt { min-width: 0; flex: 1; }
    .tile .nm { color: #ffcf8a; font-size: calc(24 * var(--p)); line-height: calc(26 * var(--p)); }
    .tile .nk { color: #b0a090; font-size: calc(12 * var(--p)); margin-left: calc(3 * var(--p)); }
    .tile .jb { color: #d8b890; margin-bottom: calc(2 * var(--p)); }
    .tile .bio { margin: calc(2 * var(--p)) 0; color: #eadccc; }
    .tile .meta { color: #b0a090; }
    .tile .meta b { color: #d8b890; font-weight: normal; margin-right: calc(2 * var(--p)); }
    .tile .more { color: #a8d898; margin-top: calc(2 * var(--p)); }
    .beasts { margin-top: calc(4 * var(--p)); display: flex; flex-wrap: wrap; gap: calc(2 * var(--p)) calc(6 * var(--p)); align-items: flex-end; color: #b0a090; }
    .beasts .b { display: flex; align-items: flex-end; gap: var(--p); }
    .beasts canvas { image-rendering: pixelated; }
    #modal { position: fixed; inset: 0; background: rgba(20, 12, 28, .6); display: grid; place-items: center; padding: calc(6 * var(--p)); }
    #modal[hidden] { display: none; }
    #modal .card { max-height: 92vh; overflow: auto; scrollbar-width: none; }
  </style>
  <script>
    // 错误直接显示在页面上，并记到 data-errors，供无头检查读取
    (() => {
      const errors = [];
      const show = (m) => {
        errors.push(String(m));
        document.documentElement.dataset.errors = String(errors.length);
        const el = document.getElementById('err');
        if (el) { el.style.display = 'block'; el.textContent = errors.join('\n'); }
      };
      addEventListener('error', (e) => show(`${e.message} @ ${e.filename}:${e.lineno}`));
      addEventListener('unhandledrejection', (e) => show(`reject: ${e.reason?.stack ?? e.reason}`));
      const ce = console.error.bind(console);
      console.error = (...a) => { show(a.join(' ')); ce(...a); };
    })();
  </script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <main id="main" class="px"></main>
  <div id="modal" class="px" hidden></div>
  <pre id="err" style="position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px;background:#600;color:#fff;font:12px monospace;white-space:pre-wrap;display:none"></pre>
  <script type="module">
    // 村民档案：按户分组；每户一块羊皮纸，里面是一家人的小卡片和家里的牲口。点小卡片弹出完整的卡（和村子里点人看到的同一张）。
    import { VILLAGE, HOUSEHOLDS, RESIDENTS } from './src/residents.js';
    import { characterAtlas, CELL_W, CELL_H } from './src/characters.js';
    import { animalAtlas } from './src/animals.js';
    import { animalInfo } from './src/animalInfo.js';
    import { buildMaterials } from './src/textures.js';
    import { buildCompounds } from './src/compounds.js';
    import { setupPixelUI, portrait } from './src/ui/frame.js';
    import { residentCard } from './src/ui/cards.js';

    setupPixelUI();
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    const byId = Object.fromEntries(RESIDENTS.map((p) => [p.id, p]));

    // 家里的牲口：和村子里同样的顺序发名字（同一只动物两边叫同一个名字）
    const C = buildCompounds(buildMaterials());
    const beasts = {};
    for (const [id, c] of Object.entries(C)) beasts[id] = c.animals.map((s) => ({ s, info: animalInfo(s, { id }) }));
    const extra = [...Array(4).fill('goose'), ...Array(5).fill('duck'), ...Array(8).fill('pigeon')].map((kind) => ({ s: { kind, role: kind }, info: animalInfo({ kind, role: kind }, null) }));
    beasts.farmC.push(...extra.filter((b) => b.s.kind !== 'pigeon')); // 鸭鹅归吴家
    beasts.school.push(...extra.filter((b) => b.s.kind === 'pigeon')); // 鸽子落在学堂屋檐下
    const nBeasts = Object.values(beasts).reduce((n, l) => n + l.length, 0);

    const FILTERS = {
      全部: () => true,
      大人: (p) => p.body !== 'child' && p.age < 60,
      老人: (p) => p.age >= 60,
      孩子: (p) => p.body === 'child',
      手艺人: (p) => /匠|郎中|掌柜|剃头|货郎|伙计|徒弟|豆腐/.test(p.job),
      种地的: (p) => /种地|庄稼|羊倌|喂|农/.test(p.job + p.skills.join()),
      外来的: (p) => p.relation.includes('外村') || p.relation.includes('寄住') || p.relation.includes('住铺里'),
    };

    const main = document.getElementById('main');
    main.innerHTML = `<div class="night top">
        <h1>${esc(VILLAGE.name)} · 村民档案</h1>
        <p class="intro">${esc(VILLAGE.intro)}</p>
        <span class="chip" style="--c:#b0603a">${HOUSEHOLDS.length} 户</span><span class="chip" style="--c:#5a8a3a">${RESIDENTS.length} 口人</span><span class="chip" style="--c:#4a8ac0">${nBeasts} 只牲口</span>
        <a href="./">← 回到村子</a>
      </div>
      <div class="filters">${Object.keys(FILTERS).map((k, i) => `<button class="btn${i ? '' : ' on'}" data-f="${k}">${k}</button>`).join('')}</div>
      <div id="houses"></div>`;

    const houses = document.getElementById('houses');
    for (const h of HOUSEHOLDS) {
      const sec = document.createElement('section');
      sec.className = 'night house';
      sec.innerHTML = `<h2><span class="hname">${esc(h.name)}</span><span class="chip soft">${esc(h.kind)}</span></h2><p class="note">${esc(h.note)}</p><div class="tiles"></div><div class="beasts"></div>`;
      const tiles = sec.querySelector('.tiles');
      for (const p0 of h.people) {
        const p = byId[p0.id];
        const t = document.createElement('div');
        t.className = 'night tile';
        t.dataset.id = p.id;
        t.innerHTML = `<div class="face"></div><div class="txt">
          <div class="nm">${esc(p.name)}<span class="nk">${esc(p.nick)}</span></div>
          <div class="jb">${esc(p.job)} · ${esc(p.relation)}</div>
          <div><span class="chip" style="--c:#7a5a9a">${p.age}岁 · ${p.sex}</span>${p.traits.map((x) => `<span class="chip" style="--c:#4a5a8a">${esc(x)}</span>`).join('')}</div>
          <p class="bio">${esc(p.bio)}</p>
          <div class="meta"><b>喜欢</b>${esc(p.likes)}</div>
          <div class="meta"><b>手艺</b>${esc(p.skills.join('、'))}</div>
          ${p.owns.length ? `<div class="meta"><b>家当</b>${esc(p.owns.join('、'))}</div>` : ''}
          <div class="more">▸ 亲近的人、一天的安排</div></div>`;
        t.querySelector('.face').append(portrait(characterAtlas(p), 0, 0, CELL_W, CELL_H, 1)); // 全身像
        t.addEventListener('click', () => open(p.id));
        tiles.append(t);
      }
      const bl = sec.querySelector('.beasts');
      for (const { s, info } of beasts[h.id] ?? []) {
        const a = animalAtlas(s.kind);
        const c = portrait(a.canvas, 0, 0, a.cellW, a.cellH, 1);
        c.style.width = `calc(${a.cellW * 2} * var(--p))`;
        const el = document.createElement('span');
        el.className = 'b';
        el.title = info.about;
        el.append(c, `${info.name}`);
        bl.append(el);
      }
      if (!bl.childElementCount) bl.remove();
      houses.append(sec);
    }

    // 筛选：只看某一类人；一个人都不剩的户藏起来
    main.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => {
      main.querySelectorAll('[data-f]').forEach((x) => x.classList.toggle('on', x === b));
      const f = FILTERS[b.dataset.f];
      for (const sec of houses.children) {
        let any = false;
        for (const t of sec.querySelectorAll('.tile')) { const on = f(byId[t.dataset.id]); t.hidden = !on; any ||= on; }
        sec.hidden = !any;
      }
    }));

    // 完整的卡（亲近的人里点名字直接换到那个人）
    const modal = document.getElementById('modal');
    function open(id) {
      const card = residentCard(byId[id], { live: false, onClose: () => { modal.hidden = true; }, onPick: open });
      modal.innerHTML = '';
      modal.append(card.el);
      modal.hidden = false;
    }
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.hidden = true; });
    const q = new URLSearchParams(location.search);
    if (q.get('pick')) open(q.get('pick'));
    document.documentElement.dataset.ready = '1';
  </script>
</body>
</html>
