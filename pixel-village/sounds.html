<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>村子声音试听</title>
  <link rel="stylesheet" href="src/ui/ui.css">
  <style>
    html, body { background: #1a1624; }
    body { margin: 0; min-height: 100vh; }
    main { max-width: calc(380 * var(--p)); margin: 0 auto; padding: calc(8 * var(--p)) calc(4 * var(--p)) calc(30 * var(--p)); }
    h1 { margin: 0; font-weight: normal; color: var(--gold); }
    .intro { color: var(--dim); margin: calc(2 * var(--p)) 0; }
    .top a { color: var(--gold); }
    .vol { display: flex; align-items: center; gap: calc(3 * var(--p)); margin-top: calc(3 * var(--p)); }
    .vol input { flex: 1; accent-color: #ffcc66; }
    section { margin-top: calc(6 * var(--p)); }
    h2 { margin: 0 0 calc(3 * var(--p)); font-weight: normal; color: var(--gold); display: flex; align-items: center; gap: calc(3 * var(--p)); }
    h2::after { content: ''; flex: 1; height: var(--f); background: var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(84 * var(--p)), 1fr)); gap: calc(3 * var(--p)); }
    .snd { text-align: left; padding: calc(2 * var(--p)) calc(4 * var(--p)); line-height: calc(16 * var(--f)); }
    .snd b { display: block; color: var(--text); text-shadow: none; }
    .snd small { display: block; color: var(--dim); font-size: inherit; }
    .snd.on { --c: var(--gold); }
    .snd.on b, .snd.on small { color: #2a1a10; }
    .snd.flash { filter: brightness(1.4); }
    .tip { color: var(--dim); margin-top: calc(2 * var(--p)); }
    .cand { display: grid; grid-template-columns: calc(70 * var(--p)) 1fr; gap: calc(3 * var(--p)); align-items: start; padding: calc(2 * var(--p)) 0; border-bottom: var(--f) solid var(--line); }
    .cand .cname { color: var(--text); padding-top: calc(2 * var(--p)); }
    .cand .grid { grid-template-columns: repeat(3, 1fr); }
    .opt { display: flex; flex-direction: column; gap: var(--f); min-width: 0; }
    .opt .snd small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .opt .src { color: var(--dim); font-size: inherit; }
  </style>
  <script>
    // 错误直接显示在页面上，并记到 data-errors，供无头检查读取
    (() => {
      const errors = [];
      const show = (m) => {
        errors.push(String(m));
        document.documentElement.dataset.errors = String(errors.length);
        const el = document.getElementById('err');
        if (el) { el.style.display = 'block'; el.textContent = errors.join('\n'); }
      };
      addEventListener('error', (e) => show(`${e.message} @ ${e.filename}:${e.lineno}`));
      addEventListener('unhandledrejection', (e) => show(`reject: ${e.reason?.stack ?? e.reason}`));
      const ce = console.error.bind(console);
      console.error = (...a) => { show(a.join(' ')); ce(...a); };
    })();
  </script>
</head>
<body>
  <main class="px">
    <div class="panel top">
      <h1 class="big">村子声音试听</h1>
      <p class="intro">村里所有声音都是浏览器现场合成的（振荡器 + 噪声 + 滤波器），没有音频文件。点一下播一次；"一直响的"点一下开、再点关。
        在村子里它们还会按位置分左右、按远近变大小，这里统一放在正前方。<br>
        动物、干活这些改用真实录音：每种 A / B / C 三个候选（都来自 Freesound，CC0 公有领域，可商用、不用署名），挑好告诉我，比如"狗 B、猪 A"。</p>
      <div class="vol">音量 <input id="vol" type="range" min="0" max="1.5" step="0.05" value="0.8"> <a href="./">← 回到村子</a></div>
    </div>
    <div id="list"></div>
    <p class="tip">每种挑一个告诉我（比如"狗 B、猪 A"）；三个都不行的也说一声，我再去找。</p>
  </main>
  <pre id="err" style="position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px;background:#600;color:#fff;font:12px monospace;white-space:pre-wrap;display:none"></pre>
  <script type="module">
    import { setupPixelUI } from './src/ui/frame.js';
    import { makeSynth } from './src/synth.js';

    setupPixelUI();
    let ctx = null, S = null, master = null;
    function audio() {
      if (!ctx) {
        ctx = new AudioContext();
        S = makeSynth(ctx);
        master = new GainNode(ctx, { gain: Number(document.getElementById('vol').value) });
        master.connect(new DynamicsCompressorNode(ctx, { threshold: -18, ratio: 4 })).connect(ctx.destination);
      }
      ctx.resume();
      return ctx;
    }
    document.getElementById('vol').addEventListener('input', (e) => { if (master) master.gain.value = Number(e.target.value); });

    // 一次性的声音：[名字, 说明, 播放]；when 是开始时间
    const once = (name, ...a) => (t, out) => S.SFX[name](t, out, ...a);
    const repeat = (fn, n, gap) => (t, out) => { for (let i = 0; i < n; i++) fn(t + i * gap, out); };
    const GROUPS = [
      ['响器', [
        ['梆子', '打更、唱戏打板', once('block')],
        ['打更', '梆、梆 + 小锣', (t, o) => { S.SFX.block(t, o); S.SFX.block(t + 0.35, o); S.SFX.gong(t + 0.8, o); }],
        ['大锣', '唱戏开场', once('gong', true)],
        ['小锣', '', once('gong', false)],
        ['铃', '祭土地摇铃', once('bell')],
      ]],
    ];
    // 一直响的：[名字, 说明, 接线(out) → 停止函数（可选）, 音量]
    const LOOPS = [
      ['风', '一阵大一阵小', (o) => S.LOOPS.wind(o), 0.12],
      ['雨', '下雨天', (o) => S.LOOPS.rain(o), 0.16],
      ['溪水', '沿溪几处', (o) => S.LOOPS.stream(o), 0.5],
      ['唱戏', '板胡 + 梆子 + 锣 + 唱腔', (o) => { const st = {}; const sing = new GainNode(ctx, { gain: 1 }); sing.connect(o); const id = setInterval(() => { while ((st.next ?? 0) < ctx.currentTime + 0.3) S.operaStep(st, o, sing); }, 100); return () => clearInterval(id); }, 1],
    ];

    const list = document.getElementById('list');
    const section = (title) => { const s = document.createElement('section'); s.innerHTML = `<h2 class="title">${title}</h2><div class="grid"></div>`; list.append(s); return s.querySelector('.grid'); };
    const button = (grid, name, note) => { const b = document.createElement('button'); b.className = 'btn snd'; b.innerHTML = `<b>${name}</b><small>${note || '　'}</small>`; grid.append(b); return b; };

    // ---------------------------------------------------------------- 素材候选（Freesound，CC0）：每种 A / B / C 三个，挑一个
    const NAMES = {
      rooster: '公鸡打鸣', hen: '母鸡', dog: '狗叫', pig: '猪', sheep: '羊', donkey: '毛驴', ox: '黄牛', duck: '鸭子', goose: '大白鹅', pigeon: '鸽子', magpie: '喜鹊', cat: '猫',
      clang: '打铁', chop: '劈柴', thud: '锄地', chirp: '鸟叫', crickets: '蛐蛐（一直响）', fire: '篝火（一直响）', mill: '磨盘 / 碾子（一直响）', crowd: '人声（一直响）', projector: '放映机（一直响）',
    };
    const cache = new Map();
    const load = async (file) => { if (!cache.has(file)) cache.set(file, fetch(`sfx/cand/${file}`).then((r) => r.arrayBuffer()).then((a) => ctx.decodeAudioData(a))); return cache.get(file); };
    const index = await fetch('sfx/cand/index.json').then((r) => r.json());
    const cs = section('素材候选（Freesound · CC0 公有领域）');
    cs.style.gridTemplateColumns = '1fr';
    for (const [key, list] of Object.entries(index)) {
      const row = document.createElement('div');
      row.className = 'cand';
      row.innerHTML = `<div class="cname title">${NAMES[key] ?? key}</div>`;
      const opts = document.createElement('div');
      opts.className = 'grid';
      row.append(opts);
      cs.append(row);
      list.forEach((c, i) => {
        const b = button(opts, `${'ABC'[i]}${c.loop ? '  ▶ 开/关' : ''}`, `${c.title.slice(0, 26)}`);
        b.title = `${c.title}
${c.user} · ${c.license}
${c.url}`;
        const link = document.createElement('a');
        link.href = c.url; link.target = '_blank'; link.textContent = `来源 · ${c.user}`;
        link.className = 'src';
        b.after(link);
        const wrap = document.createElement('div'); wrap.className = 'opt'; b.before(wrap); wrap.append(b, link);
        let node = null;
        b.addEventListener('click', async () => {
          audio();
          if (node) { node.stop(); node = null; b.classList.remove('on'); return; }
          const s = new AudioBufferSourceNode(ctx, { buffer: await load(c.file), loop: c.loop });
          s.connect(master);
          s.start();
          if (c.loop) { node = s; b.classList.add('on'); }
          else { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 150); }
        });
      });
    }

    for (const [title, items] of GROUPS) {
      const g = section(`合成的 · ${title}`);
      for (const [name, note, play] of items) {
        const b = button(g, name, note);
        b.addEventListener('click', () => {
          audio();
          play(ctx.currentTime + 0.03, master);
          b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 150);
        });
      }
    }
    const lg = section('合成的 · 一直响的（点一下开 / 关）');
    for (const [name, note, start, level] of LOOPS) {
      const b = button(lg, name, note);
      let g = null, stop = null;
      b.addEventListener('click', () => {
        audio();
        if (g) { // 关：淡出后断开
          const old = g, s = stop;
          old.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
          setTimeout(() => { old.disconnect(); s?.(); }, 800);
          g = stop = null;
          b.classList.remove('on');
          return;
        }
        g = new GainNode(ctx, { gain: 0 });
        g.connect(master);
        stop = start(g);
        g.gain.setTargetAtTime(level, ctx.currentTime, 0.2);
        b.classList.add('on');
      });
    }
    // ?auto=1：把每个按钮都点一遍（无头检查有没有报错）
    if (new URLSearchParams(location.search).has('auto')) for (const b of document.querySelectorAll('.snd')) { b.click(); if (b.classList.contains('on')) setTimeout(() => b.click(), 1500); }
    document.documentElement.dataset.ready = '1';
  </script>
</body>
</html>
