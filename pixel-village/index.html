<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>像素村落</title>
  <link rel="stylesheet" href="src/ui/ui.css">
  <style>
    html, body { margin: 0; height: 100%; background: #1b1d24; overflow: hidden; }
    /* 时钟栏：右上角的深色像素面板 */
    #clock { position: fixed; right: calc(4 * var(--p)); top: calc(4 * var(--p)); width: var(--panel-w); padding: calc(2 * var(--p)) calc(3 * var(--p)); pointer-events: none; } /* 和卡片一样宽 */
    #clock .top { display: flex; align-items: center; gap: calc(3 * var(--p)); }
    #clock .date { color: var(--dim); line-height: calc(13 * var(--f)); }
    #clock .time { font-size: calc(24 * var(--f)); line-height: calc(26 * var(--f)); color: var(--gold); }
    #clock .ev { margin-top: var(--f); }
    #clock .ev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #clock .ev .name { color: var(--gold); } /* 今日活动：金色活动名 + 时间地点 */
    #clock .sub { color: var(--dim); }
    /* 左下角：设置（点开往上弹出声音、音乐、季节）+ 村民档案，都是一样的像素按钮 */
    #hint { position: fixed; left: calc(4 * var(--p)); bottom: calc(4 * var(--p)); }
    #hint .bar { display: flex; gap: calc(3 * var(--p)); }
    #hint a.btn { display: inline-block; text-decoration: none; }
    #settings { position: absolute; left: 0; bottom: calc(100% + 3 * var(--p)); display: flex; flex-direction: column; gap: calc(3 * var(--p)); padding: calc(3 * var(--p)); }
    #settings[hidden] { display: none; }
    #settings .btn { text-align: left; white-space: nowrap; }
    #debug { position: absolute; left: 0; bottom: calc(100% + 3 * var(--p)); padding: calc(3 * var(--p)) calc(4 * var(--p)); white-space: pre; line-height: calc(14 * var(--f)); min-width: calc(110 * var(--p)); }
    #debug[hidden] { display: none; }
    #debug b { color: var(--gold); font-weight: normal; }
    /* 卡片：时钟栏下面，靠右 */
    #card { position: fixed; right: calc(4 * var(--p)); top: calc(66 * var(--p)); max-height: calc(100vh - 72 * var(--p)); overflow: auto; scrollbar-width: none; }
    #card::-webkit-scrollbar { display: none; }
    #clock, #card { --panel-w: calc(116 * var(--p)); } /* 字回到 12px 点阵（UI 已经跟着窗口缩放，不用再单独放大一号） */
    #clock { padding: calc(3 * var(--p)) calc(4 * var(--p)); }
    #card .card { padding: calc(3 * var(--p)) calc(4 * var(--p)); }
    /* 村民档案：页面里的横板大卡，四边各留一点，和屏幕一样的比例（版式参考星露谷的村民关系页、牧场物语的村民资料页） */
    #roster { position: fixed; inset: 6vh 5vw; display: flex; flex-direction: column; gap: calc(3 * var(--p)); z-index: 5; }
    #roster[hidden] { display: none; }
    body.roster-open #clock, body.roster-open #card, body.roster-open .scene-nav, body.roster-open #VRButton { visibility: hidden; } /* 档案打开时右上角日期栏、卡片、换场景按钮先藏起来 */
    #roster [hidden] { display: none !important; }
    #roster .rhead { display: flex; align-items: center; flex-wrap: wrap; gap: calc(2 * var(--p)); padding-right: calc(10 * var(--p)); }
    #roster .rhead .title { color: var(--gold); margin-right: calc(3 * var(--p)); font-family: 'PixelZh', sans-serif; font-size: calc(16 * var(--f)); line-height: calc(20 * var(--f)); }
    #roster .rhead .chip { margin: 0; }
    #roster .filters, #roster .nav { display: flex; flex-wrap: wrap; gap: calc(2 * var(--p)); margin-left: auto; }
    #roster .close { position: absolute; right: calc(2 * var(--p)); top: calc(2 * var(--p)); --c: var(--red); padding: 0 calc(2 * var(--p)); line-height: calc(14 * var(--f)); }
    #roster .rbody { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #roster .chip { margin: 0 var(--p) var(--p) 0; padding: 0 calc(2 * var(--p)); line-height: calc(14 * var(--f)); }
    #roster .dot { display: inline-block; width: calc(2 * var(--p)); height: calc(2 * var(--p)); background: var(--green); flex: none; }
    #roster .dot.rest { background: var(--blue); }
    #roster .dot.sleep { background: var(--purple); }
    #roster .dot.event { background: var(--gold); }
    #roster .pin { display: inline-block; width: calc(5 * var(--f)); height: calc(7 * var(--f)); margin-right: calc(2 * var(--f)); vertical-align: calc(-1 * var(--f));
                   background: var(--gold); clip-path: polygon(50% 100%, 0 45%, 0 20%, 20% 0, 80% 0, 100% 20%, 100% 45%); }
    #roster .now { display: flex; align-items: center; gap: calc(2 * var(--p)); min-width: 0; }
    #roster .now .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #roster .now .loc { margin-left: auto; color: var(--dim); white-space: nowrap; }
    #roster .nk { color: var(--dim); margin-left: calc(2 * var(--p)); }
    /* 立绘台：黄昏天 + 一道地面，人站在地上 */
    #roster .stage { flex: none; display: grid; place-items: end center; background: linear-gradient(#4a3a6a, #9a5a7a 62%, #d88a64 80%, #6b4a32 80%, #4e3524);
                     box-shadow: 0 0 0 var(--f) var(--ink), inset 0 0 0 var(--f) #6c5c88; overflow: hidden; }
    #roster .stage canvas { display: block; margin-bottom: calc(3 * var(--f)); }
    /* 列表：人物卡铺满整面（宽屏 5 列 × 6 行） */
    #roster .rlist { height: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(100 * var(--p)), 1fr)); grid-auto-rows: minmax(calc(44 * var(--p)), calc((100% - 5 * 3 * var(--p)) / 6)); gap: calc(3 * var(--p)); }
    #roster .tile { display: flex; gap: calc(3 * var(--p)); padding: calc(2 * var(--p)); cursor: pointer; min-width: 0; overflow: hidden; }
    #roster .tile:hover { filter: brightness(1.12); }
    #roster .tile .stage { width: calc(32 * 2 * var(--f)); }
    #roster .tile .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    #roster .tile .txt > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #roster .tile .nm { color: var(--gold); }
    #roster .tile .l1 { display: flex; align-items: center; }
    #roster .tile .l1 .chip { margin: 0 0 0 auto; flex: none; }
    #roster .tile .l1 .nk { overflow: hidden; text-overflow: ellipsis; margin-right: var(--p); }
    #roster .tile .jb, #roster .tile .lk { color: var(--dim); }
    #roster .tile .lk b { color: #d8c0a0; font-weight: normal; text-shadow: none; margin-right: calc(2 * var(--p)); }
    #roster .tile .now { background: #2a2338; padding: 0 calc(2 * var(--p)); box-shadow: inset 0 var(--f) 0 #16121f; }
    #roster .tile .tr .chip { margin-bottom: 0; }
    /* 详情：三栏，每栏的框都撑满 */
    #roster .rdetail { display: grid; grid-template-columns: minmax(calc(110 * var(--p)), 0.85fr) 1.2fr 1fr; gap: calc(4 * var(--p)); height: 100%; }
    #roster .col { min-height: 0; display: flex; flex-direction: column; gap: calc(3 * var(--p)); }
    #roster .box { padding: calc(2 * var(--p)) calc(3 * var(--p)); min-height: 0; }
    #roster .box .lbl { color: var(--gold); margin-bottom: var(--p); display: flex; }
    #roster .box .lbl .count { margin-left: auto; color: var(--dim); }
    #roster .box p { margin: 0; }
    #roster .stage.big { flex: 1; min-height: calc(100 * var(--p)); position: relative; }
    #roster .stage.big canvas { margin-bottom: calc(26 * var(--f)); }
    #roster .plate { position: absolute; left: 50%; bottom: calc(3 * var(--p)); transform: translateX(-50%); white-space: nowrap; padding: 0 calc(4 * var(--p));
                     background: #1b1626; box-shadow: 0 0 0 var(--f) var(--ink), inset 0 0 0 var(--f) #6c5c88; }
    #roster .plate span { font-family: 'PixelZh', sans-serif; font-size: calc(16 * var(--f)); line-height: calc(20 * var(--f)); }
    #roster .plate .nm { color: var(--gold); }
    #roster .chips .chip { margin-bottom: var(--p); }
    #roster .nowbox .now { padding: var(--f) 0; }
    #roster .nowbox .next { color: var(--dim); }
    #roster .find { --c: var(--c-farm); line-height: calc(22 * var(--f)); }
    #roster .bio { flex: none; }
    #roster .quad { display: grid; grid-template-columns: 1fr 1fr; gap: calc(3 * var(--p)); flex: none; }
    #roster .rels { flex: none; max-height: 60%; overflow: auto; scrollbar-width: none; }
    #roster .relgrid { display: flex; flex-direction: column; gap: calc(2 * var(--p)); }
    #roster .rel { display: flex; gap: calc(2 * var(--p)); align-items: center; padding: var(--f); cursor: pointer; background: #2a2338; box-shadow: inset 0 var(--f) 0 #16121f; min-width: 0; }
    #roster .rel:hover { background: #3e3456; }
    #roster .rel .hd { flex: none; width: calc(42 * var(--f)); height: calc(42 * var(--f)); background: linear-gradient(#4a3a6a, #9a5a7a 70%, #d88a64); box-shadow: 0 0 0 var(--f) var(--ink); overflow: hidden; }
    #roster .rel .hd canvas { display: block; }
    #roster .rel .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #roster .rel .t > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #roster .rel .l1 .chip { margin-left: calc(2 * var(--p)); }
    #roster .rel .nm { color: var(--text); }
    #roster .rel .chip { margin-bottom: 0; }
    #roster .rel .now { padding-right: var(--p); }
    #roster .rel .rr { color: var(--dim); }
    #roster .planbox { flex: 1; overflow: auto; scrollbar-width: none; }
    #roster .planbox .plan li.item { line-height: calc(18 * var(--f)); }
    #roster .home { flex: 1; overflow: auto; scrollbar-width: none; }
    #roster .home p { color: var(--dim); }
    #roster .pets { display: flex; flex-direction: column; gap: calc(2 * var(--p)); margin-top: calc(3 * var(--p)); }
    #roster .pet { display: flex; align-items: center; gap: calc(3 * var(--p)); background: #2a2338; box-shadow: inset 0 var(--f) 0 #16121f; padding: var(--p) calc(2 * var(--p)); }
    #roster .pet .ic { flex: none; width: calc(40 * var(--f)); display: grid; place-items: center; }
    #roster .pet canvas { image-rendering: pixelated; display: block; }
    #roster .pet .nm { color: var(--text); }
    #roster .pet .kd { color: var(--dim); margin-left: calc(2 * var(--p)); }
    #roster .pet .ab { color: var(--dim); }
    /* 档案的地图：左边像素俯视图（等比放大、像素不糊），右边点中的人和"此刻谁在哪儿" */
    #roster .tabs { display: flex; gap: calc(2 * var(--p)); margin-left: calc(3 * var(--p)); }
    #roster .rmap { height: 100%; display: flex; gap: calc(4 * var(--p)); }
    #roster .mapwrap { position: relative; height: 100%; max-width: 70%; flex: none; box-shadow: 0 0 0 var(--f) var(--ink), 0 0 0 calc(2 * var(--f)) #6c5c88; overflow: hidden; cursor: default; }
    #roster .mapwrap canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    /* 每户一块小牌子：户名 + 这家人的头像和名字（两人一行）；院子正中一个小钉，牌子被推开了就用细线连回去 */
    #roster .leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #roster .leaders line { stroke: #fff2cc; stroke-width: 2; stroke-dasharray: 4 3; opacity: .8; }
    #roster .home-pin { position: absolute; width: calc(3 * var(--p)); height: calc(3 * var(--p)); transform: translate(-50%, -50%); background: var(--gold); box-shadow: 0 0 0 var(--f) var(--ink); pointer-events: none; }
    #roster .hh { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
    #roster .hh:hover { z-index: 2; }
    #roster .hh .ms { display: flex; flex-direction: column; gap: calc(3 * var(--f)); }
    #roster .hh .yn { color: var(--gold); white-space: nowrap; line-height: calc(13 * var(--f)); margin-bottom: calc(2 * var(--f));
                      text-shadow: var(--f) 0 0 #1b1626, calc(-1 * var(--f)) 0 0 #1b1626, 0 var(--f) 0 #1b1626, 0 calc(-1 * var(--f)) 0 #1b1626, var(--f) var(--f) 0 #1b1626; }
    #roster .mk { display: flex; align-items: center; gap: calc(3 * var(--f)); cursor: pointer; }
    #roster .mk .hd { flex: none; width: calc(20 * var(--f)); height: calc(20 * var(--f)); overflow: hidden; background: linear-gradient(#4a3a6a, #9a5a7a 70%, #d88a64);
                      box-shadow: 0 0 0 var(--f) var(--ink), 0 0 0 calc(2 * var(--f)) var(--jc, var(--line)), 0 0 0 calc(3 * var(--f)) var(--ink); }
    #roster .mk .hd canvas { display: block; }
    #roster .mk .t { display: flex; flex-direction: column; white-space: nowrap; line-height: calc(13 * var(--f));
                     text-shadow: var(--f) 0 0 #1b1626, calc(-1 * var(--f)) 0 0 #1b1626, 0 var(--f) 0 #1b1626, 0 calc(-1 * var(--f)) 0 #1b1626, var(--f) var(--f) 0 #1b1626; }
    #roster .mk .nm { color: #fff2cc; }
    #roster .mk .jb { color: #d8cbe8; }
    #roster .mk:hover .nm { color: var(--gold); }
    #roster .mk.on .nm { color: var(--gold); }
    #roster .mk.on .hd { box-shadow: 0 0 0 var(--f) var(--ink), 0 0 0 calc(3 * var(--f)) var(--gold), 0 0 0 calc(4 * var(--f)) var(--ink); }
    #roster .maptitle { position: absolute; left: calc(3 * var(--p)); top: calc(2 * var(--p)); z-index: 3; pointer-events: none; color: var(--gold);
                        font-family: 'PixelZh', sans-serif; font-size: calc(16 * var(--f)); line-height: calc(20 * var(--f));
                        text-shadow: var(--f) 0 0 #1b1626, calc(-1 * var(--f)) 0 0 #1b1626, 0 var(--f) 0 #1b1626, 0 calc(-1 * var(--f)) 0 #1b1626, var(--f) var(--f) 0 #1b1626; }
    #roster .maptitle span { display: block; color: #fff2cc; font-family: 'PixelZh12', sans-serif; font-size: calc(12 * var(--f)); line-height: calc(14 * var(--f)); }
    #roster .mapside { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(3 * var(--p)); }
    #roster .mini { flex: none; }
    #roster .grp .chip .cn { color: var(--dim); margin-left: var(--p); }
    #roster .grp .chip.on .cn { color: #5a4020; }
    #roster .mini .row1 { display: flex; gap: calc(3 * var(--p)); align-items: center; margin-bottom: calc(2 * var(--p)); }
    #roster .mini .hd.big { flex: none; width: calc(40 * var(--f)); height: calc(40 * var(--f)); overflow: hidden; background: linear-gradient(#4a3a6a, #9a5a7a 70%, #d88a64); box-shadow: 0 0 0 var(--f) var(--ink), inset 0 0 0 var(--f) #6c5c88; }
    #roster .mini .hd.big canvas { display: block; }
    #roster .mini .nm { color: var(--gold); }
    #roster .mini .jb { color: var(--dim); }
    #roster .mini .next { color: var(--dim); }
    #roster .mini .bio { margin: calc(2 * var(--p)) 0; }
    #roster .mini .btns { display: flex; gap: calc(2 * var(--p)); }
    #roster .mini .find { line-height: calc(18 * var(--f)); }
    #roster .info { flex: 1; overflow: auto; scrollbar-width: none; }
    #roster .info .sec { margin-bottom: calc(3 * var(--p)); }
    #roster .info .kv { display: grid; grid-template-columns: auto 1fr; gap: var(--p) calc(3 * var(--p)); margin-bottom: calc(3 * var(--p)); }
    #roster .info .kv b { color: var(--gold); font-weight: normal; text-shadow: none; }
    #roster .info .chip .cn { opacity: .75; margin-left: var(--p); }
    #roster .info .plan li.item { line-height: calc(17 * var(--f)); }
    /* 换场景：屏幕左右边缘正中的像素按钮（像素三角 + 那边的地名） */
    .scene-nav { position: fixed; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(2 * var(--p));
                 padding: calc(3 * var(--p)) calc(2 * var(--p)); cursor: pointer; color: var(--text); background: none; }
    .scene-nav[hidden] { display: none; }
    .scene-nav:hover { color: var(--gold); filter: brightness(1.15); }
    .scene-nav:active { transform: translateY(calc(-50% + var(--f))); }
    .scene-nav .tri { width: calc(5 * var(--p)); height: calc(10 * var(--p)); background: var(--gold); }
    .scene-nav .label { writing-mode: vertical-rl; letter-spacing: calc(2 * var(--f)); }
    #goLeft { left: calc(4 * var(--p)); }
    #goLeft .tri { clip-path: polygon(100% 0, 0 50%, 100% 100%); }
    #goRight { right: calc(4 * var(--p)); }
    #goRight .tri { clip-path: polygon(0 0, 100% 50%, 0 100%); }
    #err { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px; background: #600; color: #fff;
           font: 12px monospace; white-space: pre-wrap; display: none; max-height: 40vh; overflow: auto; }
  </style>
  <script>
    // 错误直接显示在页面上，并记到 data-errors，供无头检查读取
    (() => {
      const errors = [];
      const show = (m) => {
        errors.push(String(m));
        document.documentElement.dataset.errors = String(errors.length);
        const el = document.getElementById('err');
        if (el) { el.style.display = 'block'; el.textContent = errors.join('\n'); }
      };
      addEventListener('error', (e) => show(`${e.message} @ ${e.filename}:${e.lineno}`));
      addEventListener('unhandledrejection', (e) => show(`reject: ${e.reason?.stack ?? e.reason}`));
      const ce = console.error.bind(console);
      console.error = (...a) => { show(a.join(' ')); ce(...a); };
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">
    <div id="settings" class="dark px" hidden><button id="sound" class="btn">声音：关</button><button id="music" class="btn">音乐：关</button><button id="season" class="btn">季节：秋</button></div>
    <div id="debug" class="dark px" hidden></div>
    <div class="bar px"><button id="settingsBtn" class="btn">设置</button><button id="debugBtn" class="btn">调试</button><button id="rosterBtn" class="btn">村民档案</button></div>
  </div>
  <div id="clock" class="dark px"></div>
  <button id="goLeft" class="scene-nav dark px" title="往西走（←）" hidden><span class="tri"></span><span class="label"></span></button>
  <button id="goRight" class="scene-nav dark px" title="往东走（→）" hidden><span class="tri"></span><span class="label"></span></button>
  <div id="card" hidden></div>
  <div id="roster" hidden></div>
  <pre id="err"></pre>
  <script type="module" src="src/main.js"></script>
</body>
</html>
