<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>像素村落</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1d24; overflow: hidden; font-family: system-ui, sans-serif; }
    #hint { position: fixed; left: 12px; top: 10px; color: #f0d8c0; font-size: 13px; opacity: .75; }
    #clock { position: fixed; right: 14px; top: 10px; color: #f0d8c0; font: 600 18px/1 ui-monospace, monospace; opacity: .85; pointer-events: none; }
    #card { position: fixed; right: 14px; top: 40px; width: 300px; max-height: 80vh; overflow: auto; padding: 12px 14px; border-radius: 6px;
            background: rgba(24, 20, 36, .88); color: #eadccc; font-size: 13px; line-height: 1.55; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
    #card h3 { margin: 0 0 4px; font-size: 18px; color: #ffd8a0; }
    #card h3 small { margin-left: 8px; font-size: 12px; color: #b8a898; font-weight: 400; }
    #card p { margin: 6px 0; }
    #card .job { color: #d0b090; }
    #card .now { color: #a8e0a0; }
    #card .meta { color: #b8a898; font-size: 12px; }
    #card .day { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: #c8b8a8; }
    #err { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px; background: #600; color: #fff;
           font: 12px monospace; white-space: pre-wrap; display: none; max-height: 40vh; overflow: auto; }
  </style>
  <script>
    // 错误直接显示在页面上，并记到 data-errors，供无头检查读取
    (() => {
      const errors = [];
      const show = (m) => {
        errors.push(String(m));
        document.documentElement.dataset.errors = String(errors.length);
        const el = document.getElementById('err');
        if (el) { el.style.display = 'block'; el.textContent = errors.join('\n'); }
      };
      addEventListener('error', (e) => show(`${e.message} @ ${e.filename}:${e.lineno}`));
      addEventListener('unhandledrejection', (e) => show(`reject: ${e.reason?.stack ?? e.reason}`));
      const ce = console.error.bind(console);
      console.error = (...a) => { show(a.join(' ')); ce(...a); };
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">拖动旋转 · 滚轮缩放 · 点一个村民看档案 · 进入 VR 后扳机 / 捏合 = 重新摆到眼前 · <a href="roster.html" style="color:#f0d8c0">村民档案</a></div>
  <div id="clock"></div>
  <div id="card" hidden></div>
  <pre id="err"></pre>
  <script type="module" src="src/main.js"></script>
</body>
</html>
