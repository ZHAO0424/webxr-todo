<script type="module">
import * as THREE from 'three';

// ---------- 双语 ----------
const STR = {

  zh: {

    school: '鱼群', glow: '光点', time: '时间', best: '最高', largest: '最大鱼群',
    mute: '关声音', unmute: '开声音', lang: 'EN', hint: '移动手：引路 · 捏住不放：抱团',
  },

let lang = 'en';
try { lang = localStorage.getItem('swarm-lang') || (/^zh/i.test(navigator.language) ? 'zh' : 'en'); } catch (e) { lang = /^zh/i.test(navigator.language) ? 'zh' : 'en'; }

const FONT = () => lang === 'zh' ? '"PingFang SC","Microsoft YaHei",sans-serif' : '"Helvetica Neue","Segoe UI",Arial,sans-serif';
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('t-name').textContent = S().name;
  document.getElementById('t-alt').textContent = S().alt;
  document.getElementById('t-tag').textContent = S().tag;
  document.getElementById('t-how').innerHTML = S().how.map(s => `<li>${s}</li>`).join('');
  document.getElementById('lang').textContent = S().lang;
  document.getElementById('mute').textContent = muted ? S().unmute : S().mute;
  hudDirty = true; panelDirty = true;
}

// ---------- 渲染 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x01050a);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 40);
scene.add(new THREE.HemisphereLight(0x6fd0ff, 0x100818, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(0.3, 1, 0.5); scene.add(sun);

// 坐标（米）：观者在原点看 -z。鱼群在眼前 0.7–1.3 米的一块"水体"里游，引路的光点限制在 LX × LY 之内，
// 全部落在眼镜正前方 40°×24° 以内
const world = new THREE.Group(); scene.add(world);
const CZ = -1.0, CY = -0.02, LX = 0.33, LY = 0.15, LZ0 = -1.35, LZ1 = -0.7;

// ---------- 点精灵：鱼的光晕、浮游光点、火花、海雪全在一个 Points 里，每帧重写 ----------
// shape：0 圆点 · 3 环 · 4 柔光 · 5 针（沿运动方向拉长）
const PMAX = 6000;
const pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), pSize = new Float32Array(PMAX), pShape = new Float32Array(PMAX), pDir = new Float32Array(PMAX * 3), pA = new Float32Array(PMAX);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1)); pGeo.setAttribute('aShape', new THREE.BufferAttribute(pShape, 1));
pGeo.setAttribute('aDir', new THREE.BufferAttribute(pDir, 3)); pGeo.setAttribute('aA', new THREE.BufferAttribute(pA, 1));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 500 } },
  vertexShader: `
    attribute vec3 aColor, aDir; attribute float aSize, aShape, aA;
    uniform float uScale;
    varying vec3 vColor; varying float vShape, vA, vAng, vStretch;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vec4 p = projectionMatrix * mv;
      vec4 p2 = projectionMatrix * modelViewMatrix * vec4(position + aDir * 0.02, 1.0);
      vec2 d = p2.xy / p2.w - p.xy / p.w;
      d.x *= projectionMatrix[1][1] / projectionMatrix[0][0];
      vAng = atan(d.y, d.x);
      vStretch = clamp(length(d) * 60.0, 0.15, 1.0);
      gl_Position = p;
      gl_PointSize = aSize * uScale * projectionMatrix[1][1] / -mv.z;
      vColor = aColor; vShape = aShape; vA = aA;
    }`,
  fragmentShader: `
    varying vec3 vColor; varying float vShape, vA, vAng, vStretch;
    void main() {

      float ca = cos(vAng), sa = sin(vAng);
      vec2 q = vec2(ca * c.x + sa * c.y, -sa * c.x + ca * c.y);
      vec3 col; float r;
      if (vShape < 0.5) {
        r = length(c);
        float core = smoothstep(0.36, 0.22, r), glow = exp(-r * r * 4.0) * 0.6;
        col = vColor * glow + vec3(core) * 0.9;
      } else if (vShape < 3.5) {
        r = length(c);
        float ring = smoothstep(0.1, 0.0, abs(r - 0.72));
        col = vColor * ring * 1.3 + vec3(ring * 0.25);
      } else if (vShape < 4.5) {
        r = length(c); float a = exp(-r * r * 4.5);
        col = vColor * a * 1.3 + vec3(a * a * a * 0.4);
      } else {
        vec2 e = q * vec2(1.0, 1.0 + 5.0 * vStretch); r = length(e);
        float core = smoothstep(0.5, 0.2, r), glow = exp(-dot(e, e) * 1.2) * 0.6;
        col = vColor * glow * 1.3 + vec3(core);
      }
      col *= vA;
      if (max(col.r, max(col.g, col.b)) < 0.004) discard;
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const points = new THREE.Points(pGeo, pMat); points.frustumCulled = false; points.renderOrder = 10; world.add(points);
let pN = 0;
function P(x, y, z, c, size, shape, a = 1, dx = 0, dy = 0, dz = 0) {
  if (pN >= PMAX) return;
  const i = pN++;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pCol[i * 3] = c[0]; pCol[i * 3 + 1] = c[1]; pCol[i * 3 + 2] = c[2];
  pDir[i * 3] = dx; pDir[i * 3 + 1] = dy; pDir[i * 3 + 2] = dz;
  pSize[i] = size; pShape[i] = shape; pA[i] = a;
}
const C = {
  warm: [1.0, 0.82, 0.45], gold: [1.0, 0.75, 0.25], white: [1, 1, 1], mint: [0.4, 1.0, 0.85], cyan: [0.3, 0.85, 1.0],
  red: [1.0, 0.2, 0.32], pink: [1.0, 0.45, 0.85], violet: [0.75, 0.4, 1.0], deep: [0.15, 0.35, 0.6],
};

// ---------- 鱼：InstancedMesh；沿脊线放样的身体 + 背鳍 / 叉尾 / 胸鳍薄片；身体在顶点着色器里 S 形摆 ----------
// 模型里鱼头朝 +z，全长约 3 cm。uv.x = 沿身长 0(头)→1(尾)，uv.y = 绕身一圈；鳍的 uv.x 标成 1.5，uv.y = 0 根部 → 1 鳍缘
// 美术方向：深海生物发光——通透的身体、菲涅尔亮边、侧线发光点、暗环勾出的眼睛（定稿见 concept.html）
const FMAX = 360;
const fishGeo = (() => {
  const L = 0.03, SEG = 18, RAD = 10, pos = [], uv = [], idx = [];
  // 身形：钝圆的头 → 最宽处在 0.3 → 细细的尾柄
  const w = t => 0.0040 * (t < 0.3 ? Math.sqrt(Math.sin(t / 0.3 * Math.PI / 2)) : 0.18 + 0.82 * Math.pow(Math.cos((t - 0.3) / 0.7 * Math.PI / 2), 1.3)) + 0.0002;
  const h = t => w(t) * (1.45 - 0.5 * t);
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG, z = L * (0.42 - t);
    for (let j = 0; j <= RAD; j++) { const a = j / RAD * TAU; pos.push(Math.cos(a) * w(t), Math.sin(a) * h(t), z); uv.push(t, j / RAD); }
  }
  for (let i = 0; i < SEG; i++) for (let j = 0; j < RAD; j++) { const a = i * (RAD + 1) + j, b = a + RAD + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const fin = (verts, rim) => { const base = pos.length / 3; verts.forEach((v, k) => { pos.push(...v); uv.push(1.5, rim[k]); }); idx.push(base, base + 1, base + 2); if (verts.length === 4) idx.push(base, base + 2, base + 3); };
  fin([[0, 0.0055, 0.0035], [0, 0.0082, -0.0015], [0, 0.0046, -0.0055]], [0, 1, 0]);                         // 背鳍
  fin([[0, 0.0007, -0.0168], [0, 0.0062, -0.0245], [0, 0.0, -0.0205], [0, -0.0062, -0.0245]], [0, 1, 0.6, 1]); // 叉形尾鳍
  for (const s of [1, -1]) fin([[s * 0.0034, -0.0014, 0.0055], [s * 0.0064, -0.0036, 0.0015], [s * 0.0030, -0.0024, 0.0015]], [0, 1, 0]); // 胸鳍
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  g.scale(0.85, 0.85, 0.85); // 和原来的鱼一样长（约 3 cm 含尾）
  return g;
})();
const fCol = new Float32Array(FMAX * 3), fPh = new Float32Array(FMAX);
fishGeo.setAttribute('aColor', new THREE.InstancedBufferAttribute(fCol, 3));
fishGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(fPh, 1));
const fishMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uGather: { value: 0 } },
  vertexShader: `
    attribute vec3 aColor; attribute float aPhase;
    uniform float uTime;
    varying vec3 vColor, vN, vV; varying vec2 vUv;
    void main() {
      vec3 p = position; vUv = uv;
      // S 形摆动：从胸往尾传，越靠尾摆得越大、相位越落后
      float k = clamp((0.005 - p.z) / 0.027, 0.0, 1.0);
      p.x += sin(uTime * 14.0 + aPhase - p.z * 260.0) * 0.0034 * k * k;
      vec4 mv = modelViewMatrix * instanceMatrix * vec4(p, 1.0);
      vN = normalize(normalMatrix * mat3(instanceMatrix) * normal); vV = normalize(-mv.xyz);
      vColor = aColor; gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime, uGather;
    varying vec3 vColor, vN, vV; varying vec2 vUv;
    void main() {
      vec3 col;
      if (vUv.x > 1.2) { // 鳍：冷光薄膜，根部最亮、往鳍缘淡出，鳍缘一道细亮边
        float e = vUv.y;
        col = vColor * (0.26 * (1.0 - e) + 0.4 * smoothstep(0.85, 1.0, e));
      } else {
        float rim = 1.0 - abs(dot(vN, vV)), t = vUv.x;
        // 身体：通透的芯 + 菲涅尔亮边；头部偏暖、尾部偏冷；背深腹浅。
        // 亮度刻意压低：几十条鱼叠加时中心才不会过曝成一团死白（加法混合只会越叠越亮）
        float back = 0.5 + 0.5 * sin(vUv.y * 6.2832);
        vec3 base = mix(vColor * vec3(1.1, 1.05, 0.9), vColor * vec3(0.6, 0.85, 1.25), t);
        col = base * (0.035 + 0.12 * back + 0.62 * pow(rim, 2.6));
        // 侧线发光点：身体左右两侧中线（uv.y = 0 / 0.5 / 1）从鳃后到尾柄一串
        float side = min(min(abs(vUv.y), abs(vUv.y - 0.5)), abs(vUv.y - 1.0));
        float dots = smoothstep(0.04, 0.01, side) * smoothstep(0.2, 0.04, abs(fract(t * 10.0) - 0.5)) * smoothstep(0.15, 0.2, t) * smoothstep(0.85, 0.78, t);
        col += vec3(0.8, 1.0, 0.95) * dots * (0.65 + 0.25 * sin(uTime * 3.0 + t * 20.0)) * (1.0 - 0.4 * uGather);
        // 眼睛：亮点 + 一圈暗环（暗 = 透明，靠它勾出眼睛）
        float er = length(vec2((t - 0.075) * 2.2, side));
        col = col * smoothstep(0.05, 0.075, er) + vec3(0.95) * smoothstep(0.04, 0.015, er);
      }
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
});
const fishMesh = new THREE.InstancedMesh(fishGeo, fishMat, FMAX); fishMesh.frustumCulled = false; fishMesh.count = 0; world.add(fishMesh);

// 每条鱼的状态（紧凑数组：死一条就把最后一条挪过来）
const fp = new Float32Array(FMAX * 3), fv = new Float32Array(FMAX * 3), fo = new Float32Array(FMAX * 3), fbase = new Float32Array(FMAX * 3);
const fs = new Float32Array(FMAX), fb = new Float32Array(FMAX), fw = new Float32Array(FMAX), fdead = new Uint8Array(FMAX), fseen = new Int32Array(FMAX);
let nF = 0;
function addFish(x, y, z, flash = 0) {
  if (nF >= FMAX) return -1;
  const i = nF++, i3 = i * 3, a = rand(0, TAU);
  fp[i3] = x; fp[i3 + 1] = y; fp[i3 + 2] = z;
  fv[i3] = Math.cos(a) * 0.1; fv[i3 + 1] = rand(-0.02, 0.02); fv[i3 + 2] = Math.sin(a) * 0.1;
  // 每条鱼在鱼群里的"站位"：扁球里随机一点，鱼群绕着引路光转
  let ox, oy, oz; do { ox = rand(-1, 1); oy = rand(-1, 1); oz = rand(-1, 1); } while (ox * ox + oy * oy + oz * oz > 1);
  fo[i3] = ox; fo[i3 + 1] = oy * 0.6; fo[i3 + 2] = oz * 0.8;
  const gold = Math.random() < 0.04, c = new THREE.Color().setHSL(gold ? 0.11 : rand(0.44, 0.56), 0.85, gold ? 0.6 : rand(0.5, 0.62));
  fbase[i3] = c.r; fbase[i3 + 1] = c.g; fbase[i3 + 2] = c.b;
  fs[i] = rand(0.8, 1.2); fb[i] = flash; fw[i] = rand(0, 100); fPh[i] = rand(0, TAU); fdead[i] = 0; fseen[i] = 0;

}
function removeFish(i) {
  const j = --nF;
  if (i === j) return;
  for (const A of [fp, fv, fo, fbase]) A.copyWithin(i * 3, j * 3, j * 3 + 3);
  fs[i] = fs[j]; fb[i] = fb[j]; fw[i] = fw[j]; fPh[i] = fPh[j]; fdead[i] = fdead[j]; fseen[i] = fseen[j];
}
function killFish(i, c) {
  if (fdead[i]) return;
  fdead[i] = 1;
  const i3 = i * 3;
  spark(fp[i3], fp[i3 + 1], fp[i3 + 2], c || [fbase[i3], fbase[i3 + 1], fbase[i3 + 2]], 7, 0.12, 0.008, 0.6);
}

// 邻居查找用的均匀网格（计数排序）
const GC = 0.05, GX0 = -0.6, GY0 = -0.42, GZ0 = -1.7, NX = 24, NY = 17, NZ = 28, NCELL = NX * NY * NZ;
const cellStart = new Int32Array(NCELL + 1), cellFill = new Int32Array(NCELL), cellOf = new Int32Array(FMAX), order = new Int32Array(FMAX);
const gix = x => clamp(Math.floor((x - GX0) / GC), 0, NX - 1), giy = y => clamp(Math.floor((y - GY0) / GC), 0, NY - 1), giz = z => clamp(Math.floor((z - GZ0) / GC), 0, NZ - 1);
function buildGrid() {
  cellStart.fill(0);
  for (let i = 0; i < nF; i++) { const c = (giz(fp[i * 3 + 2]) * NY + giy(fp[i * 3 + 1])) * NX + gix(fp[i * 3]); cellOf[i] = c; cellStart[c + 1]++; }
  for (let c = 0; c < NCELL; c++) cellStart[c + 1] += cellStart[c];
  cellFill.set(cellStart.subarray(0, NCELL));
  for (let i = 0; i < nF; i++) order[cellFill[cellOf[i]]++] = i;
}

// ---------- 掠食者 · X 光画法：没有实心身体（黑 = 透明，实心黑身还会写深度把后面的鱼挖掉）；
// 外壳只亮边缘（菲涅尔）+ 脊椎 / 肋骨 / 鳍骨发光。uHot 0→1 = 平常 → 蓄力 / 冲刺，整只变亮 ----------
const shellMat = (col) => new THREE.ShaderMaterial({
  uniforms: { uCol: { value: new THREE.Color(col) }, uHot: { value: 0 } },
  vertexShader: `varying vec3 vN, vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uCol; uniform float uHot; varying vec3 vN, vV;
    void main(){ float rim = 1.0 - abs(dot(vN, vV)); gl_FragColor = vec4(uCol * (0.03 + (0.9 + 0.8 * uHot) * pow(rim, 3.0)), 1.0);
    #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
});
const boneMat = col => new THREE.MeshBasicMaterial({ color: col, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
const bone = (pts, r, mat) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), Math.max(4, pts.length * 3), r, 5), mat);
function makePike() {
  // 狗鱼：长身子，头朝 +z，全长约 0.3 米（再整体缩 0.65）
  const g = new THREE.Group(), red = 0xff3a5c, sh = shellMat(red), rib = boneMat(red), spineM = boneMat(0xffa060);
  const body = new THREE.SphereGeometry(1, 28, 16); body.scale(0.022, 0.028, 0.115); g.add(new THREE.Mesh(body, sh));

// ---------- 游戏状态 ----------
let state = 'title', score = 0, best = 0, bites = 0, gameT = 0, largest = 0, lungeId = 0;
try { best = +localStorage.getItem('swarm-best') || 0; } catch (e) { }
const lure = { x: 0, y: CY, z: CZ, tx: 0, ty: CY, tz: CZ, g: 0 };
let gather = false;
const motes = [], parts = [], pikes = [], jellies = [], eels = [], threats = [];
const snow = Array.from({ length: 260 }, () => ({ x: rand(-1.2, 1.2), y: rand(-0.7, 0.7), z: rand(-3, -0.5), s: rand(0.002, 0.005), ph: rand(0, TAU) }));

function spark(x, y, z, c, n, sp = 0.1, size = 0.008, life = 0.6) {

    const l = life * rand(0.5, 1.2);

// 浮游光点：一团一团从水里冒出来，慢慢漂；金色的稀有，值 5 口
function spawnBloom(gold = false) {
  if (motes.length > 140) return;
  const cx = rand(-LX, LX) * 0.9, cy = CY + rand(-LY, LY) * 0.9, cz = rand(LZ0, LZ1);
  const n = gold ? 1 : 5 + (Math.random() * 8 | 0);
  for (let k = 0; k < n; k++) motes.push({ x: cx + rand(-0.04, 0.04), y: cy + rand(-0.03, 0.03), z: cz + rand(-0.04, 0.04), ph: rand(0, TAU), t: 0, life: gold ? 20 : rand(14, 18), gold });
}
function eat(m, i) {
  m.dead = true;
  const v = m.gold ? 5 : 1;
  score += v; bites += v; hudDirty = true;
  spark(m.x, m.y, m.z, m.gold ? C.gold : C.warm, m.gold ? 18 : 4, m.gold ? 0.15 : 0.06, 0.007, 0.5);
  sfx.eat(m.gold);

  while (bites >= 5) {
    bites -= 5;
    if (nF < cap && addFish(fp[i * 3], fp[i * 3 + 1], fp[i * 3 + 2], 1) >= 0) { sfx.birth(); largest = Math.max(largest, nF); }
  }
}

// 狗鱼：游到鱼群侧面 → 蓄势（眼睛变亮、红线预警）→ 横着冲过鱼群 → 回到深处
function spawnPike(s) {
  s = s || (Math.random() < 0.5 ? -1 : 1);
  pikes.push({ g: makePike(), x: s * 0.8, y: CY + rand(-0.1, 0.1), z: -2.6, v: new V3(-s * 0.1, 0, 0.3), s, st: 'approach', t: 0, eaten: 0, id: 0, dir: new V3(), face: new V3(-s, 0, 1) });
}
function updatePike(p, dt) {
  p.t += dt;
  const pos = new V3(p.x, p.y, p.z);
  if (p.st === 'approach') {
    const tgt = new V3(school.x + p.s * 0.3, school.y + 0.02, school.z - 0.04);
    const d = tgt.clone().sub(pos), dl = d.length();
    p.v.lerp(d.normalize().multiplyScalar(Math.min(0.55, dl * 2 + 0.08)), Math.min(1, dt * 2));
    p.face.copy(p.v);
    if (dl < 0.05 || p.t > 9) { p.st = 'windup'; p.t = 0; sfx.growl(); }
  } else if (p.st === 'windup') {
    p.v.multiplyScalar(1 - Math.min(1, dt * 4));
    p.face.copy(school).sub(pos);
    if (p.t > 0.8) {
      // 冲的方向：瞄鱼群中心，再提前一点点
      p.dir.copy(school).addScaledVector(schoolV, 0.3).sub(pos); p.dir.y *= 0.5; p.dir.normalize();
      p.st = 'lunge'; p.t = 0; p.id = ++lungeId; p.eaten = 0; sfx.lunge();
    }
  } else if (p.st === 'lunge') {
    p.v.lerp(p.dir.clone().multiplyScalar(1.15), Math.min(1, dt * 10));
    p.face.copy(p.v);
    // 嘴附近的鱼：散着的几乎跑不掉，抱成团的大多咬不到
    const mx = p.x + p.dir.x * 0.085, my = p.y + p.dir.y * 0.085, mz = p.z + p.dir.z * 0.085;
    const chance = lure.g > 0.5 ? 0.1 : 0.85, cap = lure.g > 0.5 ? 2 : 10;
    for (let i = 0; i < nF && p.eaten < cap; i++) {
      if (fdead[i] || fseen[i] === p.id) continue;
      const dx = fp[i * 3] - mx, dy = fp[i * 3 + 1] - my, dz = fp[i * 3 + 2] - mz;
      if (dx * dx + dy * dy + dz * dz < 0.045 * 0.045) {
        fseen[i] = p.id;
        if (Math.random() < chance) { killFish(i, C.red); p.eaten++; sfx.gulp(); }
      }
    }
    if (p.t > 0.7) { p.st = 'leave'; p.t = 0; }
  } else {
    const want = new V3(p.dir.x || p.s, 0.1, -0.9).normalize().multiplyScalar(0.6);
    p.v.lerp(want, Math.min(1, dt * 1.5));
    p.face.copy(p.v);
  }
  // 别冲到脸上
  if (p.z > -0.6) p.v.z -= dt * 3;
  p.x += p.v.x * dt; p.y += p.v.y * dt; p.z += p.v.z * dt;
  p.g.position.set(p.x, p.y, p.z);
  if (p.face.lengthSq() > 1e-6) p.g.lookAt(p.g.position.clone().add(p.face));
  // 蓄力时外壳和骨头一闪一闪地变亮，冲刺时最亮：在眼镜上一眼看出「它要来了」
  const hot = p.st === 'windup' ? 0.6 + 0.4 * Math.sin(p.t * 30) : p.st === 'lunge' ? 1 : 0;
  p.g.userData.shell.uniforms.uHot.value = hot;
  for (const m of p.g.userData.bones) m.opacity = 0.75 + 0.25 * hot;
  if (p.st === 'windup' || p.st === 'lunge') threats.push({ x: p.x + p.face.x * 0.07, y: p.y, z: p.z + p.face.z * 0.07, r: 0.17, k: 2.4 });
  return p.st === 'leave' && (p.z < -2.8 || Math.abs(p.x) > 1.4);
}

// 水母：从下往上一张一缩地漂；碰到伞和触须的鱼会被蜇死，鱼会稍微躲
function spawnJelly() {
  jellies.push({ g: makeJelly(), x: clamp(school.x + rand(-0.15, 0.15), -LX, LX), y: CY - 0.3, z: clamp(school.z + rand(-0.15, 0.15), LZ0, LZ1), vx: rand(-0.015, 0.015), t: 0, ph: rand(0, TAU) });
}
function updateJelly(j, dt) {
  j.t += dt;
  const pulse = Math.max(0, Math.sin(j.t * 2.2 + j.ph));
  j.y += (0.012 + 0.05 * pulse) * dt; j.x += j.vx * dt;
  const s = Math.sin(j.t * 2.2 + j.ph);
  j.g.position.set(j.x, j.y, j.z); j.g.scale.set(1 + 0.1 * s, 1 - 0.12 * s, 1 + 0.1 * s);
  for (let i = 0; i < nF; i++) {

    const dy = fp[i * 3 + 1] - j.y, dx = fp[i * 3] - j.x, dz = fp[i * 3 + 2] - j.z;
    if (dy < 0.02 && dy > -0.09 && dx * dx + dz * dz < 0.024 * 0.024) { killFish(i, C.pink); sfx.sting(); }
  }

// 海鳗：先在那一层亮一条红色虚线预警，然后从一侧横扫过去，身子碰到的鱼都没了
function spawnEel() {
  const s = Math.random() < 0.5 ? -1 : 1;
  eels.push({ s, y: clamp(school.y, CY - LY, CY + LY), z: clamp(school.z, LZ0, LZ1), x: -s * 0.75, t: 0, warn: 1.6, hist: [] });
  sfx.eelWarn();
}
function updateEel(e, dt) {
  e.t += dt;
  if (e.t < e.warn) return false;
  e.x += e.s * 0.85 * dt;
  const y = e.y + Math.sin(e.t * 7) * 0.022;
  e.hist.unshift([e.x, y, e.z]); if (e.hist.length > 44) e.hist.pop();
  for (let k = 0; k < e.hist.length; k += 3) {
    const h = e.hist[k];
    for (let i = 0; i < nF; i++) {
      if (fdead[i]) continue;
      const dx = fp[i * 3] - h[0], dy = fp[i * 3 + 1] - h[1], dz = fp[i * 3 + 2] - h[2];
      if (dx * dx + dy * dy + dz * dz < 0.02 * 0.02) { killFish(i, C.violet); sfx.gulp(); }
    }
  }
  threats.push({ x: e.x + e.s * 0.03, y, z: e.z, r: 0.13, k: 2.6 });
  const tail = e.hist[e.hist.length - 1];
  return e.s * tail[0] > 0.8;
}

// ---------- 鱼群行为（boids）：对齐 + 聚拢 + 分开 + 跟着引路光的站位 + 找吃的 + 躲危险 ----------
const _m = new THREE.Matrix4(), _d = new V3(), _s = new V3(), O3 = new V3(), UP = new V3(0, 1, 0);
function updateFish(dt, t) {
  buildGrid();
  const g = lure.g, n = nF, sq = Math.sqrt(n / 60);
  const R = (0.065 + 0.035 * sq) * (1 - g) + (0.016 + 0.01 * sq) * g;
  const spin = t * (0.3 + 1.4 * g), cs = Math.cos(spin), sn = Math.sin(spin);
  const sepR = 0.014 - 0.006 * g, NR = 0.045, maxV = 0.4 - 0.1 * g, steer = 2 + 3 * g, feed = g < 0.5;
  let sx = 0, sy = 0, sz = 0, svx = 0, svy = 0, svz = 0;
  for (let i = 0; i < n; i++) {
    const i3 = i * 3, px = fp[i3], py = fp[i3 + 1], pz = fp[i3 + 2];
    let vx = fv[i3], vy = fv[i3 + 1], vz = fv[i3 + 2];
    let cnt = 0, avx = 0, avy = 0, avz = 0, cx = 0, cy = 0, cz = 0, ex = 0, ey = 0, ez = 0;
    const ix = gix(px), iy = giy(py), iz = giz(pz);
    for (let z = Math.max(0, iz - 1); z <= Math.min(NZ - 1, iz + 1); z++)
      for (let y = Math.max(0, iy - 1); y <= Math.min(NY - 1, iy + 1); y++)
        for (let x = Math.max(0, ix - 1); x <= Math.min(NX - 1, ix + 1); x++) {
          const c = (z * NY + y) * NX + x;
          for (let k = cellStart[c]; k < cellStart[c + 1] && cnt < 14; k++) {
            const j = order[k]; if (j === i) continue;
            const j3 = j * 3, dx = px - fp[j3], dy = py - fp[j3 + 1], dz = pz - fp[j3 + 2], d2 = dx * dx + dy * dy + dz * dz;
            if (d2 > NR * NR) continue;
            cnt++; avx += fv[j3]; avy += fv[j3 + 1]; avz += fv[j3 + 2]; cx += fp[j3]; cy += fp[j3 + 1]; cz += fp[j3 + 2];
            if (d2 < sepR * sepR) { const d = Math.sqrt(d2) + 1e-5, w = (sepR - d) / sepR / d; ex += dx * w; ey += dy * w; ez += dz * w; }
          }
        }
    let ax = 0, ay = 0, az = 0;
    if (cnt) {
      ax += (avx / cnt - vx) * 1.2; ay += (avy / cnt - vy) * 1.2; az += (avz / cnt - vz) * 1.2;
      const coh = 1.0 * (1 - g); ax += (cx / cnt - px) * coh; ay += (cy / cnt - py) * coh; az += (cz / cnt - pz) * coh;
    }
    ax += ex * 0.8; ay += ey * 0.8; az += ez * 0.8;
    // 站位：引路光 + 自己的偏移（偏移绕竖轴转，抱团时转得快，像真的饵球）
    const ox = fo[i3] * R, oy = fo[i3 + 1] * R, oz = fo[i3 + 2] * R;
    const tx = lure.x + ox * cs - oz * sn - px, ty = lure.y + oy - py, tz = lure.z + ox * sn + oz * cs - pz;
    const td = Math.hypot(tx, ty, tz) + 1e-6, want = Math.min(maxV, td * 3);
    ax += (tx / td * want - vx) * steer; ay += (ty / td * want - vy) * steer; az += (tz / td * want - vz) * steer;
    // 闲游：散开时每条鱼自己晃
    const w = fw[i];
    ax += Math.sin(t * 1.3 + w) * 0.25 * (1 - g); ay += Math.sin(t * 1.7 + w * 1.3) * 0.1; az += Math.cos(t * 1.1 + w * 0.7) * 0.25 * (1 - g);
    // 找吃的：附近 10 cm 内最近的光点
    if (feed) {
      let bm = null, bd = 0.1 * 0.1;
      for (const m of motes) {
        if (m.dead) continue;
        const dx = m.x - px, dy = m.y - py, dz = m.z - pz, d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < bd) { bd = d2; bm = m; }
      }
      if (bm) {
        const d = Math.sqrt(bd) + 1e-6;
        if (d < 0.014) eat(bm, i);
        else { ax += (bm.x - px) / d * 1.8; ay += (bm.y - py) / d * 1.8; az += (bm.z - pz) / d * 1.8; }
      }
    }
    // 躲：离危险越近推得越狠；抱团时只躲一点，靠阵型扛
    for (const h of threats) {
      const dx = px - h.x, dy = py - h.y, dz = pz - h.z, d = Math.hypot(dx, dy, dz) + 1e-6;
      if (d < h.r) { const f = h.k * (1 - d / h.r) * (1 - 0.65 * g) / d; ax += dx * f; ay += dy * f; az += dz * f; }
    }
    // 水体软边界，离脸太近往回推
    if (px < -0.5) ax += (-0.5 - px) * 10; else if (px > 0.5) ax += (0.5 - px) * 10;
    if (py < CY - 0.3) ay += (CY - 0.3 - py) * 10; else if (py > CY + 0.3) ay += (CY + 0.3 - py) * 10;
    if (pz > -0.6) az += (-0.6 - pz) * 14; else if (pz < -1.6) az += (-1.6 - pz) * 10;
    vx += ax * dt; vy += ay * dt; vz += az * dt;
    const sp = Math.hypot(vx, vy, vz), cl = clamp(sp, 0.05, maxV) / (sp || 1);
    vx *= cl; vy *= cl; vz *= cl;
    fv[i3] = vx; fv[i3 + 1] = vy; fv[i3 + 2] = vz;
    fp[i3] = px + vx * dt; fp[i3 + 1] = py + vy * dt; fp[i3 + 2] = pz + vz * dt;
    sx += px; sy += py; sz += pz; svx += vx; svy += vy; svz += vz;
  }
  if (n) { school.set(sx / n, sy / n, sz / n); schoolV.set(svx / n, svy / n, svz / n); }
  else school.set(lure.x, lure.y, lure.z);
  for (let i = nF - 1; i >= 0; i--) if (fdead[i]) removeFish(i);
}
function drawFish(dt) {
  for (let i = 0; i < nF; i++) {
    const i3 = i * 3, px = fp[i3], py = fp[i3 + 1], pz = fp[i3 + 2];
    fb[i] = Math.max(0, fb[i] - dt * 1.2);
    const b = (1 + fb[i] * 1.2) * (1 - 0.35 * lure.g);
    fCol[i3] = fbase[i3] * b; fCol[i3 + 1] = fbase[i3 + 1] * b; fCol[i3 + 2] = fbase[i3 + 2] * b;
    _m.lookAt(O3, _d.set(-fv[i3], -fv[i3 + 1], -fv[i3 + 2]), UP);
    _m.scale(_s.setScalar(fs[i] * (1 + fb[i] * 0.4)));
    _m.setPosition(px, py, pz);
    fishMesh.setMatrixAt(i, _m);
    // 每条鱼一团淡光晕；鱼越多越淡，免得鱼群中心叠成一团死白
    P(px, py, pz, [fbase[i3], fbase[i3 + 1], fbase[i3 + 2]], 0.022 * fs[i], 4, (0.05 / (1 + nF / 120) + fb[i] * 0.25) * (1 - 0.6 * lure.g));
  }
  fishMesh.count = nF;
  fishMesh.instanceMatrix.needsUpdate = true;
  fishGeo.attributes.aColor.needsUpdate = true; fishGeo.attributes.aPhase.needsUpdate = true;
}

// ---------- 开局 / 每帧更新 ----------
function clearHunters() {
  for (const p of pikes) dropMesh(p.g); for (const j of jellies) dropMesh(j.g);
  pikes.length = jellies.length = eels.length = 0;
}
function startGame() {
  clearHunters();
  for (let i = 0; i < nF; i++) killFish(i);
  nF = 0;
  Object.assign(lure, { tx: 0, ty: CY, tz: CZ });
  for (let i = 0; i < 30; i++) addFish(lure.x + rand(-0.05, 0.05), lure.y + rand(-0.03, 0.03), lure.z + rand(-0.05, 0.05), 0.6);
  score = 0; bites = 0; gameT = 0; largest = nF; resetDirector();
  state = 'play'; hudDirty = true; panelDirty = true; anchor.set = false;
  sfx.start();
}
function endGame() {
  state = 'over'; overT = 0; panelDirty = true; hudDirty = true; flash = 0.4;
  if (score > best) { best = score; try { localStorage.setItem('swarm-best', best); } catch (e) { } }
  sfx.over();
}
function update(dt, t) {
  if (state === 'play') gameT += dt;
  // 导演：光点一直有；掠食者只在游戏里来，越往后越多
  dir.bloom -= dt; if (dir.bloom <= 0) { spawnBloom(); dir.bloom = rand(1.2, 2.0); }
  if (state === 'play') {
    dir.gold -= dt; if (dir.gold <= 0) { spawnBloom(true); dir.gold = rand(16, 24); }
    dir.pike -= dt;
    if (dir.pike <= 0) { spawnPike(); if (gameT > 100 && Math.random() < 0.5) spawnPike(-pikes[pikes.length - 1].s); dir.pike = Math.max(5, 13 - gameT / 25) + rand(0, 3); }
    if (gameT > 35) { dir.jelly -= dt; if (dir.jelly <= 0) { if (jellies.length < Math.min(3, 1 + (gameT / 70 | 0))) spawnJelly(); dir.jelly = rand(6, 10); } }
    if (gameT > 80) { dir.eel -= dt; if (dir.eel <= 0) { spawnEel(); dir.eel = Math.max(9, 18 - (gameT - 80) / 20) + rand(0, 4); } }
  } else if (state === 'title') {
    // 标题画面：光自己慢慢画圈，鱼群跟着游；鱼少了补上
    lure.tx = Math.sin(t * 0.4) * 0.24; lure.ty = CY + Math.sin(t * 0.63) * 0.1; lure.tz = CZ + Math.sin(t * 0.3) * 0.12;
    while (nF < 40) addFish(rand(-0.3, 0.3), CY + rand(-0.1, 0.1), CZ + rand(-0.2, 0.2));
  }
  // 引路光：平滑跟随；抱团程度平滑过渡
  const k = Math.min(1, dt * 7);
  lure.x += (lure.tx - lure.x) * k; lure.y += (lure.ty - lure.y) * k; lure.z += (lure.tz - lure.z) * k;
  const wasG = lure.g > 0.5;
  lure.g += (((gather && state === 'play') ? 1 : 0) - lure.g) * Math.min(1, dt * 5);
  if ((lure.g > 0.5) !== wasG) sfx.gather(lure.g > 0.5);

  const l = world.worldToLocal(handPos(i));
  // 第一次看到手：此刻手的位置对应光现在的位置
  if (!anchor.set) Object.assign(anchor, { set: true, x: l.x - lure.tx / GAIN, y: l.y - (lure.ty - CY) / GAIN, z: l.z - (lure.tz - CZ) / GAIN });
  const tx = (l.x - anchor.x) * GAIN, ty = CY + (l.y - anchor.y) * GAIN, tz = CZ + (l.z - anchor.z) * GAIN;
  const cx = clamp(tx, -LX, LX), cy = clamp(ty, CY - LY, CY + LY), cz = clamp(tz, LZ0, LZ1);
  // 顶到边上时把基准跟着挪，手往回一动光就离开边
  anchor.x += (tx - cx) / GAIN; anchor.y += (ty - cy) / GAIN; anchor.z += (tz - cz) / GAIN;
  if (state === 'play' || state === 'over') { lure.tx = cx; lure.ty = cy; lure.tz = cz; }
}
// 桌面：鼠标指到哪，光就去哪；按住鼠标 / 空格 抱团；滚轮调远近；WASD / 方向键也能动
const rc = new THREE.Raycaster(), ndc = new THREE.Vector2(); let mouseOn = false, mouseDown = false, lastMouse = -1e9;
const keys = new Set();
const cv = renderer.domElement;
cv.addEventListener('contextmenu', e => e.preventDefault());
// 头显里也能用鼠标：点一下锁住指针，之后鼠标的相对移动推着光走（每像素 0.6 mm，和 Webspace 的鼠标模式一致：锁进眼镜）
const MOUSE_XR = 0.0006;
cv.addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting) {
    if (document.pointerLockElement !== cv || state === 'title') return;
    lure.tx = clamp(lure.tx + e.movementX * MOUSE_XR, -LX, LX); lure.ty = clamp(lure.ty - e.movementY * MOUSE_XR, CY - LY, CY + LY);
    lastMouse = performance.now(); return;
  }
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); mouseOn = true;
});
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (renderer.xr.isPresenting) {
    if (document.pointerLockElement !== cv) { try { cv.requestPointerLock(); } catch (er) { } }
    lastMouse = performance.now();
  } else { ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); mouseOn = true; }
  if (state !== 'play') { tryStart(); return; }
  mouseDown = true;
});
addEventListener('pointerup', () => { mouseDown = false; });
cv.addEventListener('wheel', e => { e.preventDefault(); lure.tz = clamp(lure.tz + e.deltaY * 0.0004, LZ0, LZ1); }, { passive: false });
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'Space') { e.preventDefault(); initAudio(); if (state !== 'play' && !e.repeat) tryStart(); }
  if (e.code === 'KeyR' && renderer.xr.isPresenting) { needPlace = true; anchor.set = false; }
  if (/^(Arrow|Key[WASDQE])/.test(e.code)) mouseOn = false;
});
addEventListener('keyup', e => keys.delete(e.code));
const lPlane = new THREE.Plane(new V3(0, 0, 1), 0);
// 键盘移动光（桌面和头显共用）；返回这一帧有没有按方向键
function keyMove(dt) {
  if (state === 'title') return false;
  let kx = 0, ky = 0, kz = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) kx--;
  if (keys.has('KeyD') || keys.has('ArrowRight')) kx++;
  if (keys.has('KeyW') || keys.has('ArrowUp')) ky++;
  if (keys.has('KeyS') || keys.has('ArrowDown')) ky--;
  if (keys.has('KeyQ')) kz--;
  if (keys.has('KeyE')) kz++;
  if (!(kx || ky || kz)) return false;
  lure.tx = clamp(lure.tx + kx * 0.3 * dt, -LX, LX); lure.ty = clamp(lure.ty + ky * 0.3 * dt, CY - LY, CY + LY); lure.tz = clamp(lure.tz + kz * 0.3 * dt, LZ0, LZ1);
  return true;
}
function deskControl(dt) {
  gather = mouseDown || keys.has('Space');
  if (state === 'title' || keyMove(dt) || !mouseOn) return;
  rc.setFromCamera(ndc, camera); lPlane.constant = -lure.tz;
  const q = rc.ray.intersectPlane(lPlane, new V3()); if (!q) return;
  lure.tx = clamp(q.x, -LX, LX); lure.ty = clamp(q.y, CY - LY, CY + LY);
}

document.getElementById('lang').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; try { localStorage.setItem('swarm-lang', lang); } catch (e) { } applyLang(); };
document.getElementById('mute').onclick = () => {
  muted = !muted; try { localStorage.setItem('swarm-mute', muted ? '1' : '0'); } catch (e) { }
  initAudio(); OUT.gain.setTargetAtTime(muted ? 0 : 0.8, AC.currentTime, 0.05); applyLang();
};

// ---------- XR 摆放 ----------
let needPlace = false, placeWait = 0;
renderer.xr.addEventListener('sessionstart', () => { needPlace = true; placeWait = 0; anchor.set = false; document.getElementById('card').style.opacity = 0; document.getElementById('btns').style.opacity = 0; });
renderer.xr.addEventListener('sessionend', () => { world.position.set(0, 0, 0); world.rotation.set(0, 0, 0); document.getElementById('card').style.opacity = 1; document.getElementById('btns').style.opacity = 1; onResize(); });
function place() {
  const cam = renderer.xr.getCamera(), p = new V3().setFromMatrixPosition(cam.matrixWorld);
  const d = new V3(0, 0, -1).transformDirection(cam.matrixWorld);
  world.position.copy(p); world.rotation.set(0, Math.atan2(-d.x, -d.z), 0); needPlace = false; anchor.set = false;
}

// ---------- 桌面后处理 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// bloom 只是桌面上的锦上添花：发光已经做进材质，关掉它画面也成立（眼镜里本来就没有后处理）
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.2, 0.4, 0.6);
composer.addPass(bloom); composer.addPass(new OutputPass());
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 64 : 30;
  // 宽屏：整幅画面往右挪一点，让开左边的说明文字
  if (innerWidth > 900) camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.1, 0, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize); onResize();

applyLang();
const clock = new THREE.Clock();
// 测量：每帧 CPU 用时（更新 + 提交渲染），环形缓冲 300 帧，__swarm.perf() 读均值 / p95
const perfBuf = new Float32Array(300); let perfI = 0, perfN = 0;
renderer.setAnimationLoop(() => {
  const t0 = performance.now();
  loop();
  perfBuf[perfI] = performance.now() - t0; perfI = (perfI + 1) % 300; perfN = Math.min(300, perfN + 1);
});
function loop() {
  const dt = Math.min(1 / 30, clock.getDelta()), t = clock.elapsedTime, xr = renderer.xr.isPresenting;
  if (needPlace && xr && ++placeWait > 5) place();
  if (!xr) { camera.position.set(0, 0, 0); camera.lookAt(0, CY * 0.5, -1); }
  world.updateMatrixWorld();
  if (xr) xrControl(dt); else deskControl(dt);
  if (state === 'over') overT += dt;
  update(dt, t);
  fishMat.uniforms.uTime.value = t; fishMat.uniforms.uGather.value = lure.g;
  draw(t, dt);
  hudT -= dt;
  if (state === 'play' && hudT <= 0) hudDirty = true;
  if (hudDirty && hudT <= 0) { drawHud(); hudDirty = false; hudT = 0.25; }
  if (state !== 'play' || panelDirty) { drawPanel(t); panelDirty = false; }
  panel.m.visible = state !== 'play';
  // 点大小按竖直方向算（着色器乘 projectionMatrix[1][1]），所以这里取视口高度的一半；XR 以前取的是宽度，点会大约 1.8 倍
  pMat.uniforms.uScale.value = xr ? ((renderer.xr.getCamera().cameras[0] || {}).viewport || { h: 1200 }).h / 2 : renderer.domElement.height / 2;
  if (xr) renderer.render(scene, camera); else composer.render();
}

// 测试用
const perf = () => {
  const a = Array.from(perfBuf.subarray(0, perfN)).sort((x, y) => x - y);
  return { frames: perfN, avgMs: +(a.reduce((s, x) => s + x, 0) / (a.length || 1)).toFixed(2), p95Ms: +(a[Math.floor(a.length * 0.95)] || 0).toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, points: pN, fish: nF };
};
// 面板隐藏时 rAF 不跑：bench(n) 同步跑 n 帧（只计 CPU，不含 GPU），每帧之间 gl.finish 防止命令堆积
const bench = n => { const gl = renderer.getContext(); perfN = 0; perfI = 0; for (let k = 0; k < n; k++) { const t0 = performance.now(); loop(); gl.finish(); perfBuf[perfI] = performance.now() - t0; perfI = (perfI + 1) % 300; perfN = Math.min(300, perfN + 1); } return perf(); };
window.__swarm = { perf, bench, fill: n => { while (nF < Math.min(n, FMAX)) addFish(lure.x + rand(-0.08, 0.08), lure.y + rand(-0.05, 0.05), lure.z + rand(-0.08, 0.08)); }, get state() { return state; }, get fish() { return nF; }, get score() { return score; }, lure, startGame, spawnPike, spawnJelly, spawnEel, spawnBloom, pikes, motes, jump: s => { gameT = s; }, get gather() { return lure.g; } };
</script>
</body>
</html>
