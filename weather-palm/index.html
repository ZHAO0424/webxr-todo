  #err { position: fixed; left: 10px; bottom: 70px; max-width: 70vw; color: #ff9a8a; font-size: 11px; white-space: pre-wrap; display: none; background: #200c0ccc; padding: 8px; font-family: monospace; }

  @media (max-width: 760px) { #card { left: 12px; right: 12px; top: 12px; max-width: none; } #card h1 { font-size: 24px; } #card p, #card ul { display: none; } #status { display: none; } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

import { HandTracker, pose, synthHand, features, JOINTS, CFG } from './gesture.js';
import * as S from './sim.js';
import * as A from './art.js';
import * as MT from './matter.js';
const { H } = A;

const V3 = THREE.Vector3, TAU = Math.PI * 2, clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const Q = new URLSearchParams(location.search);
const TEST = Q.has('test') || Q.has('selftest') || Q.has('scene');
const DEBUG = Q.has('debug');
let rs = 12345; const rand = (a = 0, b = 1) => { rs = (rs * 16807) % 2147483647; return a + (rs / 2147483647) * (b - a); };
const { R, PLINTH, LAYOUT: L } = S;

// ---------- 双语 ----------
const STR = {
  zh: {
    name: '掌心气象台', alt: 'WEATHER IN YOUR PALM', tag: '桌上一座荒岛：沙丘、红土、碎石，只有山泉还在流。你是巨人，手就是天气——下雨、晒太阳、撒种子，让它一点点活过来。',
    how: ['手掌朝下悬在岛上 —— 下雨（停得越久雨越大，手移云跟着走）', '掌心朝上摊开 —— 放晴', '手立起来横扫 —— 刮风', '握拳蓄力再张开 —— 打雷', '左手掌心朝向自己 —— 打开道具菜单（水、食物、雪、雾霾、旋风、岩浆、闪电、沙、树种、花种、鱼苗、萤火虫），右手指尖点一下选中', '右手立起来、指尖朝下停住 —— 把选中的东西放出去', '手挡住太阳 —— 投下手影',
      '电脑：选工具后左键按住；右键放晴；按住快拖刮风；Shift 按住再松开打雷；中键转视角、滚轮缩放'],
    tools: ['雨', '晴', '风', '雷', '水', '食物', '雪', '雾霾', '旋风', '岩浆', '闪电', '沙', '树种', '花种', '鱼苗', '萤火虫'], lang: 'EN', mute: '静音', unmute: '声音', reset: '重来',
    status: (w) => `第 ${Math.floor(w.t / S.DAY_LEN) + 1} 天 · ${S.isNight(w) ? '夜' : '昼'} · 生灵 ${w.animals.length} · 等级 ${w.level}/${S.MAX_LEVEL} · 水位 ${Math.round(w.water * 100)}%${w.drought ? ' · 干旱' : ''}${w.flood ? ' · 涨水' : ''}`,
    confirmReset: '把小岛恢复到第一天？',
  },
  en: {
    name: 'WEATHER IN YOUR PALM', alt: '掌心气象台', tag: 'A barren island on your desk: dunes, red clay, scree — only the springs still flow. You are the giant; your hand is the weather. Rain, sun and seeds bring it back to life.',
    how: ['Hold your palm down over the island — rain (longer = heavier; the cloud follows your hand)', 'Open your palm upward — clear skies', 'Sweep a raised hand sideways — wind', 'Make a fist, then open it — lightning', 'Turn your left palm toward you — tool menu (water, food, snow, smog, whirlwind, lava, lightning, sand, tree seeds, flowers, fish, fireflies); tap one with your right fingertip', 'Right hand raised, fingertips down, hold — release the selected thing', 'Block the sun — your hand casts a shadow',
      'Desktop: pick a tool, hold left; right = sun; fast left-drag = wind; Shift-hold then release = thunder; middle-drag to orbit, wheel to zoom'],
    tools: ['Rain', 'Sun', 'Wind', 'Storm', 'Water', 'Food', 'Snow', 'Smog', 'Whirl', 'Lava', 'Bolt', 'Sand', 'Tree', 'Flower', 'Fish', 'Firefly'], lang: '中文', mute: 'Mute', unmute: 'Sound', reset: 'Reset',
    status: (w) => `Day ${Math.floor(w.t / S.DAY_LEN) + 1} · ${S.isNight(w) ? 'night' : 'day'} · creatures ${w.animals.length} · level ${w.level}/${S.MAX_LEVEL} · water ${Math.round(w.water * 100)}%${w.drought ? ' · drought' : ''}${w.flood ? ' · flood' : ''}`,
    confirmReset: 'Reset the island to day one?',
  },
};
let lang; try { lang = localStorage.getItem('pf-lang') || (/^zh/i.test(navigator.language) ? 'zh' : 'en'); } catch (e) { lang = 'zh'; }
if (!STR[lang]) lang = 'zh';
let tool = 0;   // 桌面左键的工具：0 雨 1 晴 2 风 3 雷 4 岩浆 5 沙 6 种子
const POUR = S.TOOLS;   // 左手菜单里的 12 样东西
let pourKind = 'water';   // 右手放出去的是哪一样（XR：左手菜单选；桌面：底部工具栏选）
function applyLang() {
  const s = STR[lang];
  document.getElementById('t-name').textContent = s.name; document.getElementById('t-alt').textContent = s.alt;
  document.getElementById('t-tag').textContent = s.tag;
  document.getElementById('t-how').innerHTML = s.how.map(h => `<li>${h}</li>`).join('');
  document.getElementById('lang').textContent = s.lang; document.getElementById('reset').textContent = s.reset;
  document.getElementById('mute').textContent = muted ? s.unmute : s.mute;
  document.getElementById('tools').innerHTML = s.tools.map((t, i) => (i === 4 ? '<span class="sep"></span>' : '') + `<button data-i="${i}" class="${i === tool ? 'on' : ''}" title="${t}" aria-label="${t}"><img src="${iconURL(TOOL_ICONS[i])}" alt="">${i < 7 ? `<span class="k">${i + 1}</span>` : ''}</button>`).join('');
  document.getElementById('toolName').textContent = s.tools[tool] || '';
  document.documentElement.lang = lang;
}

// ---------- 渲染器 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: TEST });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
mirrorThree(renderer);
const scene = new THREE.Scene();
// 桌面上的背景：一档一档的像素渐变（夜空 → 地平线的暖光），XR 里不画（黑 = 透明）
const BG = (() => {
  const cv = document.createElement('canvas'); cv.width = 1; cv.height = 64; const g = cv.getContext('2d');
  const stops = ['#0b1022', '#0e1530', '#131c3c', '#1a2548', '#222f52', '#2c3a5a', '#3a465e', '#4a5262', '#5a5a62'];
  for (let y = 0; y < 64; y++) { g.fillStyle = stops[Math.min(stops.length - 1, Math.floor(Math.pow(y / 64, 1.6) * stops.length))]; g.fillRect(0, y, 1, 1); }
  const t = new THREE.CanvasTexture(cv); t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.background = BG;
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.01, 20);
camera.position.set(0, 0.34, 0.44);
if (Q.get('cam')) { const c = Q.get('cam').split(',').map(Number); camera.position.set(c[0], c[1], c[2]); }
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.035, 0); if (Q.get('cam')) { const c = Q.get('cam').split(',').map(Number); if (c.length >= 6) controls.target.set(c[3], c[4], c[5]); }   // ?cam=x,y,z[,tx,ty,tz]
controls.enableDamping = true; controls.minDistance = 0.2; controls.maxDistance = 1.5; controls.maxPolarAngle = 1.45;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: null };
controls.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.update();

const world = new THREE.Group(); world.name = 'island'; scene.add(world);
const hemi = new THREE.HemisphereLight(0xe8f4ff, 0x9a8a70, 1.6); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xfff0d8, 2.2); world.add(sunL, sunL.target);

// 桌面上的"桌子"（XR 里隐藏：真桌子就在那）
const desk = new THREE.Mesh(new THREE.CircleGeometry(0.42, 64), new THREE.MeshBasicMaterial({ color: 0x141d2c }));
desk.rotation.x = -Math.PI / 2; desk.position.y = -0.0005; scene.add(desk);

// 发光物的混合（同萤群）：颜色相加，alpha 取亮度，Liquid 投屏不出黑边
const GLOW_BLEND = {
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor, transparent: true, depthWrite: false,
};
const AR_GLOW = {
  ...GLOW_BLEND, premultipliedAlpha: true,
  onBeforeCompile: s => { s.fragmentShader = s.fragmentShader.replace(/\}\s*$/, 'gl_FragColor.a = max(gl_FragColor.r, max(gl_FragColor.g, gl_FragColor.b));\n}'); },
};

// ---------- 共享 uniform：手影 / 云影 / 风 ----------
const U = {
  uTime: { value: 0 }, uIslInv: { value: new THREE.Matrix4() }, uWind: { value: new THREE.Vector2() },
  uSeg: { value: Array.from({ length: 12 }, () => new THREE.Vector4(9, 9, 9, 9)) },
  uSegR: { value: Array.from({ length: 12 }, () => new THREE.Vector2(0, 0)) },
  uCld: { value: Array.from({ length: 8 }, () => new THREE.Vector4(9, 9, 0, 0)) },
  uL: { value: new V3(0.3, 1, 0.2).normalize() },
  uLamp: { value: Array.from({ length: 16 }, () => new THREE.Vector4(0, 0, 0, 0)) },   // 夜里的灯：xyz + 亮度
  uSunSh: { value: null }, uSunK: { value: 0 }, uLavaL: { value: null },
};
// 太阳的投影：每根地形柱子算"高过多少才照得到太阳"（地形 + 树冠沿太阳方向往回找），存成 8 位高度图（0.6 mm 一档）
const SUNSH_N = A.NG, SUNSH_MAX = 0.15;
const sunShData = new Uint8Array(SUNSH_N * SUNSH_N);
const sunShTex = new THREE.DataTexture(sunShData, SUNSH_N, SUNSH_N, THREE.RedFormat, THREE.UnsignedByteType);
sunShTex.magFilter = sunShTex.minFilter = THREE.LinearFilter; sunShTex.unpackAlignment = 1; sunShTex.needsUpdate = true;
U.uSunSh.value = sunShTex;
// 岩浆照在周围的光：96×96 的亮度图，模糊两遍
const LAVAL_N = 96, lavaLData = new Uint8Array(LAVAL_N * LAVAL_N);
const lavaLTex = new THREE.DataTexture(lavaLData, LAVAL_N, LAVAL_N, THREE.RedFormat, THREE.UnsignedByteType);
lavaLTex.magFilter = lavaLTex.minFilter = THREE.LinearFilter; lavaLTex.unpackAlignment = 1; lavaLTex.needsUpdate = true;
U.uLavaL.value = lavaLTex;
// 影子：把手（6 段胶囊）和云（圆）沿太阳方向投到 y = 0 平面上，表面上的点也这样投，比 2D 距离
const SHADE_GLSL = `
uniform vec4 uSeg[12]; uniform vec2 uSegR[12]; uniform vec4 uCld[8]; uniform vec3 uL; uniform vec4 uLamp[16];
uniform sampler2D uSunSh, uLavaL; uniform float uSunK;
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-9), 0.0, 1.0); return length(pa - ba * h); }
float shadeAt(vec3 P) {
  vec2 p = P.xz - uL.xz * (P.y / uL.y);
  float s = 0.0;
  for (int i = 0; i < 12; i++) { vec2 r = uSegR[i]; if (r.x <= 0.0) continue; float d = segD(p, uSeg[i].xy, uSeg[i].zw); s = max(s, 1.0 - smoothstep(r.x - r.y, r.x + r.y, d)); }
  for (int i = 0; i < 8; i++) { vec4 c = uCld[i]; if (c.w <= 0.0) continue; float d = length(p - c.xy); s = max(s, c.w * (1.0 - smoothstep(c.z * 0.45, c.z, d))); }
  return s;
}
// 影子也按像素格算：格子中心取样，半影用 2×2 有序抖动（像素画的过渡办法），不出现平滑渐变
vec3 applyShade(vec3 col, vec3 P) {
  vec3 pc = floor(P / 0.0004);
  {
    vec2 uv = ((pc.xz + 0.5) * 0.0004 + ${S.R.toFixed(4)}) / ${(2 * S.R).toFixed(4)};
    float hs = texture(uSunSh, uv).r * ${SUNSH_MAX.toFixed(3)};
    float lit = smoothstep(hs - 0.0012, hs + 0.0002, (pc.y + 0.5) * 0.0004);
    // 斜阳的光影：受光面微暖、亮一点；背光处冷紫（不压黑：眼镜里暗 = 透明）
    col *= mix(vec3(1.0), mix(vec3(0.72, 0.72, 0.9), vec3(1.1, 1.03, 0.9), lit), uSunK);   // 暖的受光、冷紫的背光（Terraglass 的主色调）
    float L = texture(uLavaL, uv).r;
    col += col * vec3(1.1, 0.42, 0.12) * L * 1.3 + vec3(0.1, 0.03, 0.0) * L;   // 岩浆把周围照成橙色
  }
  float s = shadeAt((pc + 0.5) * 0.0004);
  float bayer = mod(pc.x, 2.0) * 0.5 + mod(pc.z + pc.y, 2.0) * 0.25 + 0.125;
  s = s > bayer + 0.12 ? 1.0 : 0.0;
  col = mix(col, col * vec3(0.4, 0.46, 0.7), s * 0.9);
  // 灯照在四周的一圈暖光：按距离分三档（像素画的光斑），不是平滑衰减
  float lp = 0.0;
  for (int i = 0; i < 16; i++) { vec4 l = uLamp[i]; if (l.w <= 0.0) continue; float d = length((pc + 0.5) * 0.0004 - l.xyz); lp += l.w * (d < 0.012 ? 1.0 : d < 0.02 ? 0.6 : d < 0.03 ? 0.3 : 0.0); }
  return col * (1.0 + vec3(0.45, 0.95, 0.8) * min(lp, 1.0)) + vec3(0.0, 0.03, 0.025) * min(lp, 1.0);   // 夜里的光只来自发光蘑菇：淡青色
}
`;
// 普通材质打补丁：接上手影，可选风吹摆动（sway = 高度乘数）
function patch(mat, sway = 0) {
  mat.onBeforeCompile = s => {
    for (const k of ['uTime', 'uIslInv', 'uWind', 'uSeg', 'uSegR', 'uCld', 'uL', 'uLamp', 'uSunSh', 'uSunK', 'uLavaL']) s.uniforms[k] = U[k];
    s.vertexShader = 'uniform mat4 uIslInv; uniform vec2 uWind; uniform float uTime; varying vec3 vIsl;\n' + s.vertexShader.replace('#include <project_vertex>', `
      vec4 ip = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        ip = instanceMatrix * ip;
      #endif
      ${sway ? `{ float hh = max(transformed.y, 0.0) * ${sway.toFixed(3)};
        vec3 il = (uIslInv * modelMatrix * ip).xyz;
        vec2 sw = uWind * (0.75 + 0.25 * sin(uTime * 7.0 + il.x * 90.0 + il.z * 70.0)) + 0.05 * vec2(sin(uTime * 1.9 + il.x * 60.0), cos(uTime * 1.5 + il.z * 50.0));
        ip.xz += sw * hh; }` : ''}
      vec4 mvPosition = modelViewMatrix * ip;
      gl_Position = projectionMatrix * mvPosition;
      vIsl = (uIslInv * modelMatrix * ip).xyz;`);
    s.fragmentShader = SHADE_GLSL + 'varying vec3 vIsl;\n' + s.fragmentShader.replace('#include <dithering_fragment>', 'gl_FragColor.rgb = applyShade(gl_FragColor.rgb, vIsl);\n#include <dithering_fragment>');
  };
  mat.customProgramCacheKey = () => 'shade' + sway;
  return mat;
}
const lam = (color, sway = 0, extra = {}) => patch(new THREE.MeshLambertMaterial({ color, ...extra }), sway);

// ---------- 世界状态 ----------

  P.hand(0, 'down', [m0.x, 0.17, m0.z]); F(60 * 6);
  ok('手掌朝下 → 下雨模式', trackers[0].mode === 'rain', trackers[0].mode);
  ok('手下有云且在下雨', w.clouds.length === 1 && w.clouds[0].rain > 0.5, JSON.stringify(w.clouds.map(c => c.rain.toFixed(2))));
  ok('草甸变湿', avg(w.M) > M0 + 0.2, `${M0.toFixed(2)} → ${avg(w.M).toFixed(2)}`);
  ok('识别环显示', rings[0].visible);
  renderOnce(); ok('雨丝 uniform 有值', rainU.uRain.value[0] > 0.5);
  for (let i = 0; i < 30; i++) { P.hand(0, 'edge', [-0.12 + i * 0.009, 0.14, 0.03], 0, 'right', [1, 0]); F(1); }
  ok('立掌横扫 → 风', Math.hypot(...w.wind) > 0.3, Math.hypot(...w.wind).toFixed(2));
  const pk = L.peaks[0];
  P.hand(0, 'fist', [pk.x + 0.01, 0.19, pk.z]); F(55);
  ok('握拳 → 蓄雷', trackers[0].mode === 'charge', trackers[0].mode);
  P.hand(0, 'down', [pk.x + 0.01, 0.19, pk.z]); F(8);
  ok('张开 → 劈下闪电', w.stats.strikes === 1, w.stats.strikes);
  ok('劈中山尖', w.lastStrike && w.lastStrike.name === 'peak', w.lastStrike && w.lastStrike.name);
  P.hand(0, null); F(60 * 18);
  ok('雨停后出彩虹', w.stats.rainbows >= 1, w.stats.rainbows);
  P.hand(0, 'up', [0, 0.14, 0.03]); F(60);
  ok('掌心朝上 → 放晴', trackers[0].mode === 'sun');
  P.hand(0, 'relaxed', [0.05, 0.13, 0.0]); F(30);
  ok('放松的手不触发', trackers[0].mode === 'idle', trackers[0].mode);
  updateShade([inject[0].J, null, null]); const sc = shadeForSim(); ok('手影落在岛上', Math.max(...sc) > 0.5, Math.max(...sc).toFixed(2));
  // 倒岩浆：流下去、发光、冷成石头
  pourKind = 'lava'; P.hand(0, 'pour', [0.03, 0.15, -0.045]); F(60 * 3);
  ok('立掌指尖朝下 → 倒', trackers[0].mode === 'pour', trackers[0].mode);
  const tot = MT.totals(mt); ok('岩浆倒进了岛', tot.lava + tot.rock > 0.005, (tot.lava + tot.rock).toFixed(4));
  P.hand(0, null); F(60 * 2, true); ok('岩浆方块画出来了', lavaMesh.count > 5, lavaMesh.count);
  // 左手菜单：左手掌心朝着头 → 菜单出来；右手食指尖点在"水"那一格 → 选中水
  {
    const cam = camera.position, lp = new V3(-0.06, 0.2, 0.2), n = cam.clone().sub(lp).normalize();
    inject[1] = { J: synthHand({ pos: lp.toArray(), n: n.toArray(), f: [0, 1, 0], curl: 0.05, handedness: 'left' }), hand: 'left' };
    F(3, true);
    ok('左手掌心朝向自己 → 菜单打开', menuMesh.visible && menuOpen, menuMesh.visible);
    // 第 0 格（水）在菜单上的世界坐标
    const target = new V3((0.5 / MCOLS - 0.5) * MENU_W, (0.5 - 0.5 / MROWS) * MENU_H, 0.004).applyMatrix4(menuMesh.matrixWorld);
    const J = synthHand({ pos: [target.x + 0.02, target.y - 0.02, target.z + 0.07], n: [0, -1, 0], f: [0, 0, -1], curl: 0.05 });
    const dx = target.x - J[27], dy = target.y - J[28], dz = target.z - J[29];
    for (let k = 0; k < 25; k++) { J[k * 3] += dx; J[k * 3 + 1] += dy; J[k * 3 + 2] += dz; }
    pourKind = 'lava'; inject[0] = { J, hand: 'right' }; F(30);
    ok('右手指尖点菜单 → 选中"水"', pourKind === 'water', pourKind);
    inject[1] = null; inject[0] = null; F(3);
    ok('左手放下 → 菜单收起', !menuMesh.visible);
    // 选中的水倒到干草甸上，地湿了
    const mk = S.cellsAround(L.meadows[2].x, L.meadows[2].z, 0.012), avgM = () => mk.reduce((s2, k) => s2 + w.M[k], 0) / mk.length;
    for (const k of mk) w.M[k] = 0.08;
    P.hand(0, null); F(30);   // 先把手放开：刚才点菜单的那只手速度还很大
    P.hand(0, 'pour', [L.meadows[2].x, 0.12, L.meadows[2].z]); F(90); P.hand(0, null); F(10);
    ok('放水 → 草甸湿了', avgM() > 0.3, avgM().toFixed(2));
    // 食物：动物会去吃
    pourKind = 'food'; const r = w.animals.find(a => a.sp === 'rabbit'); P.hand(0, null); F(20);
    const fx0 = r.x + 0.012, fz0 = r.z; let seenPour = 0;
    P.hand(0, 'pour', [fx0, 0.11, fz0]); for (let i = 0; i < 60; i++) { F(1); if (trackers[0].mode === 'pour') seenPour++; } P.hand(0, null); F(60 * 8);
    ok('放食物 → 有动物过来吃', w.food.length > 0 || w.stats.eaten > 0, `food=${w.food.length} eaten=${w.stats.eaten} pourFrames=${seenPour} pushes=${dbgCount.food} kind=${pourKind} walk=${S.walkable(fx0, fz0)} over=${trackers[0].over}`);
    // 雾霾、旋风
    pourKind = 'smog'; P.hand(0, 'pour', [0.08, 0.13, 0.08]); F(120); P.hand(0, null);
    ok('放雾霾 → 有霾', w.smogAvg > 0.003, w.smogAvg.toFixed(4));
    pourKind = 'whirl'; P.hand(0, 'pour', [0.08, 0.12, 0.08]); F(20); P.hand(0, null); F(2);
    ok('放旋风 → 出现旋风', w.whirls.length === 1, w.whirls.length);
    // 闪电道具：直接劈下去
    const s0 = w.stats.strikes; pourKind = 'lightning'; P.hand(0, null); F(20); P.hand(0, 'pour', [0.0, 0.14, 0.06]); F(40); P.hand(0, null); F(10);
    ok('闪电道具 → 劈下来', w.stats.strikes > s0, w.stats.strikes - s0);
    // 雪：雪云 + 积雪
    pourKind = 'snow'; P.hand(0, 'pour', [-0.02, 0.2, 0.06]); F(60 * 6); P.hand(0, null);
    ok('放雪 → 雪云在下雪、地上积雪', w.clouds.some(c => c.snow) && w.snowAvg > 0.001, w.snowAvg.toFixed(4));
    F(10);
  }
  // 鼠标走同一条管线
  const mx = L.meadows[3], p = new V3(mx.x, H(mx.x, mx.z), mx.z).project(camera);
  const cx = (p.x + 1) / 2 * innerWidth, cy = (1 - p.y) / 2 * innerHeight;
  controls.enabled = false;   // 合成的指针事件没法 setPointerCapture
  tool = 0;
  cv.dispatchEvent(new PointerEvent('pointermove', { clientX: cx, clientY: cy, bubbles: true }));
  cv.dispatchEvent(new PointerEvent('pointerdown', { clientX: cx, clientY: cy, button: 0, bubbles: true }));
  F(60);
  ok('鼠标左键按住 → 下雨', trackers[2].mode === 'rain', trackers[2].mode + ' over=' + trackers[2].over);
  const hc = w.clouds.find(c => c.holder === 2);
  ok('雨落在鼠标指的地方', hc && Math.hypot(hc.x - mx.x, hc.z - mx.z) < 0.02, hc && `${hc.x.toFixed(3)},${hc.z.toFixed(3)}`);
  window.dispatchEvent(new PointerEvent('pointerup', { button: 0, bubbles: true })); F(10);
  controls.enabled = true;
  // 光学透视暗部审计：黑底直接渲染，岛上暗到亮度 < 55（0–255）的像素占比；暗 = 眼镜里看不见
  const ostDark = () => {
    const bg = scene.background; scene.background = null; desk.visible = false; renderer.setClearColor(0, 0);
    renderer.render(scene, camera);
    const gl = renderer.getContext(), Wd = gl.drawingBufferWidth, Hd = gl.drawingBufferHeight, px = new Uint8Array(Wd * Hd * 4);
    gl.readPixels(0, 0, Wd, Hd, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let n = 0, d = 0; for (let i = 0; i < px.length; i += 4) { if (px[i + 3] < 200) continue; n++; if (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2] < 55) d++; }
    scene.background = bg; desk.visible = true; renderer.setClearColor(0, 1);
    return n ? d / n : 1;
  };
  const day0 = w.day; w.day = 0.45; F(2, true); const dDay = ostDark(); w.day = 0.9; F(2, true); const dNight = ostDark(); w.day = day0;
  ok('光学透视：白天暗部 < 4%', dDay < 0.04, (dDay * 100).toFixed(1) + '%');
  ok('光学透视：夜里暗部 < 8%', dNight < 0.08, (dNight * 100).toFixed(1) + '%');
  renderOnce();
  const pf = perf();
  ok('draw call 预算 ≤ 140', pf.calls <= 140, pf.calls);
  ok('三角面预算 ≤ 350k', pf.tris <= 350000, pf.tris);
  ok('没有报错', !(window.__errs || []).length, (window.__errs || []).join('|'));
  return checks;
}

// ---------- 启动 ----------
updateCells(); updatePlants();
const html = document.documentElement;
if (Q.has('scene')) applyScene(Q.get('scene'));
// 调试：?hide=water,clouds,fx … 隐藏指定名字的网格（排查画面问题用）
for (const n of (Q.get('hide') || '').split(',').filter(Boolean)) { const o = scene.getObjectByName(n); if (o) o.visible = false; }
if (Q.has('selftest')) {
  const checks = await selftest();
  html.dataset.selftest = JSON.stringify(checks);
  html.dataset.pass = checks.every(c => c.pass) ? '1' : '0';
  console.log(checks.map(c => (c.pass ? 'PASS ' : 'FAIL ') + c.name + ' ' + c.info).join('\n'));
}
renderOnce();
const pf = perf(); html.dataset.calls = pf.calls; html.dataset.tris = pf.tris;
html.dataset.ready = '1';
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  frame(dt);
  if (renderer.xr.isPresenting) renderer.render(scene, camera);
  else { controls.update(); composer.render(); }
});
</script>
