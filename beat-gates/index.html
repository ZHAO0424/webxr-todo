// ---------- 渲染 ----------

// 谱面在这里按分析结果生成：越响的段落环越密，响的段落强拍上出金环，安静的段落用光珠串连起来；音色越亮环越高
const TRACKS = [
  { id: 'elevator', file: 'music/elevator.mp3', stems: 'music/elevator-stems.mp3', miss: 0.3, title: 'Local Forecast', diff: 0 },
  { id: 'funkorama', file: 'music/funkorama.mp3', stems: 'music/funkorama-stems.mp3', miss: 0.15, title: 'Funkorama', diff: 1 },
  { id: 'disco', file: 'music/disco.mp3', stems: 'music/disco-stems.mp3', miss: 0.2, title: 'Disco con Tutti', diff: 1 },

const ANA = window.GATES_TRACKS || null;
let sel = 0, TR = TRACKS[0], CHART = [], NOTES = 0, SONG_LEN = 60, BEATS = [], PHASE = 0, LV = [], beatIdx = 0;
if (!ANA) console.error('music/tracks.js 没加载到');
const LV_COL = l => l < 0.35 ? C.cyan : l < 0.68 ? C.violet : C.pink;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 点精灵：光点、拖尾、火花、星星 ----------
const PMAX = 4000;

  const i = pN++;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pCol[i * 3] = c[0]; pCol[i * 3 + 1] = c[1]; pCol[i * 3 + 2] = c[2];

  pink: [1.0, 0.35, 0.8], cyan: [0.3, 0.85, 1.0], gold: [1.0, 0.8, 0.3], white: [1, 1, 1], violet: [0.65, 0.45, 1.0],
  red: [1.0, 0.25, 0.3], grey: [0.35, 0.35, 0.45], mint: [0.4, 1.0, 0.8],

// ---------- 光环：一块块面朝观者的方片（InstancedMesh），形状在片元着色器里画 ----------

// 隧道：每一拍一圈方框，正好在拍点上掠过手的平面
const TW = 0.55, TH = 0.32;
const tPos = new Float32Array(16 * 16 * 3), tCol = new Float32Array(tPos.length);

    glowText(g, s.pick, 512, 172, 28, '#d8b0cc', 'center');
    TRACKS.forEach((tr, i) => {

      glowText(g, s.diffs[tr.diff], cx, 330, 24, ['#8fffc0', '#ffd080', '#ff7090'][tr.diff], 'center', 400);
      glowText(g, `${s.best} ${bestOf(tr)}`, cx, 364, 20, '#a888a0', 'center');

    glowText(g, s.credit, 512, 484, 18, '#8a7090', 'center');

  } else if (state === 'over' || state === 'done') {

    if (done) glowText(g, gr.g, 200, 250, 190, gr.g === 'S' ? '#ffe07a' : '#ffb0e8', 'center', 200);
    const x0 = done ? 600 : 512;
    glowText(g, `${s.score}  ${score}`, x0, 175, 50, '#ffffff', 'center', 400);
    glowText(g, `${s.acc} ${(gr.acc * 100).toFixed(1)}%   ${s.maxCombo} ${maxCombo}`, x0, 245, 30, '#d8c0e0', 'center');
    glowText(g, `${s.perfect} ${nPerf} · ${s.good} ${nGood} · ${s.miss} ${nMiss} · ${s.snap} ${nSnap}`, x0, 300, 28, '#a8c8e0', 'center');

}

// ---------- 声音：曲子是解码好的 mp3（AudioBufferSourceNode，用音频时钟对拍）；判定音效是很短的噪声"刷"声，不带音高，不会和歌跑调 ----------
let AC = null, OUT, SFX, SPL, BEDG, LEADF, LEADG, NOISE, muted = false;
try { muted = localStorage.getItem('gates-mute') === '1'; } catch (e) { }
function initAudio() {

}
// 每首歌一个 <audio>，边下边播（不用整首解码进内存，眼镜上也快）；选中哪首就先缓冲哪首
function loadTrack(tr) {

  a.addEventListener('error', () => { tr.err = (a.error && a.error.code) || 1; panelDirty = true; console.error('load', tr.file, a.error); });
  a.load(); tr.el = a; return a;
}
function tone(f0, f1, dur, amp, type = 'sine', dst = SFX, T = null) {

function noise(f0, f1, dur, amp, q = 1, type = 'bandpass', dst = SFX, T = null) {

const ok = () => AC && !muted;
// 每首歌事先用 Demucs 拆成两轨：伴奏（鼓 + 贝斯）一直正常响；旋律（其余乐器）跟着判定走 ——
// 击中 → 旋律拉满、滤波全开；错过 → 旋律降到 15–30%、只剩低频（像闷在墙后面）；保持到下一个环判定。
// http(s) 打开时放分轨文件走 WebAudio；直接双击打开时浏览器不让 WebAudio 处理本地文件的声音，就放原混音、不做旋律开关
const useWA = /^https?:/.test(location.protocol);
const mix = { lvl: 0.6, tl: 0.6, cut: 0.6, tc: 0.6, fade: 1, fadeV: 0 };
const musicHit = () => { mix.tl = 1; mix.tc = 1; };

const musicMiss = () => { mix.tl = TR.miss || 0.15; mix.tc = 0; };

// 歌曲时间：audio.currentTime 在有的浏览器里更新得很粗（几十毫秒一跳），
// 所以用 performance.now() 往前推，每次 currentTime 变了再慢慢校正；最后减去声音输出的延迟
const song = {

    if (useWA && AC && !a._node) { try { a._node = AC.createMediaElementSource(a); a._node.connect(SPL); } catch (e) { console.warn('MediaElementSource', e); } }

let missT = 0, tickT = 0;
const sfx = {

  hit: perf => { if (!ok()) return; noise(2600, 1400, 0.07, perf ? 0.45 : 0.32, 1.1); tone(2400, 1200, 0.035, 0.12, 'triangle'); noise(9000, 7000, 0.08, perf ? 0.2 : 0.1, 1.5); if (perf) noise(13000, 11000, 0.18, 0.09, 2); },
  bead: () => ok() && noise(9500, 8500, 0.03, 0.07, 3),
  snap: () => { if (!ok()) return; noise(2400, 1100, 0.12, 0.35, 0.9); noise(12000, 9000, 0.35, 0.1, 2); },
  miss: () => { if (!ok() || AC.currentTime - missT < 0.08) return; missT = AC.currentTime; tone(140, 60, 0.16, 0.25, 'sine'); noise(400, 200, 0.12, 0.12, 1, 'lowpass'); },
  tick: () => { if (!ok() || AC.currentTime - tickT < 0.05) return; tickT = AC.currentTime; noise(5000, 4000, 0.03, 0.08, 2); },
  fail: () => { if (!ok()) return; noise(3000, 100, 1.2, 0.18, 0.7, 'lowpass'); },
  clear: () => { if (!ok()) return; noise(8000, 2000, 1.0, 0.12, 0.7); },

// ---------- 输入 ----------
// 头显：光点跟着右手走（不用捏；用食指根部的位置，捏合时它基本不动），手移多少光点移 GAIN 倍。
// 任意一只手捏合 = 捏（金环加分 / 开始）。只有一只手时就用那只手
const GAIN = 1.6;
const anchor = { set: false, x: 0, y: 0 };
const ctrls = [], hands = [], side = ['', ''];
const joint = (i, n) => { const j = hands[i].joints && hands[i].joints[n]; return j && j.visible !== false ? j : null; };
function handPos(i) {
  const k = joint(i, 'index-finger-metacarpal') || joint(i, 'wrist');
  if (k) return k.getWorldPosition(new V3());
  const c = ctrls[i]; if (c.userData.connected) return new V3().setFromMatrixPosition(c.matrixWorld);
  return null;
}
function steerHand() {
  let any = -1;
  for (let i = 0; i < 2; i++) { if (!handPos(i)) continue; if (side[i] === 'right') return i; if (any < 0 || side[any] === 'left') any = i; }
  return any;
}
// 标题画面捏合 = 开始选中的歌；结算画面（1.2 秒后）捏合 = 回到选歌
function act() { if (state === 'title') startGame(); else if (endT > 1.2) toTitle(); }
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i), h = renderer.xr.getHand(i);
  c.addEventListener('connected', e => { c.userData.connected = true; side[i] = (e.data && e.data.handedness) || ''; });
  c.addEventListener('disconnected', () => { c.userData.connected = false; side[i] = ''; });
  scene.add(c, h); ctrls.push(c); hands.push(h);
  c.addEventListener('selectstart', () => { initAudio(); if (state !== 'play') { act(); return; } pinch(); });
}
function xrControl() {
  const i = steerHand(); if (i < 0) return;
  const l = world.worldToLocal(handPos(i));
  if (!anchor.set) Object.assign(anchor, { set: true, x: l.x - cur.tx / GAIN, y: l.y - (cur.ty - PY0) / GAIN });
  const tx = (l.x - anchor.x) * GAIN, ty = PY0 + (l.y - anchor.y) * GAIN;
  const m = 0.02, cx = clamp(tx, -AX - m, AX + m), cy = clamp(ty, PY0 - AY - m, PY0 + AY + m);
  // 顶到边上时把基准跟着挪，手往回一动光点就离开边
  anchor.x += (tx - cx) / GAIN; anchor.y += (ty - cy) / GAIN;
  cur.tx = cx; cur.ty = cy;
}
// 桌面：鼠标指到平面上哪里，光点就去哪；点击 / 空格 = 捏
const rc = new THREE.Raycaster(), ndc = new THREE.Vector2(); let mouseOn = false;
const keys = new Set();
const cv = renderer.domElement;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointermove', e => { if (renderer.xr.isPresenting) return; ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); mouseOn = true; });
cv.addEventListener('pointerdown', e => {
  if (renderer.xr.isPresenting) return;
  initAudio(); ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); mouseOn = true;
  if (state !== 'play') { act(); return; }
  pinch();
});
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); initAudio(); if (state !== 'play') act(); else pinch(); }
  if (/^Digit[1-4]$/.test(e.code) && state === 'title') { sel = +e.code[5] - 1; cur.tx = cardX(sel); panelDirty = true; if (ANA) loadTrack(TRACKS[sel]); }
  if (e.code === 'KeyR' && renderer.xr.isPresenting) { needPlace = true; anchor.set = false; }
  if (/^(Arrow|Key[WASD])/.test(e.code)) mouseOn = false;

addEventListener('keyup', e => keys.delete(e.code));
const pPlane = new THREE.Plane(new V3(0, 0, 1), -PZ);
function deskControl(dt) {
  let kx = 0, ky = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) kx--;
  if (keys.has('KeyD') || keys.has('ArrowRight')) kx++;
  if (keys.has('KeyW') || keys.has('ArrowUp')) ky++;
  if (keys.has('KeyS') || keys.has('ArrowDown')) ky--;

}

document.getElementById('lang').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; try { localStorage.setItem('gates-lang', lang); } catch (e) { } applyLang(); };
document.getElementById('mute').onclick = () => {
  muted = !muted; try { localStorage.setItem('gates-mute', muted ? '1' : '0'); } catch (e) { }
  initAudio(); OUT.gain.setTargetAtTime(muted ? 0 : 0.9, AC.currentTime, 0.05); for (const tr of TRACKS) if (tr.el) tr.el.muted = tr.el._node ? false : muted; applyLang();
};

// ---------- XR 摆放 ----------
let needPlace = false, placeWait = 0;
renderer.xr.addEventListener('sessionstart', () => { needPlace = true; placeWait = 0; anchor.set = false; document.getElementById('card').style.opacity = 0; document.getElementById('btns').style.opacity = 0; });
renderer.xr.addEventListener('sessionend', () => { world.position.set(0, 0, 0); world.rotation.set(0, 0, 0); document.getElementById('card').style.opacity = 1; document.getElementById('btns').style.opacity = 1; onResize(); });
function place() {
  const cam = renderer.xr.getCamera(), p = new V3().setFromMatrixPosition(cam.matrixWorld);
  const d = new V3(0, 0, -1).transformDirection(cam.matrixWorld);
  world.position.copy(p); world.rotation.set(0, Math.atan2(-d.x, -d.z), 0); needPlace = false; anchor.set = false;
}

// ---------- 桌面后处理 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.45, 0.45);
composer.addPass(bloom); composer.addPass(new OutputPass());
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 64 : 30;
  if (innerWidth > 900) camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.1, 0, innerWidth, innerHeight); else camera.clearViewOffset();

addEventListener('resize', onResize); onResize();

applyLang();
if (ANA) loadTrack(TRACKS[0]);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(1 / 30, clock.getDelta()), t = clock.elapsedTime, xr = renderer.xr.isPresenting;
  if (needPlace && xr && ++placeWait > 5) place();

  world.updateMatrixWorld();

  pMat.uniforms.uScale.value = xr ? ((renderer.xr.getCamera().cameras[0] || {}).viewport || { w: 1200 }).w / 2 : renderer.domElement.height / 2;

// 测试用
window.__gates = { get state() { return state; }, TRACKS, mix, get node() { return !!(song.el && song.el._node); }, get vol() { return song.el ? song.el.volume : -1; }, get sel() { return sel; }, get chart() { return CHART; }, get beats() { return BEATS; }, get score() { return score; }, get combo() { return combo; }, get health() { return health; }, set health(v) { health = v; }, get songV() { return songV; }, cur, vis, startGame, stats: () => ({ nPerf, nGood, nMiss, nSnap, nBead, maxCombo, NOTES }) };
